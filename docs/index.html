function simpleMd2Html(md) {
  let html = md;

  // === Step 0: Protect code blocks and LaTeX formulas ===
  const placeholders = [];

  function protect(match, prefix) {
    const idx = placeholders.length;
    placeholders.push(match);
    return `%%PH_${idx}%%`;
  }

  // 0a) Code blocks (```...```)
  html = html.replace(/```[\s\S]*?```/g, m => protect(m, 'code'));

  // 0b) Inline code (`...`)
  html = html.replace(/`([^`]+)`/g, m => protect(m, 'icode'));

  // 0c) Display math: $$...$$
  html = html.replace(/\$\$([\s\S]*?)\$\$/g, m => protect(m, 'dmath'));

  // 0d) \begin{env}...\end{env} standalone
  html = html.replace(/\\begin\{(\w+\*?)\}([\s\S]*?)\\end\{\1\}/g, m => protect(m, 'env'));

  // 0e) \[...\] display math
  html = html.replace(/\\\[[\s\S]*?\\\]/g, m => protect(m, 'dmath'));

  // 0f) \(...\) inline math
  html = html.replace(/\\\((.+?)\\\)/g, m => protect(m, 'imath'));

  // 0g) Inline math: $...$ (not escaped, single line)
  html = html.replace(/(?<!\$)\$(?!\$)([^\$\n]+?)(?<!\$)\$(?!\$)/g, m => protect(m, 'imath'));

  // Now safe to process Markdown without touching protected areas

  // Headings
  html = html.replace(/^#### (.+)$/gm, '<h5>$1</h5>');
  html = html.replace(/^### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^# (.+)$/gm, '<h2>$1</h2>');

  // Bold and italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Links (but skip protected placeholders)
  html = html.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank">$1</a>');

  // Images
  html = html.replace(/!\[(.+?)\]\((.+?)\)/g, (match, alt, src) => {
    const isProcess = /process/i.test(src) || /流程/i.test(alt) || /架构/i.test(alt);
    const cls = isProcess ? 'notes-img process-diagram' : 'notes-img';
    return `<div class="notes-img-wrap ${isProcess ? 'highlight' : ''}">
      <img src="${src}" alt="${escapeHtml(alt)}" class="${cls}" loading="lazy" onerror="this.parentElement.style.display='none'">
      ${alt ? `<p class="notes-img-caption">${escapeHtml(alt)}</p>` : ''}
      ${isProcess ? '<span class="badge-process">📐 数学流程图</span>' : ''}
    </div>`;
  });

  // Tables
  html = html.replace(/(\|.+\|\n\|[-| :]+\|\n((?:\|.+\|\n?)*))/g, match => {
    const rows = match.trim().split('\n').filter(r => !r.match(/^\|[-| :]+\|$/));
    const thead = rows[0].split('|').filter(c => c.trim()).map(c => `<th>${c.trim()}</th>`).join('');
    let tbody = '';
    for (let i = 1; i < rows.length; i++) {
      const cells = rows[i].split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
      tbody += `<tr>${cells}</tr>`;
    }
    return `<table class="notes-table"><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table>`;
  });

  // Blockquotes
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

  // Horizontal rules
  html = html.replace(/^---$/gm, '<hr>');

  // Unordered lists
  html = html.replace(/^((?:- .+\n?)+)/gm, match => {
    const items = match.trim().split('\n').filter(l => l.startsWith('- ')).map(l => `<li>${l.slice(2)}</li>`).join('');
    return `<ul>${items}</ul>`;
  });

  // Ordered lists
  html = html.replace(/^((?:\d+\. .+\n?)+)/gm, match => {
    const items = match.trim().split('\n').filter(l => /^\d+\. /.test(l)).map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
    return `<ol>${items}</ol>`;
  });

  // Paragraphs (double newlines)
  const blocks = html.split(/\n\n+/);
  html = blocks.map(b => {
    b = b.trim();
    if (!b) return '';
    if (/^<(h[1-6]|ul|ol|table|pre|blockquote|hr|%%PH_)/.test(b)) return b;
    return `<p>${b.replace(/\n/g, '<br>')}</p>`;
  }).join('\n');

  // === Final: Restore all protected content ===
  placeholders.forEach((original, idx) => {
    if (original.startsWith('```')) {
      // Code block → <pre><code>escaped content</code></pre>
      const content = original.replace(/```\w*\n?/, '').replace(/```$/, '');
      html = html.replace(`%%PH_${idx}%%`, `<pre><code>${escapeHtml(content.trim())}</code></pre>`);
    } else if (original.startsWith('`') && !original.startsWith('```')) {
      // Inline code → <code>escaped content</code>
      const content = original.replace(/^`/, '').replace(/`$/, '');
      html = html.replace(`%%PH_${idx}%%`, `<code>${escapeHtml(content)}</code>`);
    } else {
      // LaTeX formulas → keep raw for KaTeX rendering
      html = html.replace(`%%PH_${idx}%%`, original);
    }
  });

  return html;
}

async function loadNotes(url) {
  const loadingEl = document.getElementById('notesLoading');
  const contentEl = document.getElementById('notesContent');
  const errorEl = document.getElementById('notesError');

  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const md = await resp.text();
    let html = simpleMd2Html(md);

    // Detect and convert walkthrough sections into interactive steppers
    // Match two title variants: "数学推导过程详解 (Mathematical Walkthrough)" and "数学过程推导 Walkthrough"
    html = html.replace(
      /<h3>([^<]*(?:数学(?:推导)?过程(?:推导)?详解|Walkthrough)[^<]*)<\/h3>([\s\S]*?)(?=<h3>[^<]*(?:实验与效果|四、))/g,
      (match, title, body) => {
        return buildStepper(title, body);
      }
    );
    // Fallback: catch if experiment heading doesn't immediately follow
    if (!html.includes('walkthrough-stepper')) {
      html = html.replace(
        /<h3>([^<]*(?:数学(?:推导)?过程(?:推导)?详解|Walkthrough)[^<]*)<\/h3>([\s\S]*?)(?=<h3>)/g,
        (match, title, body) => {
          if (body.includes('walkthrough-stepper')) return match;
          return buildStepper(title, body);
        }
      );
    }

    contentEl.innerHTML = html;
    contentEl.classList.add('show');
    if (loadingEl) loadingEl.style.display = 'none';
    if (errorEl) errorEl.style.display = 'none';

    // Re-render math in stepper content
    if (typeof renderMathInElement === 'function') {
      setTimeout(() => {
        renderMathInElement(contentEl, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false},
            {left: '\\[', right: '\\]', display: true}
          ],
          throwOnError: false
        });
      }, 100);
    }

    // Attach lightbox to all images
    contentEl.querySelectorAll('.notes-img-wrap img').forEach(img => {
      img.addEventListener('click', () => {
        const lb = document.createElement('div');
        lb.className = 'notes-lightbox';
        lb.innerHTML = `<img src="${img.src}" alt="${img.alt}">`;
        lb.addEventListener('click', () => lb.remove());
        document.body.appendChild(lb);
      });
    });

    // Init all steppers
    initSteppers();
  } catch (err) {
    console.error('Failed to load notes:', err);
    if (loadingEl) loadingEl.style.display = 'none';
    if (errorEl) errorEl.classList.add('show');
  }
}

function buildStepper(title, bodyHtml) {
  // Parse individual steps from the HTML body
  // Steps start with <h4>Step N: or <h4>### Step N: patterns
  const stepRegex = /<h4>([^<]*(?:Step\s+\d+|步骤\s*\d+)[^<]*)<\/h4>/gi;
  let stepMatches = [];
  let m;
  while ((m = stepRegex.exec(bodyHtml)) !== null) {
    stepMatches.push({ title: m[1], index: m.index });
  }

  // If no explicit "Step N" headings found, try splitting by <h4> or <h5> headings
  if (stepMatches.length === 0) {
    const h4Regex = /<h[45]>([^<]+)<\/h[45]>/gi;
    while ((m = h4Regex.exec(bodyHtml)) !== null) {
      stepMatches.push({ title: m[1], index: m.index });
    }
  }

  // Build step content array
  let steps = [];
  for (let i = 0; i < stepMatches.length; i++) {
    const start = stepMatches[i].index;
    const end = i + 1 < stepMatches.length ? stepMatches[i + 1].index : bodyHtml.length;
    let content = bodyHtml.substring(start, end);
    // Remove the heading from content (it goes in step label)
    content = content.replace(/^<h[45][^>]*>[^<]+<\/h[45]>\n?/, '');
    steps.push({
      label: stepMatches[i].title,
      content: content.trim()
    });
  }

  // Fallback: if still no steps, make the whole body one step
  if (steps.length === 0) {
    steps.push({ label: '完整流程', content: bodyHtml.trim() });
  }

  const stepId = 'stepper_' + Math.random().toString(36).substr(2, 6);
  const totalSteps = steps.length;

  let stepsHtml = steps.map((s, i) => `
    <div class="stepper-step ${i === 0 ? 'active' : ''}" data-step="${i}">
      <div class="stepper-step-title">
        <div class="stepper-step-num">${i + 1}</div>
        <div class="stepper-step-label">${s.label}</div>
      </div>
      <div class="stepper-step-body">${s.content}</div>
    </div>
  `).join('');

  let dotsHtml = steps.map((_, i) => `
    <div class="stepper-dot ${i === 0 ? 'active' : ''}" data-target="${i}" onclick="goToStep('${stepId}', ${i})">${i + 1}</div>
  `).join('');

  return `
    <div class="walkthrough-stepper" id="${stepId}">
      <div class="stepper-header" onclick="toggleStepperAll('${stepId}')">
        <div class="stepper-header-left">
          <svg viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          <span>${title}</span>
        </div>
        <div class="stepper-progress">
          <span class="stepper-progress-text">0/${totalSteps}</span>
          <div class="stepper-progress-bar"><div class="stepper-progress-fill" style="width:0%"></div></div>
        </div>
      </div>
      <div class="stepper-nav">
        <div class="stepper-dots">${dotsHtml}</div>
        <div class="stepper-btns">
          <button class="stepper-btn" onclick="expandAllSteps('${stepId}')">展开全部</button>
          <button class="stepper-btn" onclick="collapseSteps('${stepId}')">折叠</button>
          <button class="stepper-btn" onclick="prevStep('${stepId}')" id="${stepId}_prev">&#9664; 上一步</button>
          <button class="stepper-btn primary" onclick="nextStep('${stepId}')" id="${stepId}_next">下一步 &#9654;</button>
        </div>
      </div>
      <div class="stepper-steps">${stepsHtml}</div>
    </div>
  `;
}

function initSteppers() {
  document.querySelectorAll('.walkthrough-stepper').forEach(sp => {
    const id = sp.id;
    updateStepperUI(id, 0);
  });
}

function goToStep(stepperId, stepIdx) {
  const stepper = document.getElementById(stepperId);
  if (!stepper) return;
  const steps = stepper.querySelectorAll('.stepper-step');
  if (stepIdx < 0 || stepIdx >= steps.length) return;

  steps.forEach((s, i) => {
    s.classList.remove('active', 'visible');
    if (i === stepIdx) {
      s.classList.add('active', 'visible');
    }
  });

  stepper.querySelectorAll('.stepper-dot').forEach((d, i) => {
    d.classList.remove('active', 'done');
    if (i === stepIdx) d.classList.add('active');
    else if (i < stepIdx) d.classList.add('done');
  });

  updateStepperUI(stepperId, stepIdx);

  // Re-render math in the newly visible step
  if (typeof renderMathInElement === 'function') {
    const activeStep = stepper.querySelector('.stepper-step.active .stepper-step-body');
    if (activeStep) {
      setTimeout(() => {
        renderMathInElement(activeStep, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false},
            {left: '\\[', right: '\\]', display: true}
          ],
          throwOnError: false
        });
      }, 50);
    }
  }
}

function prevStep(stepperId) {
  const stepper = document.getElementById(stepperId);
  const current = parseInt(stepper.querySelector('.stepper-dot.active')?.dataset.target || '0');
  goToStep(stepperId, Math.max(0, current - 1));
}

function nextStep(stepperId) {
  const stepper = document.getElementById(stepperId);
  const steps = stepper.querySelectorAll('.stepper-step');
  const current = parseInt(stepper.querySelector('.stepper-dot.active')?.dataset.target || '0');
  goToStep(stepperId, Math.min(steps.length - 1, current + 1));
}

function expandAllSteps(stepperId) {
  const stepper = document.getElementById(stepperId);
  stepper.querySelectorAll('.stepper-step').forEach(s => s.classList.add('visible'));
  stepper.querySelectorAll('.stepper-dot').forEach(d => d.classList.add('done'));
  const steps = stepper.querySelectorAll('.stepper-step');
  const progressFill = stepper.querySelector('.stepper-progress-fill');
  const progressText = stepper.querySelector('.stepper-progress-text');
  if (progressFill) progressFill.style.width = '100%';
  if (progressText) progressText.textContent = `${steps.length}/${steps.length}`;
}

function collapseSteps(stepperId) {
  goToStep(stepperId, 0);
}

function toggleStepperAll(stepperId) {
  const stepper = document.getElementById(stepperId);
  const nav = stepper.querySelector('.stepper-nav');
  const stepsContainer = stepper.querySelector('.stepper-steps');
  if (nav.style.display === 'none') {
    nav.style.display = '';
    stepsContainer.style.display = '';
  } else {
    nav.style.display = 'none';
    stepsContainer.style.display = 'none';
  }
}

function updateStepperUI(stepperId, currentIdx) {
  const stepper = document.getElementById(stepperId);
  if (!stepper) return;
  const steps = stepper.querySelectorAll('.stepper-step');
  const progressFill = stepper.querySelector('.stepper-progress-fill');
  const progressText = stepper.querySelector('.stepper-progress-text');
  const prevBtn = document.getElementById(stepperId + '_prev');
  const nextBtn = document.getElementById(stepperId + '_next');

  if (progressFill) progressFill.style.width = `${((currentIdx + 1) / steps.length) * 100}%`;
  if (progressText) progressText.textContent = `${currentIdx + 1}/${steps.length}`;
  if (prevBtn) prevBtn.disabled = currentIdx === 0;
  if (nextBtn) nextBtn.disabled = currentIdx === steps.length - 1;
}

// ============================================================
const STATUS_KEY = 'paper_library_status';
const STATUS_FLOW = ['待读', '精读中', '已读', '已复现'];

function loadStatusFromStorage() {
  try {
    const saved = localStorage.getItem(STATUS_KEY);
    return saved ? JSON.parse(saved) : {};
  } catch { return {}; }
}

function saveStatusToStorage() {
  const map = {};
  allPapers.forEach(p => { map[p.title] = p.status; });
  localStorage.setItem(STATUS_KEY, JSON.stringify(map));
}

function applySavedStatus() {
  const saved = loadStatusFromStorage();
  allPapers.forEach(p => {
    if (saved[p.title] && STATUS_FLOW.includes(saved[p.title])) {
      p.status = saved[p.title];
    }
  });
}

function setStatus(idx, newStatus) {
  const p = allPapers[idx];
  if (!p) return;
  p.status = newStatus;
  saveStatusToStorage();
  recordActivity(p.title, newStatus);
  renderStats();
  renderPapers();
  renderHeatmap();
  showToast(`${p.title.length > 20 ? p.title.slice(0, 20) + '...' : p.title} → ${newStatus}`);
}

// Toast notification
function showToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.className = 'toast show';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.className = 'toast'; }, 2000);
}

let compareMode = false;

document.getElementById('btnCompare').addEventListener('click', () => {
  compareMode = !compareMode;
  selectedCompare = [];
  const btn = document.getElementById('btnCompare');

  if (compareMode) {
    btn.classList.add('active');
    btn.innerHTML = '📊 选择中 (0/4)';
    document.querySelectorAll('.paper-card.fade-in').forEach(card => {
      card.classList.add('compare-mode-card');
      card.addEventListener('click', handleCompareClick);
    });
  } else {
    btn.classList.remove('active');
    btn.innerHTML = '📊 对比';
    cancelCompareMode();
  }
});

function handleCompareClick(e) {
  e.stopPropagation();
  const card = e.currentTarget;
  const idx = parseInt(card.dataset.idx);
  if (isNaN(idx)) return;

  const p = allPapers[idx];
  if (!p) return;

  const existIdx = selectedCompare.findIndex(s => s.idx === idx);
  if (existIdx >= 0) {
    selectedCompare.splice(existIdx, 1);
    card.classList.remove('selected-compare');
  } else {
    if (selectedCompare.length >= 4) return; // max 4 for AI pairing
    selectedCompare.push({ idx, paper: p });
    card.classList.add('selected-compare');
  }

  const btn = document.getElementById('btnCompare');
  btn.innerHTML = `📊 选择中 (${selectedCompare.length}/4)`;

  if (selectedCompare.length === 2) {
    setTimeout(() => openCompareModal(selectedCompare[0].paper, selectedCompare[1].paper), 200);
  }
}

function cancelCompareMode() {
  compareMode = false;
  selectedCompare = [];
  document.querySelectorAll('.paper-card.fade-in').forEach(card => {
    card.classList.remove('compare-mode-card', 'selected-compare', 'compare-disabled');
    card.removeEventListener('click', handleCompareClick);
  });
  const btn = document.getElementById('btnCompare');
  btn.classList.remove('active');
  btn.innerHTML = '📊 对比';
}

//  Card Animations: Tilt + Fade-in
// ============================================================
let tiltCards = [];
let fadeObserver = null;

function initCardAnimations() {
  // Tilt effect
  tiltCards = document.querySelectorAll('.paper-card.fade-in');
  tiltCards.forEach(card => {
    card.addEventListener('mousemove', handleTilt);
    card.addEventListener('mouseleave', resetTilt);
  });

  // Fade-in observer with Tween enhancement
  if (fadeObserver) fadeObserver.disconnect();
  var cardIdx = 0;
  fadeObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        var card = entry.target;
        // Use Tween for smooth entrance
        if (typeof TWEEN !== 'undefined') {
          tweenCardEntrance(card, cardIdx * 50);
          cardIdx++;
        } else {
          card.classList.add('visible');
        }
        fadeObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -20px 0px' });

  document.querySelectorAll('.paper-card.fade-in').forEach(card => {
    fadeObserver.observe(card);
  });
}

function handleTilt(e) {
  const card = e.currentTarget;
  const rect = card.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const centerX = rect.width / 2;
  const centerY = rect.height / 2;
  const rotateX = ((y - centerY) / centerY) * -3;
  const rotateY = ((x - centerX) / centerX) * 3;
  card.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-2px)`;
  card.style.transition = 'transform 0.1s ease-out';
}

function resetTilt(e) {
  const card = e.currentTarget;
  card.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) translateY(0px)';
  card.style.transition = 'transform 0.4s ease-out';
}

// ============================================================
//  Heatmap (GitHub-style contribution grid)
// ============================================================
function renderHeatmap() {
  const grid = document.getElementById('heatmapGrid');
  const monthsRow = document.getElementById('heatmapMonths');
  const weekdaysCol = document.getElementById('heatmapWeekdays');
  if (!grid || !monthsRow || !weekdaysCol) return;

  // Build activity map from paper dates + status change history
  const activityMap = {};

  // 1) Count papers added per day (from paper.date field)
  allPapers.forEach(p => {
    if (p.date) {
      const d = parseDateKey(p.date);
      if (d) activityMap[d] = (activityMap[d] || 0) + 1;
    }
  });

  // 2) Load status change history from localStorage
  try {
    const history = JSON.parse(localStorage.getItem('paper_activity_history') || '{}');
    for (const [dateKey, count] of Object.entries(history)) {
      activityMap[dateKey] = (activityMap[dateKey] || 0) + count;
    }
  } catch {}

  // Show last 20 weeks (140 days) + today
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const startDate = new Date(today);
  startDate.setDate(startDate.getDate() - 139);

  // Align to Sunday
  const dayOfWeek = startDate.getDay();
  startDate.setDate(startDate.getDate() - dayOfWeek);

  const totalWeeks = 21;
  const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  // Generate weekday labels (left column): show Mon/Wed/Fri only
  let weekdayHtml = '';
  for (let row = 0; row < 7; row++) {
    const showLabel = (row === 1 || row === 3 || row === 5);
    weekdayHtml += `<div class="heatmap-weekday-label ${showLabel ? '' : 'empty'}">${showLabel ? '周' + dayNames[row] : ''}</div>`;
  }
  weekdaysCol.innerHTML = weekdayHtml;

  // Generate month labels (top row)
  const monthLabelMap = new Array(totalWeeks).fill('');
  for (let col = 0; col < totalWeeks; col++) {
    const firstDayOfCol = new Date(startDate);
    firstDayOfCol.setDate(firstDayOfCol.getDate() + col * 7);
    const m = firstDayOfCol.getMonth();
    const y = firstDayOfCol.getFullYear();
    if (col === 0) {
      monthLabelMap[col] = `${y}年${monthNames[m]}`;
    } else {
      const prevDay = new Date(startDate);
      prevDay.setDate(prevDay.getDate() + (col - 1) * 7);
      if (prevDay.getMonth() !== m) {
        monthLabelMap[col] = monthNames[m];
      }
    }
  }

  let monthsHtml = '';
  for (let col = 0; col < totalWeeks; col++) {
    monthsHtml += `<div class="heatmap-month-label" style="width:13px;">${monthLabelMap[col]}</div>`;
  }
  monthsRow.innerHTML = monthsHtml;

  // Generate grid columns (single pass, no redundancy)
  let gridHtml = '';
  for (let col = 0; col < totalWeeks; col++) {
    gridHtml += '<div class="heatmap-column">';
    for (let row = 0; row < 7; row++) {
      const cellDate = new Date(startDate);
      cellDate.setDate(cellDate.getDate() + col * 7 + row);
      const key = dateKey(cellDate);
      const count = activityMap[key] || 0;

      let level = 0;
      if (count >= 1 && count <= 2) level = 1;
      else if (count >= 3 && count <= 4) level = 2;
      else if (count >= 5 && count <= 7) level = 3;
      else if (count >= 8 && count <= 11) level = 4;
      else if (count >= 12) level = 5;

      const ymd = cellDate.toISOString().split('T')[0];
      const weekdayText = '周' + dayNames[cellDate.getDay()];
      gridHtml += `<div class="heatmap-cell level-${level}"
        data-date="${ymd}"
        data-count="${count}"
        data-weekday="${weekdayText}"
        title="${ymd} ${weekdayText}：${count} 次操作"></div>`;
    }
    gridHtml += '</div>';
  }

  if (gridHtml) {
    grid.innerHTML = gridHtml;
    // Sync month label width with cell width for responsive alignment
    const cells = grid.querySelectorAll('.heatmap-cell');
    const labels = monthsRow.querySelectorAll('.heatmap-month-label');
    const cellW = cells.length ? cells[0].offsetWidth : 13;
    labels.forEach(l => l.style.width = cellW + 'px');
  } else {
    grid.innerHTML = '<div class="heatmap-empty">暂无添加记录</div>';
  }
}

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function parseDateKey(str) {
  // Parse "2026-07-01" format
  const m = str.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return null;
}

function recordActivity(paperTitle, action) {
  const today = dateKey(new Date());
  try {
    const history = JSON.parse(localStorage.getItem('paper_activity_history') || '{}');
    history[today] = (history[today] || 0) + 1;
    localStorage.setItem('paper_activity_history', JSON.stringify(history));
  } catch {}
}

      <div style="font-weight:600;margin-bottom:4px;">${date} ${weekday}</div>
      <div style="font-size:13px;color:var(--text-dim);">当日操作：${count} 次</div>
    `;

    const rect = el.getBoundingClientRect();
    let left = rect.left + rect.width / 2 - tooltip.offsetWidth / 2;
    let top = rect.top - tooltip.offsetHeight - 8;
    if (left < 8) left = 8;
    if (left + tooltip.offsetWidth > window.innerWidth - 8) {
      left = window.innerWidth - tooltip.offsetWidth - 8;
    }
    if (top < 8) top = rect.bottom + 8;
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
  }

  function hideTooltip() {
    tooltip.classList.remove('visible');
  }

  grid.addEventListener('mouseover', (e) => {
    const cell = e.target.closest('.heatmap-cell');

function initActivationChart() {
  const dom = document.getElementById('echarts-activation');
  if (!dom) return;
  const chart = echarts.init(dom, 'dark');
  
  // Generate data points
  var xData = [];
  for (var x = -6; x <= 6; x += 0.1) { xData.push(Math.round(x * 100) / 100); }
  
  function relu(x) { return Math.max(0, x); }
  function leakyRelu(x) { return x > 0 ? x : 0.1 * x; }
  function gelu(x) { return 0.5 * x * (1 + Math.tanh(Math.sqrt(2 / Math.PI) * (x + 0.044715 * Math.pow(x, 3)))); }
  function sigmoid(x) { return 1 / (1 + Math.exp(-x)); }
  function tanh(x) { return Math.tanh(x); }
  
  function makeData(fn) { return xData.map(fn); }
  
  var option = {
    backgroundColor: 'transparent',
    tooltip: { trigger: 'axis', textStyle: { fontSize: 12 } },
    legend: {
      data: ['ReLU', 'LeakyReLU', 'GELU', 'Sigmoid', 'Tanh'],
      bottom: 0,
      textStyle: { color: '#94a3b8', fontSize: 11 },
      itemWidth: 16
    },
    grid: { left: 50, right: 20, top: 20, bottom: 50 },
    xAxis: {
      type: 'category', data: xData,
      axisLabel: { color: '#64748b', fontSize: 10, interval: 29 },
      axisLine: { lineStyle: { color: 'rgba(99,102,241,0.2)' } },
      splitLine: { show: false }

    },
    series: [
      { name: 'ReLU', type: 'line', smooth: true, symbol: 'none', lineStyle: { width: 2, color: '#6366f1' }, data: makeData(relu) },
      { name: 'LeakyReLU', type: 'line', smooth: true, symbol: 'none', lineStyle: { width: 2, color: '#f59e0b' }, data: makeData(leakyRelu) },
      { name: 'GELU', type: 'line', smooth: true, symbol: 'none', lineStyle: { width: 2, color: '#22c55e' }, data: makeData(gelu) },
      { name: 'Sigmoid', type: 'line', smooth: true, symbol: 'none', lineStyle: { width: 2, color: '#06b6d4' }, data: makeData(sigmoid) },
      { name: 'Tanh', type: 'line', smooth: true, symbol: 'none', lineStyle: { width: 2, color: '#a855f7' }, data: makeData(tanh) }

function initGradientChart() {
  const dom = document.getElementById('echarts-gradient');
  if (!dom) return;
  const chart = echarts.init(dom, 'dark');
  
  // Simulated training loss curves
  var epochs = [];
  var sgdLoss = [], momentumLoss = [], adamLoss = [];
  var s = 3.0, m = 3.0, a = 3.0;
  
  for (var i = 0; i <= 200; i++) {
    epochs.push(i);
    // SGD: slow, noisy convergence
    s = 0.5 + 2.5 * Math.exp(-0.012 * i) + 0.15 * Math.sin(i * 0.3) * Math.exp(-0.005 * i);
    sgdLoss.push(Math.round(s * 100) / 100);
    // Momentum: faster, smoother
    m = 0.5 + 2.5 * Math.exp(-0.025 * i) + 0.05 * Math.sin(i * 0.2) * Math.exp(-0.01 * i);
    momentumLoss.push(Math.round(m * 100) / 100);
    // Adam: fastest convergence
    a = 0.5 + 2.5 * Math.exp(-0.04 * i) + 0.02 * Math.sin(i * 0.15) * Math.exp(-0.02 * i);
    adamLoss.push(Math.round(a * 100) / 100);
  }
  
  var option = {
    backgroundColor: 'transparent',
    tooltip: { trigger: 'axis' },
    legend: {

function initLossSurface() {
  const dom = document.getElementById('echarts-loss-surface');
  if (!dom) return;
  const chart = echarts.init(dom, 'dark');
  
  var xData = [];
  for (var x = -3; x <= 3; x += 0.05) { xData.push(Math.round(x * 100) / 100); }
  
  function mse(e) { return e * e; }
  function ce(e) {
    // Cross-entropy like: -log(sigmoid(e)) approximation
    var s = 1 / (1 + Math.exp(-e));
    return s > 0.001 ? -Math.log(s) : 7;
  }
  function huber(e) {
    var d = Math.abs(e);
    return d <= 1 ? 0.5 * e * e : d - 0.5;
  }
  function smoothL1(e) {
    var d = Math.abs(e);
    return d < 1 ? 0.5 * e * e : d - 0.5;
  }
  
  function makeData(fn) { return xData.map(fn); }
  
  var option = {
    backgroundColor: 'transparent',
    tooltip: { trigger: 'axis' },
    legend: {
      data: ['MSE', 'Cross-Entropy', 'Huber Loss', 'Smooth L1'],
      bottom: 0,
      textStyle: { color: '#94a3b8', fontSize: 11 }
    },
    grid: { left: 50, right: 20, top: 20, bottom: 50 },
    xAxis: {
      type: 'category', data: xData, name: 'Error',
      nameTextStyle: { color: '#64748b', fontSize: 10 },
      axisLabel: { color: '#64748b', fontSize: 10, interval: 29 },
      axisLine: { lineStyle: { color: 'rgba(99,102,241,0.2)' } }

      axisLabel: { color: '#64748b', fontSize: 10 },
      axisLine: { lineStyle: { color: 'rgba(99,102,241,0.2)' } },
      splitLine: { lineStyle: { color: 'rgba(99,102,241,0.08)' } }
    },
    series: [
      { name: 'MSE', type: 'line', smooth: true, symbol: 'none', lineStyle: { width: 2, color: '#6366f1' }, data: makeData(mse) },
      { name: 'Cross-Entropy', type: 'line', smooth: true, symbol: 'none', lineStyle: { width: 2, color: '#ef4444' }, data: makeData(ce) },
      { name: 'Huber Loss', type: 'line', smooth: true, symbol: 'none', lineStyle: { width: 2, color: '#22c55e' }, data: makeData(huber) },
      { name: 'Smooth L1', type: 'line', smooth: true, symbol: 'none', lineStyle: { width: 2, color: '#f59e0b' }, data: makeData(smoothL1) }
    ]
  };
  
  chart.setOption(option);
  window.addEventListener('resize', function() { chart.resize(); });
}

// ============================================================
//  Tween.js — 面板切换 + 卡片入场动画
// ============================================================
function tweenOpenPanel(panel, callback) {
  // Using CSS transitions as fallback when Tween is unavailable
  if (typeof TWEEN === 'undefined') {
    panel.style.display = 'block';
    panel.style.opacity = '1';
    panel.style.transform = 'translateY(0) scale(1)';
    if (callback) callback();
    return;
  }
  
  panel.style.display = 'block';
  panel.style.opacity = '0';
  panel.style.transform = 'translateY(30px) scale(0.97)';
  
  var tweenObj = { opacity: 0, y: 30, scale: 0.97 };
  new TWEEN.Tween(tweenObj)
    .to({ opacity: 1, y: 0, scale: 1 }, 450)
    .easing(TWEEN.Easing.Cubic.Out)
    .onUpdate(function() {
      panel.style.opacity = tweenObj.opacity;
      panel.style.transform = 'translateY(' + tweenObj.y + 'px) scale(' + tweenObj.scale + ')';
    })
    .onComplete(function() {
      panel.style.transform = '';
      if (callback) callback();
    })
    .start();
}

function tweenClosePanel(panel, callback) {
  if (typeof TWEEN === 'undefined') {
    panel.style.display = 'none';
    if (callback) callback();
    return;
  }
  
  var tweenObj = { opacity: 1, y: 0, scale: 1 };
  new TWEEN.Tween(tweenObj)
    .to({ opacity: 0, y: -20, scale: 0.98 }, 300)
    .easing(TWEEN.Easing.Cubic.In)
    .onUpdate(function() {
      panel.style.opacity = tweenObj.opacity;
      panel.style.transform = 'translateY(' + tweenObj.y + 'px) scale(' + tweenObj.scale + ')';
    })
    .onComplete(function() {
      panel.style.display = 'none';
      panel.style.transform = '';
      if (callback) callback();
    })
    .start();
}

// Tween animation loop
function startTweenLoop() {
  if (typeof TWEEN === 'undefined') return;
  function animate(time) {
    requestAnimationFrame(animate);
    TWEEN.update(time);
  }
  requestAnimationFrame(animate);
}
startTweenLoop();

// ============================================================
//  Canvas 2D — 装饰层（动态网格 + 浮动粒子）
// ============================================================
function initCanvasDecoration() {
  var canvas = document.getElementById('canvasDecoration');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  
  // Floating geometric shapes
  var shapes = [];
  var shapeCount = 12;
  for (var i = 0; i < shapeCount; i++) {
    shapes.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 30 + 10,
      type: ['circle', 'triangle', 'square', 'diamond'][Math.floor(Math.random() * 4)],
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.01,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.2,
      opacity: Math.random() * 0.15 + 0.05,
      hue: Math.random() * 60 + 220 // Blue-purple range
    });
  }
  
  // Grid lines
  var gridSpacing = 80;
  
  function drawGrid() {
    ctx.strokeStyle = 'rgba(99, 102, 241, 0.03)';
    ctx.lineWidth = 0.5;
    
    // Vertical lines
    for (var x = 0; x < canvas.width; x += gridSpacing) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
      ctx.stroke();
    }
    // Horizontal lines
    for (var y = 0; y < canvas.height; y += gridSpacing) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
      ctx.stroke();
    }
  }
  
  function drawShape(s) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rotation);
    ctx.strokeStyle = 'hsla(' + s.hue + ', 60%, 70%, ' + s.opacity + ')';
    ctx.fillStyle = 'hsla(' + s.hue + ', 60%, 70%, ' + (s.opacity * 0.3) + ')';
    ctx.lineWidth = 1;
    
    var r = s.size / 2;
    
    switch(s.type) {
      case 'circle':
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        break;
      case 'triangle':
        ctx.beginPath();
        ctx.moveTo(0, -r);
        ctx.lineTo(r * 0.866, r * 0.5);
        ctx.lineTo(-r * 0.866, r * 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        break;
      case 'square':
        ctx.fillRect(-r, -r, s.size, s.size);
        ctx.strokeRect(-r, -r, s.size, s.size);
        break;
      case 'diamond':
        ctx.beginPath();
        ctx.moveTo(0, -r);
        ctx.lineTo(r, 0);
        ctx.lineTo(0, r);
        ctx.lineTo(-r, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        break;
    }
    
    ctx.restore();
  }
  
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    
    shapes.forEach(function(s) {
      s.x += s.vx;
      s.y += s.vy;
      s.rotation += s.rotSpeed;
      
      // Wrap around
      if (s.x < -s.size) s.x = canvas.width + s.size;
      if (s.x > canvas.width + s.size) s.x = -s.size;
      if (s.y < -s.size) s.y = canvas.height + s.size;
      if (s.y > canvas.height + s.size) s.y = -s.size;
      
      drawShape(s);
    });
    
    requestAnimationFrame(animate);
  }
  animate();
}

// ============================================================
//  WebGL 增强 — 自定义着色器粒子系统
// ============================================================
function initEnhancedParticles() {
  var canvas3d = document.getElementById('three-bg-canvas');
  if (!canvas3d || typeof THREE === 'undefined') return;
  
  // Check if WebGL supports custom shaders
  var testCanvas = document.createElement('canvas');
  var gl = testCanvas.getContext('webgl') || testCanvas.getContext('experimental-webgl');
  if (!gl) { initFallback2D(); return; }
  
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 30;
  
  var renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  
  // Custom shader material for glowing particles
  var vertexShader = [
    'attribute float aSize;',
    'attribute vec3 aColor;',
    'varying vec3 vColor;',
    'varying float vAlpha;',
    'uniform float uTime;',
    'void main() {',
    '  vColor = aColor;',
    '  vec3 pos = position;',
    '  pos.y += sin(uTime + position.x * 0.5) * 0.5;',
    '  pos.x += cos(uTime * 0.7 + position.z * 0.3) * 0.3;',
    '  vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);',
    '  gl_PointSize = aSize * (200.0 / -mvPosition.z);',
    '  gl_PointSize = max(1.0, gl_PointSize);',
    '  vAlpha = smoothstep(80.0, 20.0, -mvPosition.z);',
    '  gl_Position = projectionMatrix * mvPosition;',
    '}'
  ].join('\n');
  
  var fragmentShader = [
    'varying vec3 vColor;',
    'varying float vAlpha;',
    'void main() {',
    '  float dist = length(gl_PointCoord - vec2(0.5));',
    '  if (dist > 0.5) discard;',
    '  float glow = 1.0 - smoothstep(0.0, 0.5, dist);',
    '  glow = pow(glow, 1.5);',
    '  gl_FragColor = vec4(vColor, glow * vAlpha * 0.7);',
    '}'
  ].join('\n');
  
  var particleCount = 600;
  var geometry = new THREE.BufferGeometry();
  var positions = new Float32Array(particleCount * 3);
  var colors = new Float32Array(particleCount * 3);
  var sizes = new Float32Array(particleCount);
  var velocities = new Float32Array(particleCount * 3);
  
  var palette = [
    new THREE.Color(0x6366f1),
    new THREE.Color(0x8b5cf6),
    new THREE.Color(0x06b6d4),
    new THREE.Color(0x10b981),
    new THREE.Color(0xf59e0b)
  ];
  
  for (var i = 0; i < particleCount; i++) {
    var i3 = i * 3;
    positions[i3]     = (Math.random() - 0.5) * 80;
    positions[i3 + 1] = (Math.random() - 0.5) * 80;
    positions[i3 + 2] = (Math.random() - 0.5) * 60;
    
    var col = palette[Math.floor(Math.random() * palette.length)];
    colors[i3]     = col.r;
    colors[i3 + 1] = col.g;
    colors[i3 + 2] = col.b;
    
    sizes[i] = Math.random() * 4 + 1;
    
    velocities[i3]     = (Math.random() - 0.5) * 0.015;
    velocities[i3 + 1] = (Math.random() - 0.5) * 0.015;
    velocities[i3 + 2] = (Math.random() - 0.5) * 0.008;
  }
  
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
  geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  
  var material = new THREE.ShaderMaterial({
    vertexShader: vertexShader,
    fragmentShader: fragmentShader,
    uniforms: { uTime: { value: 0 } },
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  
  var particles = new THREE.Points(geometry, material);
  scene.add(particles);
  
  // Connection lines
  var lineGeometry = new THREE.BufferGeometry();
  var maxLines = 120;
  var linePositions = new Float32Array(maxLines * 6);
  var lineColors = new Float32Array(maxLines * 6);
  lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
  lineGeometry.setAttribute('color', new THREE.BufferAttribute(lineColors, 3));
  
  var lineMaterial = new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0.1,
    blending: THREE.AdditiveBlending
  });
  var lines = new THREE.LineSegments(lineGeometry, lineMaterial);
  scene.add(lines);
  
  var mouseX = 0, mouseY = 0;
  document.addEventListener('mousemove', function(e) {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
    mouseY = -(e.clientY / window.innerHeight - 0.5) * 2;
  });
  
  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  
  var time = 0;
  function animate() {
    requestAnimationFrame(animate);
    time += 0.005;
    material.uniforms.uTime.value = time;
    
    var posArr = geometry.attributes.position.array;
    for (var i = 0; i < particleCount; i++) {
      var i3 = i * 3;
      posArr[i3]     += velocities[i3];
      posArr[i3 + 1] += velocities[i3 + 1];
      posArr[i3 + 2] += velocities[i3 + 2];
      if (Math.abs(posArr[i3]) > 40) velocities[i3] *= -1;
      if (Math.abs(posArr[i3 + 1]) > 40) velocities[i3 + 1] *= -1;
      if (Math.abs(posArr[i3 + 2]) > 30) velocities[i3 + 2] *= -1;
    }
    geometry.attributes.position.needsUpdate = true;
    
    // Update connection lines
    var lineIdx = 0;
    var lp = lines.geometry.attributes.position.array;
    var lc = lines.geometry.attributes.color.array;
    for (var i = 0; i < particleCount && lineIdx < maxLines; i++) {
      for (var j = i + 1; j < particleCount && lineIdx < maxLines; j++) {
        var i3 = i * 3, j3 = j * 3;
        var dx = posArr[i3] - posArr[j3];
        var dy = posArr[i3+1] - posArr[j3+1];
        var dz = posArr[i3+2] - posArr[j3+2];
        var dist = dx*dx + dy*dy + dz*dz;
        if (dist < 20) {
          var li = lineIdx * 6;
          lp[li] = posArr[i3]; lp[li+1] = posArr[i3+1]; lp[li+2] = posArr[i3+2];
          lp[li+3] = posArr[j3]; lp[li+4] = posArr[j3+1]; lp[li+5] = posArr[j3+2];
          var alpha = 1 - Math.sqrt(dist) / 4.5;
          lc[li] = colors[i3]*alpha; lc[li+1] = colors[i3+1]*alpha; lc[li+2] = colors[i3+2]*alpha;
          lc[li+3] = colors[j3]*alpha; lc[li+4] = colors[j3+1]*alpha; lc[li+5] = colors[j3+2]*alpha;
          lineIdx++;
        }
      }
    }
    for (var i = lineIdx; i < maxLines; i++) {
      var li = i * 6;
      for (var k = 0; k < 6; k++) { lp[li+k] = 0; lc[li+k] = 0; }
    }
    lines.geometry.attributes.position.needsUpdate = true;
    lines.geometry.attributes.color.needsUpdate = true;
    
    camera.position.x += (mouseX * 5 - camera.position.x) * 0.02;
    camera.position.y += (mouseY * 5 - camera.position.y) * 0.02;
    particles.rotation.y = time * 0.3;
    particles.rotation.x = Math.sin(time * 0.2) * 0.1;
    lines.rotation.y = time * 0.3;
    lines.rotation.x = Math.sin(time * 0.2) * 0.1;
    
    camera.lookAt(scene.position);
    renderer.render(scene, camera);
  }
  animate();
}

// [Original initParticles overridden above]
function initParticles_original() {
  const canvas3d = document.getElementById('three-bg-canvas');
  if (!canvas3d || typeof THREE === 'undefined') { initFallback2D(); return; }

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 30;

  const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);

  // 创建粒子系统
  const particleCount = 800;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);
  const sizes = new Float32Array(particleCount);
  const velocities = new Float32Array(particleCount * 3);

  const colorPalette = [
    new THREE.Color(0x6366f1), // 靛蓝
    new THREE.Color(0x8b5cf6), // 紫色
    new THREE.Color(0x06b6d4), // 青色
    new THREE.Color(0x10b981), // 绿色
    new THREE.Color(0xf59e0b), // 琥珀
  ];

  for (let i = 0; i < particleCount; i++) {
    const i3 = i * 3;
    positions[i3]     = (Math.random() - 0.5) * 80;
    positions[i3 + 1] = (Math.random() - 0.5) * 80;
    positions[i3 + 2] = (Math.random() - 0.5) * 60;

    const col = colorPalette[Math.floor(Math.random() * colorPalette.length)];
    colors[i3]     = col.r;
    colors[i3 + 1] = col.g;
    colors[i3 + 2] = col.b;

    sizes[i] = Math.random() * 3 + 0.5;

    velocities[i3]     = (Math.random() - 0.5) * 0.02;
    velocities[i3 + 1] = (Math.random() - 0.5) * 0.02;
    velocities[i3 + 2] = (Math.random() - 0.5) * 0.01;
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const material = new THREE.PointsMaterial({
    size: 0.15,
    vertexColors: true,
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true,
  });

  const particleSystem = new THREE.Points(geometry, material);
  scene.add(particleSystem);

  // 连接线
  const lineGeometry = new THREE.BufferGeometry();
  const maxLines = 150;
  const linePositions = new Float32Array(maxLines * 6);
  const lineColors = new Float32Array(maxLines * 6);
  lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
  lineGeometry.setAttribute('color', new THREE.BufferAttribute(lineColors, 3));

  const lineMaterial = new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0.12,
    blending: THREE.AdditiveBlending,
  });
  const lineSystem = new THREE.LineSegments(lineGeometry, lineMaterial);
  scene.add(lineSystem);

  // 鼠标交互
  let mouseX = 0, mouseY = 0;
  document.addEventListener('mousemove', function(e) {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
    mouseY = -(e.clientY / window.innerHeight - 0.5) * 2;
  });

  // 窗口大小变化
  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // 动画循环
  let time = 0;
  function animate() {
    requestAnimationFrame(animate);
    time += 0.005;

    const posArr = geometry.attributes.position.array;
    for (let i = 0; i < particleCount; i++) {
      const i3 = i * 3;
      posArr[i3]     += velocities[i3];
      posArr[i3 + 1] += velocities[i3 + 1];
      posArr[i3 + 2] += velocities[i3 + 2];

      // 边界反弹
      if (Math.abs(posArr[i3]) > 40) velocities[i3] *= -1;
      if (Math.abs(posArr[i3 + 1]) > 40) velocities[i3 + 1] *= -1;
      if (Math.abs(posArr[i3 + 2]) > 30) velocities[i3 + 2] *= -1;
    }
    geometry.attributes.position.needsUpdate = true;

    // 更新连接线
    let lineIdx = 0;
    const lp = lineSystem.geometry.attributes.position.array;
    const lc = lineSystem.geometry.attributes.color.array;
    for (let i = 0; i < particleCount && lineIdx < maxLines; i++) {
      for (let j = i + 1; j < particleCount && lineIdx < maxLines; j++) {
        const i3 = i * 3, j3 = j * 3;
        const dx = posArr[i3] - posArr[j3];
        const dy = posArr[i3+1] - posArr[j3+1];
        const dz = posArr[i3+2] - posArr[j3+2];
        const dist = dx*dx + dy*dy + dz*dz;
        if (dist < 25) {
          const li = lineIdx * 6;
          lp[li]   = posArr[i3]; lp[li+1] = posArr[i3+1]; lp[li+2] = posArr[i3+2];
          lp[li+3] = posArr[j3]; lp[li+4] = posArr[j3+1]; lp[li+5] = posArr[j3+2];
          const alpha = 1 - Math.sqrt(dist) / 5;
          lc[li] = colors[i3]*alpha; lc[li+1] = colors[i3+1]*alpha; lc[li+2] = colors[i3+2]*alpha;
          lc[li+3] = colors[j3]*alpha; lc[li+4] = colors[j3+1]*alpha; lc[li+5] = colors[j3+2]*alpha;
          lineIdx++;
        }
      }
    }
    // 清空未使用的线段
    for (let i = lineIdx; i < maxLines; i++) {
      const li = i * 6;
      for (let k = 0; k < 6; k++) { lp[li+k] = 0; lc[li+k] = 0; }
    }
    lineSystem.geometry.attributes.position.needsUpdate = true;
    lineSystem.geometry.attributes.color.needsUpdate = true;

    // 相机跟随鼠标 + 自动旋转
    camera.position.x += (mouseX * 5 - camera.position.x) * 0.02;
    camera.position.y += (mouseY * 5 - camera.position.y) * 0.02;
    particleSystem.rotation.y = time * 0.3;
    particleSystem.rotation.x = Math.sin(time * 0.2) * 0.1;
    lineSystem.rotation.y = time * 0.3;
    lineSystem.rotation.x = Math.sin(time * 0.2) * 0.1;

    camera.lookAt(scene.position);
    renderer.render(scene, camera);
  }
  animate();
}

function initFallback2D() {
  const canvas = document.getElementById('bgCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 50; i++) {
    particles.push({
      x: Math.random() * canvas.width, y: Math.random() * canvas.height,
      r: Math.random() * 2 + 1, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
      opacity: Math.random() * 0.5 + 0.2,
    });
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(99, 102, 241, ${p.opacity})`; ctx.fill();
    });
    requestAnimationFrame(animate);
  }
  animate();
}

// Knowledge Framework Image Lazy Load with Fade-in
function initKgImageLazyLoad() {
  var images = document.querySelectorAll('.kg-img-lazy:not(.loaded)');
  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var img = entry.target;
          // 触发缩略图显示
          img.classList.add('loaded');
          // 如果有 data-full 且还没加载高清版，预加载
          if (img.dataset.full && !img.dataset.hdLoaded) {
            img.dataset.hdLoaded = '1';
            var hd = new Image();
            hd.onload = function() {
              img.src = img.dataset.full;
              img.classList.add('kg-img-hd');
            };
            hd.src = img.dataset.full;
          }
          observer.unobserve(img);
        }
      });
    }, { rootMargin: '100px' });
    images.forEach(function(img) { observer.observe(img); });
  } else {
    // 不支持 IntersectionObserver，直接加载所有
    images.forEach(function(img) {
      img.classList.add('loaded');
      if (img.dataset.full) {
        img.src = img.dataset.full;
        img.classList.add('kg-img-hd');
      }
    });
  }
}

function initSvgClickZoom() {
  // 创建遮罩层
  var overlay = document.createElement('div');
  overlay.className = 'svg-zoom-overlay';
  overlay.innerHTML = '<span class="svg-zoom-close">&times;</span><div class="svg-zoom-content"></div>';
  document.body.appendChild(overlay);

  var contentDiv = overlay.querySelector('.svg-zoom-content');
  var closeBtn = overlay.querySelector('.svg-zoom-close');

  function closeZoom() {
    overlay.classList.remove('active');
    document.body.style.overflow = '';
    setTimeout(function() { contentDiv.innerHTML = ''; }, 300);
  }

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay || e.target === closeBtn) closeZoom();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('active')) closeZoom();
  });

  // 为知识框架内的 SVG 添加点击放大
  function attachSvgClicks(container) {
    if (!container) container = document;
    // SVG 元素
    var svgs = container.querySelectorAll('.kg-section svg, .kg-concept-card svg, .guide-body svg');
    svgs.forEach(function(svg) {
      if (svg.dataset.zoomAttached) return;
      svg.dataset.zoomAttached = '1';
      svg.addEventListener('click', function() {
        var clone = svg.cloneNode(true);
        clone.style.width = 'auto';
        clone.style.height = 'auto';
        clone.style.maxWidth = '92%';
        clone.style.maxHeight = '90%';
        contentDiv.innerHTML = '';
        contentDiv.appendChild(clone);
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
    });

    // 带有 data-full 的图片也支持点击放大
    var imgs = container.querySelectorAll('.kg-img[data-full], .kg-img-wrap img[data-full]');
    imgs.forEach(function(img) {
      if (img.dataset.zoomAttached) return;
      img.dataset.zoomAttached = '1';
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', function() {
        var fullSrc = img.dataset.full || img.src;
        var fullImg = new Image();
        fullImg.src = fullSrc;
        contentDiv.innerHTML = '';
        contentDiv.appendChild(fullImg);
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
    });
  }

  // 初始绑定
  attachSvgClicks(document);

  // 知识框架面板打开后重新绑定
  var origOpen = window.openKnowledge;
  if (typeof origOpen === 'function') {
    window.openKnowledge = function() {
      origOpen.apply(this, arguments);
      setTimeout(function() { attachSvgClicks(document); }, 300);
    };
  }

  // 返回 attachSvgClicks 供外部调用
  return attachSvgClicks;
}

// DeepSeek API Call
async function callDeepSeek(messages, temperature = 0.3) {
  const resp = await fetch(AI_CONFIG.apiUrl, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + AI_CONFIG.apiKey
    },
    body: JSON.stringify({
      model: AI_CONFIG.model,
      messages,
      temperature,
      max_tokens: 2048
    })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${resp.status}`);
  }
  const data = await resp.json();
  return data.choices[0].message.content;
}

// Fallback: keyword-based method extraction
function fallbackExtractMethods(title, abstract) {
  const text = (title + ' ' + (abstract || '')).toLowerCase();
  const found = [];
  const types = {};
  for (const [typeName, keywords] of Object.entries(FALLBACK_KEYWORDS)) {
    for (const kw of keywords) {
      if (text.includes(kw.toLowerCase())) {
        if (!found.includes(kw)) {
          found.push(kw);
          types[kw] = typeName;
        }
        break;
      }
    }
  }
  if (found.length === 0) {
    found.push('未识别');
    types['未识别'] = '其他';
  }
  return {
    core_methods: found.slice(0, 3),
    method_types: types,
    core_formula: null,
    scenario: '待分析',
    innovation: '基于关键词匹配',
    complementary_methods: [],
    complementary_reason: '配置 DeepSeek API Key 可获得更准确的提取结果',
    _fallback: true
  };
}

// Extract methods for a single paper
async function extractPaperMethods(paper, useAi = true) {
  // Check preset library first
  for (const [key, preset] of Object.entries(PRESET_METHOD_LIBRARY)) {
    if (paper.title && paper.title.includes(key)) {
      return { ...preset, _source: 'preset' };
    }
  }

  if (useAi && hasApiKey()) {
    try {
      const prompt = `你是一位计算机视觉领域的论文分析专家。请分析以下论文：

标题：${paper.title}
摘要：${paper.abstract || '无摘要'}

请提取并返回以下结构化信息，只返回JSON，不要其他内容：

{
  "core_methods": ["方法1", "方法2"],
  "method_types": {"方法1": "通道注意力", "方法2": "空间注意力"},
  "core_formula": "核心公式（LaTeX格式，没有则返回null）",
  "scenario": "适用场景",
  "innovation": "一句话创新点",
  "complementary_methods": ["建议搭配的方法1", "建议搭配的方法2"],
  "complementary_reason": "为什么建议搭配这些方法"
}`;
      const content = await callDeepSeek([
        { role: 'system', content: '你是论文分析方法提取专家，只输出JSON格式结果。' },
        { role: 'user', content: prompt }
      ]);
      const jsonMatch = content.match(/\{[\s\S]*\}/);
      if (jsonMatch) {
        return { ...JSON.parse(jsonMatch[0]), _source: 'ai' };
      }
    } catch (e) {
      console.warn('AI extraction failed:', e);
    }
  }

  return fallbackExtractMethods(paper.title, paper.abstract);
}

function formatMethodResult(result) {
  let html = '<div class="method-tags">';
  for (const method of (result.core_methods || [])) {
    const type = (result.method_types || {})[method] || '其他';
    let typeClass = '';
    if (type.includes('通道')) typeClass = 'type-channel';
    else if (type.includes('空间')) typeClass = 'type-spatial';
    else if (type.includes('注意力') || type.includes('自注意力')) typeClass = 'type-attention';
    else if (type.includes('频域')) typeClass = 'type-frequency';
    html += `<span class="method-tag ${typeClass}">${method}<small style="opacity:0.7;margin-left:4px;">(${type})</small></span>`;
  }
  if (result._fallback) {
    html += '<span class="fallback-badge">本地规则</span>';
  }
  html += '</div>';
  return html;
}

    "创新冗余度": 75
  },
  "recommendations": {
    "good": [{"combination": "方法A+方法B", "reason": "原因"}],
    "optimizable": [{"combination": "方法C+方法D", "suggestion": "建议替换为...", "reason": "原因"}],
    "bad": [{"combination": "方法E+方法F", "problem": "问题描述"}]
  },
  "improvement": {
    "remove": ["要删除的模块", "原因"],
    "replace": {"from": "原方法", "to": "建议方法", "reason": "原因"},
    "add": ["要补充的模块", "原因"]
  },
  "reference_combinations": ["参考组合1", "参考组合2"]
}`;
      const content = await callDeepSeek([
        { role: 'system', content: '你是深度学习架构设计专家，只输出JSON格式结果。' },
        { role: 'user', content: prompt }
      ], 0.5);
      const jsonMatch = content.match(/\{[\s\S]*\}/);
      if (jsonMatch) {
        return { ...JSON.parse(jsonMatch[0]), _source: 'ai' };
      }
    } catch (e) {
      console.warn('AI pairing failed:', e);
    }
  }

  // Fallback: simple heuristic
  const allMethods = [];
  for (const p of papers) {
    allMethods.push(...(p.methods?.core_methods || []));
  }
  return {
    total_score: 70,
    score_breakdown: { '互补性': 70, '计算效率': 70, '任务适配度': 70, '创新冗余度': 70 },
    recommendations: {
      good: [{ combination: allMethods.slice(0, 2).join('+') || '未知', reason: '基础搭配' }],
      optimizable: [],
      bad: []
    },
    improvement: { remove: [], replace: {}, add: [] },
    reference_combinations: allMethods,
    _source: 'fallback',
    _fallbackMsg: hasApiKey() ? 'AI 分析失败，使用本地规则' : '未配置 API Key，使用本地规则'
  };
}

function renderPairingResult(result) {
  let html = '<div class="pairing-result">';
  html += `<div class="pairing-score">${result.total_score || '--'}<span style="font-size:16px;">/100</span></div>`;
  html += '<div class="pairing-score-label">综合搭配评分</div>';

  if (result.score_breakdown) {
    html += '<div class="pairing-section"><h5>📊 评分细项</h5>';
    for (const [k, v] of Object.entries(result.score_breakdown)) {
      html += `<div class="pairing-item">${k}: <strong>${v}</strong></div>`;
    }
    html += '</div>';
  }

  if (result.recommendations?.good?.length) {
    html += '<div class="pairing-section"><h5>✅ 推荐搭配</h5>';
    for (const item of result.recommendations.good) {
      html += `<div class="pairing-item good"><strong>${item.combination}</strong><br><small>${item.reason}</small></div>`;
    }
    html += '</div>';
  }

  if (result.recommendations?.optimizable?.length) {
    html += '<div class="pairing-section"><h5>⚠️ 可优化</h5>';
    for (const item of result.recommendations.optimizable) {
      html += `<div class="pairing-item warn"><strong>${item.combination}</strong><br><small>建议: ${item.suggestion} | ${item.reason}</small></div>`;
    }
    html += '</div>';
  }

  if (result.recommendations?.bad?.length) {
    html += '<div class="pairing-section"><h5>❌ 避免搭配</h5>';
    for (const item of result.recommendations.bad) {
      html += `<div class="pairing-item bad"><strong>${item.combination}</strong><br><small>${item.problem}</small></div>`;
    }
    html += '</div>';
  }

  if (result._fallbackMsg) {
    html += `<div class="fallback-badge">${result._fallbackMsg}</div>`;
  }
  html += '</div>';
  return html;
}

// Batch completion
async function batchCompleteMethods() {
  const targets = allPapers.filter(p => !p.methods || !p.methods.core_methods?.length);
  if (targets.length === 0) {
    showToast('所有论文已有方法信息');
    return;
  }

  const overlay = document.getElementById('batchProgressOverlay');
  const bar = document.getElementById('batchProgressBar');
  const text = document.getElementById('batchProgressText');
  const detail = document.getElementById('batchProgressDetail');
  overlay.classList.add('open');

  let success = 0, fail = 0;
  for (let i = 0; i < targets.length; i++) {
    const p = targets[i];
    const pct = Math.round(((i) / targets.length) * 100);
    bar.style.width = pct + '%';
    text.textContent = `正在处理: ${p.title}`;
    detail.textContent = `进度: ${i}/${targets.length} | 成功: ${success} | 失败: ${fail}`;

    try {
      const result = await extractPaperMethods(p, true);
      p.methods = result;
      success++;
    } catch (e) {
      console.error(e);
      fail++;
    }

    if (i < targets.length - 1) {
      await new Promise(r => setTimeout(r, 1000));
    }
  }

  bar.style.width = '100%';
  text.textContent = '处理完成!';
  detail.textContent = `成功: ${success} | 失败: ${fail}`;

  saveMethodStore();
  renderPapers();

  setTimeout(() => {
    overlay.classList.remove('open');
    showToast(`批量补全完成: 成功 ${success} 篇, 失败 ${fail} 篇`);
  }, 1500);
}

// Method store persistence
function saveMethodStore() {
  const store = {};
  for (const p of allPapers) {
    if (p.methods) store[p.title] = p.methods;
  }
  localStorage.setItem('paper_methods_store', JSON.stringify(store));
}

function loadMethodStore() {
  try {
    return JSON.parse(localStorage.getItem('paper_methods_store') || '{}');
  } catch { return {}; }
}

// Data migration
function migrateMethodData() {
  const store = loadMethodStore();
  let migrated = 0;
  for (const p of allPapers) {
    if (store[p.title]) {
      p.methods = store[p.title];
      migrated++;
    }
  }
  if (migrated > 0) console.log(`Migrated methods for ${migrated} papers`);
}

<div class="kg-accordion-header" onclick="kgToggleAcc(this)"><h3>一、什么是"频域"？为什么我们要去频率世界里看图像？</h3><span class="kg-acc-icon">▼</span></div>
<div class="kg-accordion-body">

<p>想象你在听一首交响乐。这首曲子里有低沉的大提琴（低频）、悠扬的小提琴（中频）、清脆的三角铁（高频）。</p>

<p>如果我只给你一个选项：<b>一次性把所有乐器的声音都抹掉</b>——你做不到"只去掉三角铁的高音，保留大提琴的低音"，对吧？</p>

<p>图像也一样。一张照片可以被分解成不同频率的成分：</p>

<div class="kg-compare">
  <div class="kg-card">
    <h4>🌊 低频分量 (Low Frequency)</h4>
    <p>图像中<b>缓慢变化</b>的部分——大面积的天空、墙壁的颜色、人物皮肤的色调。可以理解为"背景色"和"大色块"。</p>
  </div>
  <div class="kg-card">
    <h4>⚡ 高频分量 (High Frequency)</h4>
    <p>图像中<b>剧烈变化</b>的部分——物体的边缘、纹理细节、雨丝的线条。可以理解为"轮廓线"和"精细纹理"。</p>
  </div>
</div>

<p>频域处理的核心思想就是：<b>把图像变换到频率世界，在频率世界里做手术，再变回图像</b>。就像给音乐做EQ均衡器调节——想去除刺耳的高音？调低高频增益就行。</p>

<div class="kg-section" id="kg-s2">
<div class="kg-accordion-header" onclick="kgToggleAcc(this)"><h3>二、陷波滤波器 & 带阻滤波器——频域里的"精准手术刀"</h3><span class="kg-acc-icon">▼</span></div>
<div class="kg-accordion-body">

<p>这两种滤波器是频域处理中最常用的两个工具，它们的区别用一句话概括：</p>

<div class="kg-step">
  <strong>陷波滤波器 (Notch Filter)</strong>：像用<b>牙签精准地挑掉</b>频谱中某一个极窄的频率点。适合去除<b>周期性噪声</b>（如扫描仪产生的固定频率条纹）。
</div>

<div class="kg-step">
  <strong>带阻滤波器 (Band-Stop Filter)</strong>：像用<b>宽胶带贴掉</b>频谱中一段连续的频率范围。适合去除<b>一个频段的噪声</b>（如某个频率范围的干扰信号）。
</div>

<div class="kg-img-wrap">
  <picture class="kg-picture"><source srcset="reading-notes/assets/knowledge-filter-types.webp" type="image/webp"><img src="reading-notes/assets/knowledge-filter-types-thumb.webp" data-full="reading-notes/assets/knowledge-filter-types.webp" alt="陷波滤波器与带阻滤波器对比" class="kg-img kg-img-lazy" loading="lazy" decoding="async"></picture>
  <div class="kg-caption">图：陷波滤波器（左）只挖掉一个极窄的频率点；带阻滤波器（右）挡掉一整段频率范围</div>
</div>

<p>它们的原理很简单：在频谱图上，把你不想要的频率对应的亮度直接设为0（或接近0），然后做逆变换回图像。被"挖掉"的那些频率所对应的图像信息就消失了。</p>

<p><b>打个比方</b>：陷波滤波器像"消音一个特定音高的噪音"，带阻滤波器像"关闭一个频段的均衡器"。前者精准但窄，后者粗糙但覆盖面大。</p>

    在图像处理中，<strong style="color:var(--text,#e2e8f0);">频域滤波</strong>是指将图像从空间域变换到频域（通常用傅里叶变换），对特定频率成分进行增强或抑制，再逆变换回空间域的过程。图像中<strong style="color:#10b981;">低频</strong>对应平滑区域（大面积灰度变化缓慢），<strong style="color:#fb7185;">高频</strong>对应边缘和细节（灰度突变）以及噪声。根据允许通过的频率范围，频域滤波器分为四类：

<h4>3.1 根本原因：雨纹和边缘"住"在同一个频段</h4>

<p>问题出在这里——雨丝的条纹和图像中物体的边缘，<b>它们都是高频信息</b>。</p>

<p>当你在频域里用低通滤波器压制高频噪声时，<b>边缘也一起被压了</b>，就像你想扔掉垃圾，但垃圾和钱包混在同一个抽屉里——一扔就全扔了。</p>

<h4>3.2 为什么对复杂场景不鲁棒？</h4>

<p>频域滤波器通常是<b>全局统一的</b>——它对整张图用同一个规则。但复杂场景中：</p>
<ul>
  <li>天空区域可能几乎没有高频信息（纯净），但建筑区域布满高频细节</li>
  <li>同一种雨纹在不同背景上产生的频率特征会不同</li>
  <li>全局统一的阈值要么"去不干净"，要么"去了不该去的"</li>
</ul>

<p><b>一句话总结</b>：频域方法的盲点在于——<b>它不知道"这段高频是雨还是边缘"，而且它对全图一视同仁</b>。这正是后来小波变换和混合域方法要解决的问题。</p>
<div class="kg-concept-card" style="margin:28px 0; padding:24px; background:var(--bg-card,rgba(30,41,59,0.5)); border-radius:14px; border-left:4px solid var(--accent-red,#fb7185);">
  <h4 style="color:var(--text,#e2e8f0); font-family:'Microsoft YaHei',sans-serif; font-size:16px; margin:0 0 14px 0; display:flex; align-items:center; gap:8px;">
    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent-red,#fb7185);flex-shrink:0;"></span>
    概念延伸：什么是"鲁棒性"（Robustness）？
  </h4>
  <p style="color:var(--text-muted,#94a3b8); font-family:'Microsoft YaHei',sans-serif; line-height:1.9; font-size:13.5px; margin:0 0 10px 0;">
    <strong style="color:var(--text,#e2e8f0);">通俗类比：</strong>想象你有两把雨伞——一把"加固防风伞"（鲁棒），一把"普通晴雨伞"（脆弱）。蒙蒙细雨时两把伞都能挡雨，看不出区别；但当暴雨倾盆、狂风从侧面袭来时，普通伞可能伞骨断裂、雨水倒灌，而加固伞依然稳稳撑住。鲁棒性，就是"不管风雨怎么变，伞都不塌"的能力。
  </p>
  <p style="color:var(--text-muted,#94a3b8); font-family:'Microsoft YaHei',sans-serif; line-height:1.9; font-size:13.5px; margin:0 0 16px 0;">
    在去雨任务中，<strong style="color:var(--accent-red,#fb7185);">鲁棒性</strong>指模型在面对<strong style="color:var(--text,#e2e8f0);">训练时未覆盖的雨况</strong>（如更密集的暴雨、不同倾角的斜雨、雨雾混合等）时，仍能保持稳定去雨效果的能力。鲁棒性差的算法一旦条件偏离训练分布，便会产生伪影、残留雨纹甚至扭曲背景——如下图所示，雨况越复杂，鲁棒算法与脆弱算法的性能差距越大。
  </p>
  <div style="display:flex; justify-content:center; margin-top:18px;">
    <svg width="480" height="340" viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" style="max-width:100%; height:auto;">
      <defs>
        <linearGradient id="robustBar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#10b981" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="#10b981" stop-opacity="0.35"/>
        </linearGradient>
        <linearGradient id="fragileBar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fb7185" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="#fb7185" stop-opacity="0.35"/>
        </linearGradient>

<div class="kg-section" id="kg-s4">
<div class="kg-accordion-header" onclick="kgToggleAcc(this)"><h3>四、小波变换——"既能看全貌，又能抠细节"的瑞士军刀</h3><span class="kg-acc-icon">▼</span></div>
<div class="kg-accordion-body">

<p>小波变换（Wavelet Transform）是傅里叶变换的"升级版"。傅里叶只能告诉你"这个频率存不存在"，而小波还能告诉你"这个频率<b>在图像的哪个位置</b>"。</p>

<p><b>打个比方</b>：傅里叶像一个人拿着放大镜扫过整幅画说"画里有红色"；小波像一个人指着画说"<b>左上角那棵树的树叶是红色的</b>"。</p>

<h4>4.1 小波子带——小波分解的"四块拼图"</h4>

<p>一次小波分解会把图像拆成<b>4个子带</b>（Subband）：</p>

<div class="kg-compare">
  <div class="kg-card">
    <h4>LL (Low-Low) 低频近似</h4>
    <p>原图的<b>缩小版</b>，保留了大部分亮度和颜色信息，但尺寸减半。是"大局观"，是背景和大色块。</p>
  </div>
  <div class="kg-card">
    <h4>LH (Low-High) 水平细节</h4>
    <p>捕捉<b>水平方向的边缘和纹理</b>。比如建筑物的水平线条、地平线。</p>
  </div>
</div>
<div class="kg-compare" style="margin-top:12px;">
  <div class="kg-card">
    <h4>HL (High-Low) 垂直细节</h4>
    <p>捕捉<b>垂直方向的边缘和纹理</b>。比如树干、电线杆、垂直雨丝。</p>
  </div>
  <div class="kg-card">
    <h4>HH (High-High) 对角细节</h4>
    <p>捕捉<b>对角方向的纹理</b>。比如斜向雨纹、斜边缘、交叉纹理。</p>
  </div>
</div>

<div class="kg-img-wrap">
  <picture class="kg-picture"><source srcset="reading-notes/assets/knowledge-wavelet-decomp.webp" type="image/webp"><img src="reading-notes/assets/knowledge-wavelet-decomp-thumb.webp" data-full="reading-notes/assets/knowledge-wavelet-decomp.webp" alt="小波分解树" class="kg-img kg-img-lazy" loading="lazy" decoding="async"></picture>
  <div class="kg-caption">图：小波分解树——每次分解把图像拆成 LL/LH/HL/HH 四块，LL还可以继续分解</div>
</div>

<p>关键点来了——<b>LL子带可以继续分解</b>，形成多层金字塔结构（这就是多分辨率分析）。就像不断用放大镜看更小的区域，每一层能看到更精细的细节。</p>

<h4>4.2 为什么小波比FFT更适合图像恢复？</h4>

<table>
<thead><tr><th>特性</th><th>傅里叶变换(FFT)</th><th>小波变换(DWT)</th></tr></thead>
<tbody>
<tr><td>频率定位</td><td>能告诉你"有没有某频率"</td><td>能告诉你"某频率在<b>哪个位置</b>"</td></tr>
<tr><td>空间信息</td><td><b style="color:var(--accent-red)">完全丢失</b>——知道有高频，但不知道在哪</td><td><b style="color:#10b981">保留</b>——每个子带保留空间位置</td></tr>
<tr><td>雨纹 vs 边缘</td><td>无法区分（都是高频）</td><td>可以通过子带方向<b>部分区分</b>（垂直雨纹主要在HL）</td></tr>
<tr><td>多尺度</td><td>不支持</td><td><b style="color:#10b981">天然支持</b>——多层分解=多个尺度</td></tr>
</tbody>
</table>

<p>所以你看到论文里很多去雨方法（如DAWN+、MFFDNet、SCGN）都用了小波——因为小波既能"看到雨纹在哪个频段"，又能"看到雨纹在图像的哪个位置"。</p>

  <div style="text-align:center;padding:4px 0;font-size:12px;color:var(--text-muted);">小波分解子带能量分布 · 对比各级子带</div>
</div>

<div class="kg-section" id="kg-s5">
<div class="kg-accordion-header" onclick="kgToggleAcc(this)"><h3>五、小波家族——不同的"眼睛"看不同的世界</h3><span class="kg-acc-icon">▼</span></div>
<div class="kg-accordion-body">

<p>小波变换需要选择一个"母小波"（Mother Wavelet）作为基础函数，就像选择一副眼镜——不同的眼镜看世界的效果不同。</p>

<div class="kg-img-wrap">
  <picture class="kg-picture"><source srcset="reading-notes/assets/knowledge-wavelet-family.webp" type="image/webp"><img src="reading-notes/assets/knowledge-wavelet-family-thumb.webp" data-full="reading-notes/assets/knowledge-wavelet-family.webp" alt="小波家族对比" class="kg-img kg-img-lazy" loading="lazy" decoding="async"></picture>
  <div class="kg-caption">图：四种经典小波的波形对比——从最简单的Haar到最精细的Morlet</div>
</div>

<table>
<thead><tr><th>小波名称</th><th>特点</th><th>长相描述</th><th>适合什么场景</th></tr></thead>
<tbody>
<tr><td><b>Haar 小波</b></td><td>最简单、计算最快</td><td>像一个<b>方波台阶</b>：上半+1，下半-1</td><td>快速原型验证、边缘检测教学演示</td></tr>
<tr><td><b>Daubechies 小波 (dbN)</b></td><td>正交、紧支撑、<b>不对称</b></td><td>像<b>不规则的波浪</b>，越高的阶数(N越大)越平滑</td><td>图像去噪/压缩（db2~db8最常用），去雨论文中常见</td></tr>
<tr><td><b>Symlet 小波 (symN)</b></td><td>Daubechies的<b>近对称改进版</b></td><td>像<b>更均匀对称的波浪</b>，视觉上比db更"好看"</td><td>需要对称性时使用（减少相位畸变），信号处理</td></tr>
<tr><td><b>Coiflet 小波</b></td><td>具有<b>更高阶消失矩</b></td><td>像<b>更圆滑的波浪</b>，对称性介于db和sym之间</td><td>需要精确重建的数值分析</td></tr>
<tr><td><b>Morlet 小波</b></td><td><b>连续小波</b>、非正交</td><td>像一个<b>被正弦波调制的高斯钟形曲线</b></td><td>时频分析、特征提取、非压缩应用</td></tr>
<tr><td><b>Biorthogonal 小波</b></td><td><b>双正交</b>——分解和重建用不同小波</td><td>一对配合使用的波浪</td><td>图像压缩（JPEG2000用bior3.5/3.5）</td></tr>
</tbody>
</table>

<p><b>选择建议</b>：去雨/去噪论文中最常用的是 <code>db2</code>、<code>db4</code>（Daubechies）和 <code>sym4</code>（Symlet），因为它们在平滑性和计算效率之间取得了很好的平衡。</p>
<!-- ===== 2.1 小波变换核心公式推导 ===== -->
<div style="margin:24px 0; padding:20px; background:var(--bg-card,rgba(30,41,59,0.4)); border-radius:12px; border:1px solid rgba(99,102,241,0.25);">
  <h4 style="color:var(--text,#e2e8f0); font-family:'Microsoft YaHei',sans-serif; font-size:15px; margin:0 0 16px 0; display:flex; align-items:center; gap:8px;">
    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#6366f1;flex-shrink:0;"></span>
    小波变换核心公式推导
  </h4>

  <!-- CWT 公式 -->
  <div style="margin-bottom:18px;">
    <div style="font-family:'Microsoft YaHei',sans-serif; font-size:12px; color:#6366f1; font-weight:bold; margin-bottom:8px;">① 连续小波变换 (CWT)</div>
    <div style="text-align:center; padding:16px 12px; background:rgba(99,102,241,0.08); border-radius:8px; border:1px solid rgba(99,102,241,0.2); font-family:'Cambria','Microsoft YaHei',serif; font-size:16px; color:var(--text,#e2e8f0); line-height:1.8;">
      W(a,b) = (1/√|a|) ∫<sub style="font-size:10px;">−∞</sub><sup style="font-size:10px;">+∞</sup> f(t) · ψ<sup>*</sup>((t − b) / a) dt
    </div>
    <div style="font-family:'Microsoft YaHei',sans-serif; font-size:12px; color:var(--text-muted,#94a3b8); line-height:1.9; margin-top:10px; padding-left:8px; border-left:2px solid rgba(99,102,241,0.3);">
      <strong style="color:var(--text,#e2e8f0);">变量说明：</strong><br/>
      • <strong style="color:#6366f1;">W(a,b)</strong> — 小波系数，表示信号在尺度 a、位置 b 处的频率成分强度<br/>
      • <strong style="color:#6366f1;">a</strong>（尺度参数）— 控制小波的伸缩：a 大→低频（宽窗口），a 小→高频（窄窗口）<br/>
      • <strong style="color:#6366f1;">b</strong>（平移参数）— 控制小波在时间轴上的位置，实现时间局部化<br/>
      • <strong style="color:#6366f1;">ψ*</strong> — 母小波 ψ 的复共轭，(1/√|a|) 为能量归一化因子<br/>
      • <strong style="color:#6366f1;">f(t)</strong> — 输入信号（如图像的某一行像素序列）<br/>
      <span style="color:#f59e0b;">本质：</span>用不同尺度的"放大镜"在信号上滑动，大尺度看低频轮廓，小度看高频细节。
    </div>
  </div>

  <!-- DWT Mallat 算法公式 -->
  <div>
    <div style="font-family:'Microsoft YaHei',sans-serif; font-size:12px; color:#0ea5e9; font-weight:bold; margin-bottom:8px;">② 离散小波变换 (DWT) — Mallat 快速算法</div>
    <div style="padding:16px 12px; background:rgba(14,165,233,0.08); border-radius:8px; border:1px solid rgba(14,165,233,0.2); font-family:'Cambria','Microsoft YaHei',serif; font-size:14px; color:var(--text,#e2e8f0); line-height:2.2;">
      <div style="text-align:center;">
        <span style="color:#0ea5e9; font-size:12px; font-family:'Microsoft YaHei',sans-serif;">分解（下采样 ↓2）：</span>
      </div>
      <div style="text-align:center; margin:4px 0;">
        a<sub>j</sub>[n] = Σ<sub>k</sub> h[k − 2n] · a<sub>j−1</sub>[k] &nbsp;&nbsp;<span style="color:var(--text-muted,#94a3b8); font-size:12px;">（低频近似系数）</span>
      </div>
      <div style="text-align:center; margin:4px 0 12px 0;">
        d<sub>j</sub>[n] = Σ<sub>k</sub> g[k − 2n] · a<sub>j−1</sub>[k] &nbsp;&nbsp;<span style="color:var(--text-muted,#94a3b8); font-size:12px;">（高频细节系数）</span>
      </div>
      <div style="text-align:center;">
        <span style="color:#0ea5e9; font-size:12px; font-family:'Microsoft YaHei',sans-serif;">重构（上采样 ↑2）：</span>
      </div>
      <div style="text-align:center; margin:4px 0;">
        a<sub>j−1</sub>[n] = Σ<sub>k</sub> h̃[n − 2k] · a<sub>j</sub>[k] + Σ<sub>k</sub> g̃[n − 2k] · d<sub>j</sub>[k]
      </div>
    </div>
    <div style="font-family:'Microsoft YaHei',sans-serif; font-size:12px; color:var(--text-muted,#94a3b8); line-height:1.9; margin-top:10px; padding-left:8px; border-left:2px solid rgba(14,165,233,0.3);">
      <strong style="color:var(--text,#e2e8f0);">变量说明：</strong><br/>
      • <strong style="color:#0ea5e9;">h</strong> — 低通分解滤波器，<strong style="color:#0ea5e9;">g</strong> — 高通分解滤波器（g[k] = (−1)<sup>k</sup> h[N−1−k]）<br/>
      • <strong style="color:#0ea5e9;">h̃, g̃</strong> — 对应的重构滤波器<br/>
      • <strong style="color:#0ea5e9;">a<sub>j</sub></strong> — 第 j 层低频近似，<strong style="color:#0ea5e9;">d<sub>j</sub></strong> — 第 j 层高频细节<br/>
      • <strong style="color:#0ea5e9;">↓2</strong> — 隔点下采样（数据量减半），<strong style="color:#0ea5e9;">↑2</strong> — 零插值上采样<br/>
      <span style="color:#f59e0b;">本质：</span>Mallat 算法用滤波+下采样替代积分运算，将 CWT 的 O(N²) 复杂度降为 O(N log N)，是实际工程中的标准快速算法。
    </div>
  </div>
</div>

<!-- ===== 2.2 小波在去雨中的具体实现步骤（4步流程） ===== -->
<div style="margin:24px 0; padding:20px; background:var(--bg-card,rgba(30,41,59,0.4)); border-radius:12px; border:1px solid rgba(16,185,129,0.25);">

    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#10b981;flex-shrink:0;"></span>

  </h4>

  <!-- kg-flow 风格4步流程图 -->
  <div class="kg-flow" style="display:flex; align-items:stretch; justify-content:center; gap:2px; flex-wrap:wrap; margin:18px 0;">
    <!-- Step 1 -->
    <div style="flex:1; min-width:95px; max-width:130px; padding:14px 10px; background:linear-gradient(135deg,rgba(99,102,241,0.15),rgba(99,102,241,0.05)); border:1px solid rgba(99,102,241,0.4); border-radius:10px; text-align:center;">
      <div style="font-size:10px; color:#6366f1; font-weight:bold; margin-bottom:6px; letter-spacing:1px;">STEP 1</div>
      <div style="font-size:13px; color:var(--text,#e2e8f0); font-weight:bold; margin-bottom:6px; font-family:'Microsoft YaHei',sans-serif;">小波分解</div>

    </div>
    <div style="display:flex; align-items:center; padding:0 4px; font-size:22px; color:var(--text-muted,#94a3b8);">→</div>
    <!-- Step 2 -->
    <div style="flex:1; min-width:95px; max-width:130px; padding:14px 10px; background:linear-gradient(135deg,rgba(14,165,233,0.15),rgba(14,165,233,0.05)); border:1px solid rgba(14,165,233,0.4); border-radius:10px; text-align:center;">
      <div style="font-size:10px; color:#0ea5e9; font-weight:bold; margin-bottom:6px; letter-spacing:1px;">STEP 2</div>
      <div style="font-size:13px; color:var(--text,#e2e8f0); font-weight:bold; margin-bottom:6px; font-family:'Microsoft YaHei',sans-serif;">阈值处理</div>
      <div style="font-size:10px; color:var(--text-muted,#94a3b8); line-height:1.6; font-family:'Microsoft YaHei',sans-serif;">对高频子带施加软/硬阈值，初步滤除雨纹噪声，保留边缘细节</div>
    </div>
    <div style="display:flex; align-items:center; padding:0 4px; font-size:22px; color:var(--text-muted,#94a3b8);">→</div>
    <!-- Step 3 -->
    <div style="flex:1; min-width:95px; max-width:130px; padding:14px 10px; background:linear-gradient(135deg,rgba(245,158,11,0.15),rgba(245,158,11,0.05)); border:1px solid rgba(245,158,11,0.4); border-radius:10px; text-align:center;">
      <div style="font-size:10px; color:#f59e0b; font-weight:bold; margin-bottom:6px; letter-spacing:1px;">STEP 3</div>
      <div style="font-size:13px; color:var(--text,#e2e8f0); font-weight:bold; margin-bottom:6px; font-family:'Microsoft YaHei',sans-serif;">特征提取</div>
      <div style="font-size:10px; color:var(--text-muted,#94a3b8); line-height:1.6; font-family:'Microsoft YaHei',sans-serif;">将各子带输入深度网络 (CNN/Transformer)，进一步分离雨纹与背景特征</div>
    </div>
    <div style="display:flex; align-items:center; padding:0 4px; font-size:22px; color:var(--text-muted,#94a3b8);">→</div>
    <!-- Step 4 -->
    <div style="flex:1; min-width:95px; max-width:130px; padding:14px 10px; background:linear-gradient(135deg,rgba(16,185,129,0.15),rgba(16,185,129,0.05)); border:1px solid rgba(16,185,129,0.4); border-radius:10px; text-align:center;">
      <div style="font-size:10px; color:#10b981; font-weight:bold; margin-bottom:6px; letter-spacing:1px;">STEP 4</div>
      <div style="font-size:13px; color:var(--text,#e2e8f0); font-weight:bold; margin-bottom:6px; font-family:'Microsoft YaHei',sans-serif;">图像重建</div>
      <div style="font-size:10px; color:var(--text-muted,#94a3b8); line-height:1.6; font-family:'Microsoft YaHei',sans-serif;">对处理后的子带执行逆小波变换 (IDWT)，重建清晰去雨图像</div>
    </div>
  </div>

  <p style="font-family:'Microsoft YaHei',sans-serif; font-size:12px; color:var(--text-muted,#94a3b8); line-height:1.8; margin:14px 0 0 0; padding:10px 12px; background:rgba(16,185,129,0.06); border-radius:6px;">
    <strong style="color:#10b981;">关键洞察：</strong>雨纹在频域中主要表现为高频成分，而图像边缘也属于高频。小波分解的优势在于<strong style="color:var(--text,#e2e8f0);">多尺度分离</strong>——不同方向（水平 LH、垂直 HL、对角 HH）的雨纹被分配到不同子带，使网络能更精准地区分"雨纹"与"边缘"，避免去雨时模糊边缘。
  </p>
</div>

<!-- ===== 2.3 小波在图像压缩中的应用（JPEG2000原理） ===== -->
<div style="margin:24px 0; padding:20px; background:var(--bg-card,rgba(30,41,59,0.4)); border-radius:12px; border:1px solid rgba(245,158,11,0.25);">
  <h4 style="color:var(--text,#e2e8f0); font-family:'Microsoft YaHei',sans-serif; font-size:15px; margin:0 0 8px 0; display:flex; align-items:center; gap:8px;">
    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;flex-shrink:0;"></span>

  </p>

      <!-- 中央说明文字 -->
      <text x="240" y="108" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10" fill="var(--text-muted,#94a3b8)" opacity="0.6">— 可逆流水线 —</text>

  <p style="font-family:'Microsoft YaHei',sans-serif; font-size:12px; color:var(--text-muted,#94a3b8); line-height:1.8; margin:14px 0 0 0; padding:10px 12px; background:rgba(245,158,11,0.06); border-radius:6px;">
    <strong style="color:#f59e0b;">JPEG2000 vs JPEG：</strong>JPEG 使用 8×8 DCT 分块变换，高压缩率时出现明显块效应；JPEG2000 使用全图小波变换，无块边界，且支持<strong style="color:var(--text,#e2e8f0);">感兴趣区域 (ROI) 编码</strong>——可对图像中重要区域分配更多比特。其熵编码采用 EBCOT (Embedded Block Coding with Optimized Truncation)，实现码率精确可控的嵌入式码流。
  </p>
