<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 深度学习论文库</title>
<!-- KaTeX for math rendering -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});"></script>
<script>
// Extended KaTeX config for \( \) and \[ \] delimiters
document.addEventListener('DOMContentLoaded', function() {
  var checkKatex = setInterval(function() {
    if (typeof renderMathInElement === 'function') {
      clearInterval(checkKatex);
      renderMathInElement(document.body, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false},
          {left: '\\[', right: '\\]', display: true}
        ],
        throwOnError: false
      });
    }
  }, 200);
});
</script>
<style>
/* ========== Reset & Variables ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f172a;
  --bg-card: #1e293b;
  --bg-sidebar: #162032;
  --text: #e2e8f0;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --border: #334155;
  --primary: #6366f1;
  --primary-light: #818cf8;
  --primary-glow: rgba(99,102,241,0.3);
  --shimmer-mid: #2a3a52;
  --accent-green: #22c55e;
  --accent-amber: #f59e0b;
  --accent-blue: #3b82f6;
  --accent-red: #ef4444;
  --accent-purple: #a855f7;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
}

/* ========== Light Theme ========== */
[data-theme="light"] {
  --bg: #f8fafc;
  --bg-card: #ffffff;
  --bg-sidebar: #f1f5f9;
  --text: #1e293b;
  --text-muted: #64748b;
  --text-dim: #94a3b8;
  --border: #e2e8f0;
  --primary: #6366f1;
  --primary-light: #4f46e5;
  --primary-glow: rgba(99,102,241,0.15);
  --shimmer-mid: #d4d8e8;
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
}

/* ========== Smooth Theme Transition ========== */
html.theme-transitioning,
html.theme-transitioning *,
html.theme-transitioning *::before,
html.theme-transitioning *::after {
  transition: background-color 0.5s cubic-bezier(0.4,0,0.2,1),
              color 0.5s cubic-bezier(0.4,0,0.2,1),
              border-color 0.5s cubic-bezier(0.4,0,0.2,1),
              box-shadow 0.5s cubic-bezier(0.4,0,0.2,1) !important;
}

/* ========== Theme Toggle Button ========== */
.theme-toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1000;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: var(--shadow);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
  -webkit-user-select: none;
  user-select: none;
}
.theme-toggle:hover {
  transform: scale(1.1) rotate(15deg);
  box-shadow: 0 6px 32px rgba(99,102,241,0.25);
}
.theme-toggle:active {
  transform: scale(0.95);
}
.theme-toggle .icon-sun,
.theme-toggle .icon-moon {
  position: absolute;
  transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.theme-toggle .icon-sun {
  opacity: 0;
  transform: rotate(-90deg) scale(0.5);
}
.theme-toggle .icon-moon {
  opacity: 1;
  transform: rotate(0deg) scale(1);
}
[data-theme="light"] .theme-toggle .icon-sun {
  opacity: 1;
  transform: rotate(0deg) scale(1);
}
[data-theme="light"] .theme-toggle .icon-moon {
  opacity: 0;
  transform: rotate(90deg) scale(0.5);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
}

/* ========== Sidebar ========== */
.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  padding: 24px 0;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 10;
}

.sidebar-header {
  padding: 0 20px 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}

.sidebar-header h2 {
  font-size: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, var(--primary-light), var(--accent-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.sidebar-nav { flex: 1; padding: 0 12px; }

.cat-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.cat-item:hover { background: rgba(99,102,241,0.1); color: var(--text); }

.cat-item.active {
  background: rgba(99,102,241,0.2);
  color: var(--primary-light);
  font-weight: 600;
}

.cat-item .count {
  margin-left: auto;
  font-size: 12px;
  background: var(--border);
  padding: 2px 8px;
  border-radius: 10px;
  color: var(--text-muted);
}

.cat-item.active .count {
  background: var(--primary);
  color: #fff;
}

.cat-item.all-cats { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 14px; }

/* ========== Main Content ========== */
.main { flex: 1; padding: 32px; overflow-y: auto; max-height: 100vh; }

/* --- Top Stats --- */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
  margin-bottom: 32px;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  transition: var(--transition);
}

.stat-card:hover { border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }

.stat-num { font-size: 36px; font-weight: 700; background: linear-gradient(135deg, var(--primary-light), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

.stat-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

/* --- Toolbar --- */
.toolbar {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
  align-items: center;
}

.search-box {
  flex: 1;
  min-width: 240px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 10px 16px 10px 42px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: var(--transition);
}

.search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

.search-box .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 16px; }

.status-filter {
  display: flex;
  gap: 4px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 3px;
}

.status-btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13px;
  transition: var(--transition);
}

.status-btn:hover { color: var(--text); }
.status-btn.active { background: var(--primary); color: #fff; }

.result-info {
  font-size: 13px;
  color: var(--text-dim);
  margin-left: auto;
}

/* --- Paper Grid --- */
.paper-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 20px;
}

.paper-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  transition: var(--transition);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.paper-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  transition: var(--transition);
}

.paper-card.status-待读::before { background: var(--accent-amber); }
.paper-card.status-精读中::before { background: var(--accent-blue); }
.paper-card.status-已读::before { background: var(--accent-green); }
.paper-card.status-已复现::before { background: var(--accent-purple); }

.paper-card:hover {
  border-color: var(--primary);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

.paper-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.paper-card-header h3 {
  font-size: 16px;
  line-height: 1.4;
  color: var(--text);
}

.status-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.status-待读 .status-badge { background: rgba(245,158,11,0.15); color: var(--accent-amber); }
.status-精读中 .status-badge { background: rgba(59,130,246,0.15); color: var(--accent-blue); }
.status-已读 .status-badge { background: rgba(34,197,94,0.15); color: var(--accent-green); }
.status-已复现 .status-badge { background: rgba(168,85,247,0.15); color: var(--accent-purple); }

.paper-card .summary {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.6;
  margin-bottom: 14px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.paper-card .tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
}

.tag {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 12px;
  background: rgba(99,102,241,0.12);
  color: var(--primary-light);
}

.paper-card .meta {
  display: flex;
  gap: 16px;
  font-size: 12px;
  color: var(--text-dim);
}

.meta a {
  color: var(--primary-light);
  text-decoration: none;
  display: flex; align-items: center; gap: 4px;
}

.meta a:hover { text-decoration: underline; }

/* --- Empty State --- */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 20px;
  color: var(--text-dim);
}

.empty-state .icon { font-size: 64px; margin-bottom: 16px; }
.empty-state h3 { font-size: 20px; margin-bottom: 8px; color: var(--text-muted); }

/* --- Loading Skeleton --- */
.skeleton { animation: shimmer 1.5s infinite; background: linear-gradient(90deg, var(--bg-card) 25%, var(--shimmer-mid) 50%, var(--bg-card) 75%); background-size: 200% 100%; border-radius: var(--radius-sm); }

@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.skel-stat { height: 80px; border-radius: var(--radius); }
.skel-card { height: 180px; border-radius: var(--radius); }

/* --- Modal --- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 32px;
  opacity: 0; visibility: hidden; transition: var(--transition);
}

.modal-overlay.open { opacity: 1; visibility: visible; }

.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-width: 720px; width: 100%; max-height: 85vh;
  overflow-y: auto; padding: 32px;
  transform: translateY(20px); transition: var(--transition);
}

.modal-overlay.open .modal { transform: translateY(0); }

.modal-close {
  position: sticky; top: 0; float: right;
  width: 36px; height: 36px;
  border: 1px solid var(--border); border-radius: 50%;
  background: var(--bg-sidebar); color: var(--text-muted);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}

.modal-close:hover { color: var(--text); border-color: var(--text-muted); }

.modal h2 { font-size: 22px; margin-bottom: 20px; }
.modal .detail-section { margin-bottom: 20px; }
.modal .detail-section h4 { font-size: 13px; color: var(--primary-light); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
.modal .detail-section p, .modal .detail-section li { font-size: 14px; color: var(--text-muted); line-height: 1.7; }
.modal .detail-section ul { padding-left: 20px; }
.modal .detail-links { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
.modal .detail-links a {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 18px; border-radius: var(--radius-sm);
  background: rgba(99,102,241,0.12); color: var(--primary-light);
  text-decoration: none; font-size: 14px; transition: var(--transition);
}
.modal .detail-links a:hover { background: rgba(99,102,241,0.25); }

/* --- Scrollbar --- */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #475569; }

/* --- Hero Banner --- */
.hero {
  background: linear-gradient(135deg, rgba(99,102,241,0.08) 0%, rgba(168,85,247,0.06) 50%, rgba(59,130,246,0.04) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px 36px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}

.hero::after {
  content: '';
  position: absolute;
  top: -50%; right: -10%;
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}

.hero-greeting {
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  position: relative;
  z-index: 1;
}

.hero-subtitle {
  font-size: 14px;
  color: var(--text-muted);
  position: relative;
  z-index: 1;
  line-height: 1.6;
}

.hero-subtitle .highlight {
  color: var(--primary-light);
  font-weight: 600;
}

/* --- Progress Bar --- */
.progress-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 20px;
}

.progress-info {
  min-width: 100px;
}

.progress-label {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.progress-percent {
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary-light), var(--accent-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.progress-bar-wrap {
  flex: 1;
  height: 10px;
  background: var(--border);
  border-radius: 5px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  border-radius: 5px;
  background: linear-gradient(90deg, var(--primary), var(--accent-purple));
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  width: 0%;
}

.progress-detail {
  font-size: 12px;
  color: var(--text-dim);
  min-width: 80px;
  text-align: right;
  line-height: 1.5;
}

/* --- Floating Action Button --- */
.fab {
  position: fixed;
  bottom: 32px;
  right: 32px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  border: none;
  cursor: pointer;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px var(--primary-glow);
  transition: var(--transition);
  opacity: 0;
  transform: translateY(20px);
  pointer-events: none;
  z-index: 50;
}

.fab.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.fab:hover {
  background: var(--primary-light);
  transform: translateY(-4px);
  box-shadow: 0 8px 30px var(--primary-glow);
}

/* --- Random Recommend Button --- */
.btn-random {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  color: var(--primary-light);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: var(--transition);
}

.btn-random:hover {
  border-color: var(--primary);
  background: rgba(99,102,241,0.1);
  box-shadow: 0 0 16px rgba(99,102,241,0.15);
}

.btn-random:active { transform: scale(0.96); }

/* --- Card Tilt Effect --- */
.paper-card.tilt-enabled {
  transform-style: preserve-3d;
  perspective: 800px;
}

/* --- Fade-in on Scroll --- */
.paper-card.fade-in {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}

.paper-card.fade-in.visible {
  opacity: 1;
  transform: translateY(0);
}

/* --- Venue Badge --- */
.venue-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}

.venue-badge.cvpr { background: rgba(34,197,94,0.12); color: #22c55e; }
.venue-badge.cvprw { background: rgba(34,197,94,0.08); color: #4ade80; }
.venue-badge.iccv { background: rgba(59,130,246,0.12); color: #3b82f6; }
.venue-badge.eccv { background: rgba(168,85,247,0.12); color: #a855f7; }
.venue-badge.neurips { background: rgba(239,68,68,0.12); color: #ef4444; }
.venue-badge.iclr { background: rgba(245,158,11,0.12); color: #f59e0b; }
.venue-badge.icml { background: rgba(99,102,241,0.12); color: #818cf8; }
.venue-badge.aaai { background: rgba(236,72,153,0.12); color: #ec4899; }
.venue-badge.arxiv { background: rgba(148,163,184,0.12); color: #94a3b8; }

/* --- Reading Time --- */
.reading-time {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--text-dim);
}

/* --- Responsive --- */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .paper-grid { grid-template-columns: 1fr; }
  .main { padding: 16px; }
  .hero { padding: 24px 20px; }
  .hero-greeting { font-size: 22px; }
  .progress-section { flex-direction: column; align-items: flex-start; gap: 12px; }
  .fab { bottom: 20px; right: 20px; }
}

/* --- Particle BG --- */
.bg-particles {
  position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0.3;
}

/* --- Notes in Modal --- */
.notes-section {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.notes-loading {
  display: flex; align-items: center; gap: 12px;
  padding: 24px 0; color: var(--text-dim); font-size: 14px;
}

.notes-spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--primary-light);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.notes-content { display: none; }
.notes-content.show { display: block; }

.notes-content h2, .notes-content h3, .notes-content h4, .notes-content h5 {
  color: var(--text);
  margin: 20px 0 10px;
}

.notes-content h2 { font-size: 20px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
.notes-content h3 { font-size: 17px; }
.notes-content h4 { font-size: 15px; color: var(--primary-light); }
.notes-content h5 { font-size: 14px; color: var(--text-muted); }

.notes-content p {
  color: var(--text-muted);
  font-size: 14px; line-height: 1.8; margin-bottom: 12px;
}

.notes-content strong { color: var(--text); font-weight: 600; }
.notes-content em { color: var(--accent-amber); font-style: normal; }

.notes-content code {
  background: rgba(99,102,241,0.12);
  color: var(--primary-light);
  padding: 2px 6px; border-radius: 4px;
  font-size: 13px;
}

.notes-content pre {
  background: var(--bg-sidebar);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px; margin: 12px 0;
  overflow-x: auto;
  font-size: 13px; line-height: 1.6;
}

.notes-content pre code {
  background: none; padding: 0; color: var(--text-muted);
}

.notes-content blockquote {
  border-left: 3px solid var(--primary);
  padding: 12px 16px; margin: 12px 0;
  background: rgba(99,102,241,0.05);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--text-muted); font-size: 14px;
}

.notes-content ul, .notes-content ol {
  color: var(--text-muted);
  font-size: 14px; line-height: 1.8;
  padding-left: 24px; margin-bottom: 12px;
}

.notes-content li { margin-bottom: 4px; }

.notes-content hr {
  border: none; border-top: 1px solid var(--border);
  margin: 20px 0;
}

.notes-content a {
  color: var(--primary-light); text-decoration: none;
}
.notes-content a:hover { text-decoration: underline; }

.notes-table {
  width: 100%; border-collapse: collapse;
  margin: 12px 0; font-size: 13px;
}

.notes-table th {
  background: var(--bg-sidebar);
  color: var(--text); font-weight: 600;
  padding: 10px 14px; text-align: left;
  border-bottom: 2px solid var(--primary);
}

.notes-table td {
  padding: 8px 14px; color: var(--text-muted);
  border-bottom: 1px solid var(--border);
}

.notes-table tr:hover td { background: rgba(99,102,241,0.04); }

.notes-error {
  display: none; padding: 16px;
  background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.2);
  border-radius: var(--radius-sm);
  color: var(--accent-red); font-size: 13px;
}

.notes-error.show { display: block; }

/* --- Interactive Step Stepper --- */
.walkthrough-stepper {
  margin: 24px 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  background: rgba(30,41,59,0.6);
}
.stepper-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(168,85,247,0.1));
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  transition: var(--transition);
}
.stepper-header:hover { background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(168,85,247,0.15)); }
.stepper-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 600;
  color: var(--primary-light);
}
.stepper-header-left svg { width: 20px; height: 20px; fill: var(--primary-light); }
.stepper-progress {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-muted);
}
.stepper-progress-bar {
  width: 80px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.stepper-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--accent-purple));
  border-radius: 2px;
  transition: width 0.4s ease;
}
.stepper-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  background: rgba(15,23,42,0.4);
}
.stepper-dots {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.stepper-dot {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  border: 2px solid var(--border);
  color: var(--text-dim);
  background: var(--bg);
}
.stepper-dot.active {
  border-color: var(--primary);
  color: #fff;
  background: var(--primary);
  box-shadow: 0 0 10px var(--primary-glow);
}
.stepper-dot.done {
  border-color: var(--accent-green);
  color: var(--accent-green);
  background: rgba(34,197,94,0.1);
}
.stepper-dot:hover:not(.active) { border-color: var(--primary-light); color: var(--text); }
.stepper-btns { display: flex; gap: 8px; }
.stepper-btn {
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-muted);
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  transition: var(--transition);
}
.stepper-btn:hover { border-color: var(--primary); color: var(--text); background: rgba(99,102,241,0.1); }
.stepper-btn:disabled { opacity: 0.3; cursor: default; }
.stepper-btn.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.stepper-btn.primary:hover { background: var(--primary-light); }
.stepper-steps { position: relative; }
.stepper-step {
  padding: 20px;
  border-bottom: 1px solid rgba(51,65,85,0.3);
  animation: stepSlideIn 0.35s ease;
  display: none;
}
.stepper-step.active { display: block; }
.stepper-step.visible { display: block; }
.stepper-step-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.stepper-step-num {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--accent-purple));
  color: #fff;
  flex-shrink: 0;
}
.stepper-step-label {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}
.stepper-step-label small {
  display: block;
  font-size: 12px;
  font-weight: 400;
  color: var(--text-muted);
  margin-top: 2px;
}
.stepper-step-body {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text);
  overflow-x: auto;
}
.stepper-step-body strong { color: var(--primary-light); }
.stepper-step-body em { color: var(--accent-amber); }
.stepper-step-body code {
  background: rgba(99,102,241,0.12);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
  color: var(--accent-green);
}
.stepper-step-body pre {
  background: rgba(15,23,42,0.6);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px;
  overflow-x: auto;
  margin: 12px 0;
  font-size: 13px;
}
.stepper-step-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0;
  font-size: 13px;
}
.stepper-step-body th, .stepper-step-body td {
  padding: 8px 12px;
  border: 1px solid var(--border);
  text-align: left;
}
.stepper-step-body th { background: rgba(99,102,241,0.1); color: var(--primary-light); font-weight: 600; }
.stepper-step-body td { color: var(--text); }
.stepper-step-body tr:hover td { background: rgba(99,102,241,0.04); }
.stepper-step-body ul, .stepper-step-body ol { padding-left: 20px; margin: 8px 0; }
.stepper-step-body li { margin-bottom: 4px; color: var(--text-muted); }
.stepper-step-body h4, .stepper-step-body h5 {
  color: var(--accent-amber);
  margin: 14px 0 8px;
  font-size: 14px;
}
.stepper-step-body hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 14px 0;
}
.stepper-step-body blockquote {
  border-left: 3px solid var(--primary);
  padding: 8px 14px;
  margin: 10px 0;
  background: rgba(99,102,241,0.06);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--text-muted);
  font-size: 13px;
}
@keyframes stepSlideIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* --- Architecture Diagram in Card --- */
.paper-card-arch {
  width: calc(100% + 2px);
  margin: -20px -20px 12px -20px;
  height: 160px;
  overflow: hidden;
  position: relative;
  border-radius: var(--radius) var(--radius) 0 0;
  background: linear-gradient(135deg, rgba(99,102,241,0.05), rgba(168,85,247,0.05));
}
.paper-card-arch img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  transition: transform 0.4s ease;
}
.paper-card:hover .paper-card-arch img {
  transform: scale(1.05);
}
.paper-card-arch::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 50px;
  background: linear-gradient(to top, var(--bg-card), transparent);
  pointer-events: none;
}

/* --- Detail Architecture Image --- */
.detail-arch {
  margin-bottom: 16px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--border);
  cursor: zoom-in;
  transition: var(--transition);
}
.detail-arch:hover {
  border-color: var(--primary);
  box-shadow: 0 0 16px var(--primary-glow);
}
.detail-arch img {
  width: 100%;
  height: auto;
  display: block;
}
.detail-arch-caption {
  text-align: center;
  font-size: 12px;
  color: var(--text-dim);
  padding: 8px;
  background: rgba(99,102,241,0.05);
}

/* --- Card Actions (status buttons) --- */
.card-actions {
  display: flex;
  gap: 6px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.card-btn {
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
}
.card-btn:hover { border-color: var(--primary); color: var(--text); background: rgba(99,102,241,0.08); }
.card-btn-read:hover { border-color: var(--accent-green); color: var(--accent-green); background: rgba(34,197,94,0.08); }
.card-btn-reading:hover { border-color: var(--accent-amber); color: var(--accent-amber); background: rgba(245,158,11,0.08); }
.card-btn-done:hover { border-color: var(--accent-purple); color: var(--accent-purple); background: rgba(168,85,247,0.08); }
.card-btn-reset:hover { border-color: var(--accent-red); color: var(--accent-red); background: rgba(239,68,68,0.06); }

/* --- Toast --- */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-card);
  color: var(--text);
  border: 1px solid var(--primary);
  padding: 10px 24px;
  border-radius: var(--radius);
  font-size: 13px;
  z-index: 99999;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
  box-shadow: 0 4px 20px var(--primary-glow);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* --- Compare Mode Cards --- */
.paper-card.compare-mode-card {
  cursor: pointer;
  outline: 2px dashed transparent;
  outline-offset: -2px;
  transition: outline-color 0.2s, box-shadow 0.2s;
}
.paper-card.compare-mode-card:hover {
  outline-color: var(--primary);
}
.paper-card.selected-compare {
  outline-color: var(--accent-green);
  box-shadow: 0 0 16px rgba(34,197,94,0.3);
}

/* --- Notes Images --- */
.notes-img-wrap {
  margin: 16px 0;
  text-align: center;
  position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  transition: var(--transition);
}
.notes-img-wrap:hover { box-shadow: 0 0 20px var(--primary-glow); }
.notes-img-wrap.highlight {
  border: 1px solid rgba(99,102,241,0.3);
  background: rgba(99,102,241,0.03);
  padding: 12px;
}
.notes-content img, .notes-img {
  max-width: 100%;
  height: auto;
  border-radius: var(--radius-sm);
  margin: 0 auto;
  display: block;
  cursor: zoom-in;
  transition: transform 0.3s ease;
}
.notes-img-wrap:hover img { transform: scale(1.01); }
.notes-img.process-diagram { max-width: 95%; }
.notes-img-caption {
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-muted);
  font-style: italic;
}
.badge-process {
  display: inline-block;
  margin-top: 6px;
  padding: 2px 10px;
  font-size: 11px;
  background: linear-gradient(135deg, var(--primary), var(--accent-purple));
  color: #fff;
  border-radius: 12px;
  letter-spacing: 0.5px;
}

/* --- Image Lightbox --- */
.notes-lightbox {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.92);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
  animation: fadeIn 0.2s ease;
}
.notes-lightbox img {
  max-width: 95vw;
  max-height: 92vh;
  border-radius: var(--radius);
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* --- Compare & Export & Mark-All Buttons --- */
.btn-compare, .btn-export, .btn-mark-all {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: var(--transition);
}
.btn-compare:hover, .btn-export:hover, .btn-mark-all:hover {
  border-color: var(--primary);
  color: var(--text);
  background: rgba(99,102,241,0.1);
}
.btn-compare.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

/* --- Compare Modal --- */
.compare-modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; padding: 32px;
  opacity: 0; visibility: hidden; transition: var(--transition);
}
.compare-modal-overlay.open { opacity: 1; visibility: visible; }
.compare-modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-width: 900px; width: 100%; max-height: 85vh;
  overflow-y: auto; padding: 32px;
  transform: translateY(20px); transition: var(--transition);
}
.compare-modal-overlay.open .compare-modal { transform: translateY(0); }
.compare-modal h2 {
  font-size: 22px; margin-bottom: 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.compare-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.compare-table th {
  background: var(--bg-sidebar);
  color: var(--primary-light);
  padding: 10px 14px; text-align: left;
  font-weight: 600; font-size: 12px; text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 2px solid var(--primary);
  width: 120px;
}
.compare-table td {
  padding: 10px 14px; color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  line-height: 1.6;
  vertical-align: top;
}
.compare-table td strong { color: var(--text); }
.compare-table tr:last-child td { border-bottom: none; }
.compare-table tr:hover td { background: rgba(99,102,241,0.04); }
.compare-close {
  width: 36px; height: 36px;
  border: 1px solid var(--border); border-radius: 50%;
  background: var(--bg-sidebar); color: var(--text-muted);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.compare-close:hover { color: var(--text); border-color: var(--text-muted); }
.compare-hint {
  padding: 12px 16px; background: rgba(99,102,241,0.08);
  border: 1px dashed var(--primary);
  border-radius: var(--radius-sm);
  color: var(--primary-light); font-size: 13px;
  margin-bottom: 16px; text-align: center;
}

/* --- Heatmap / Reading Calendar --- */
.heatmap-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 24px;
  min-width: 0;
}
.heatmap-title {
  font-size: 14px; font-weight: 600; color: var(--text);
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.heatmap-body {
  display: flex;
  flex-direction: row;
  gap: 6px;
}
.heatmap-scroll-wrap {
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 6px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.heatmap-scroll-wrap::-webkit-scrollbar {
  height: 6px;
}
.heatmap-scroll-wrap::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}
.heatmap-grid {
  display: flex;
  flex-direction: row;
  gap: 3px;
  flex-wrap: nowrap;
  align-items: flex-start;
}
.heatmap-column {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.heatmap-cell {
  width: 13px; height: 13px;
  border-radius: 2px;
  background: var(--border);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  cursor: pointer;
  position: relative;
}
.heatmap-cell.level-1 { background: rgba(99,102,241,0.30); }
.heatmap-cell.level-2 { background: rgba(99,102,241,0.50); }
.heatmap-cell.level-3 { background: rgba(99,102,241,0.70); }
.heatmap-cell.level-4 { background: rgba(99,102,241,0.90); }
.heatmap-cell.level-5 { background: rgba(129,140,248,1); }
.heatmap-cell:hover {
  transform: scale(1.6);
  z-index: 5;
  box-shadow: 0 2px 8px rgba(99,102,241,0.4);
  outline: 1px solid var(--primary-light);
}
.heatmap-months {
  display: flex;
  flex-direction: row;
  gap: 3px;
  margin-bottom: 6px;
}
.heatmap-month-label {
  font-size: 10px;
  color: var(--text-muted);
  height: 14px;
  line-height: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.heatmap-weekdays {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding-top: 20px;
}
.heatmap-weekday-label {
  font-size: 10px;
  color: var(--text-muted);
  width: 22px;
  height: 13px;
  line-height: 13px;
  text-align: right;
}
.heatmap-weekday-label.empty {
  visibility: hidden;
}
.heatmap-legend {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px; font-size: 11px; color: var(--text-dim);
}
.heatmap-empty {
  font-size: 13px; color: var(--text-dim);
  padding: 16px 0;
}
@media (max-width: 768px) {
  .heatmap-section { padding: 16px; }
  .heatmap-cell { width: 10px; height: 10px; }
  .heatmap-column { gap: 2px; }
  .heatmap-grid { gap: 2px; }
  .heatmap-weekday-label { width: 20px; height: 10px; line-height: 10px; font-size: 9px; }
}

/* --- Card Hover Tooltip --- */
.card-tooltip {
  position: fixed;
  z-index: 300;
  max-width: 340px;
  background: var(--bg-sidebar);
  border: 1px solid var(--primary);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  pointer-events: none;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.card-tooltip.visible {
  opacity: 1;
  transform: translateY(0);
}
.card-tooltip .tt-label {
  font-size: 11px; color: var(--primary-light);
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 6px; font-weight: 600;
}
.card-tooltip .tt-text {
  font-size: 13px; color: var(--text-muted);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-tooltip .tt-loading {
  font-size: 12px; color: var(--text-dim);
  font-style: italic;
}
.card-tooltip .tt-none {
  font-size: 12px; color: var(--text-dim);
}

/* --- Share Button --- */
.btn-share {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  background: rgba(168,85,247,0.12);
  color: var(--accent-purple);
  border: 1px solid transparent;
  cursor: pointer;
  font-size: 14px;
  transition: var(--transition);
}
.btn-share:hover { background: rgba(168,85,247,0.25); }
.btn-share.copied { background: rgba(34,197,94,0.15); color: var(--accent-green); }

/* --- Status Badge Clickable --- */
.status-badge-clickable {
  cursor: pointer;
  transition: var(--transition);
}
.status-badge-clickable:hover {
  transform: scale(1.08);
  filter: brightness(1.2);
}

/* --- Bottom Tab Navigation (Mobile) --- */
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 60px;
  background: var(--bg-sidebar);
  border-top: 1px solid var(--border);
  z-index: 90;
  padding: 0 8px;
}
.bottom-nav-inner {
  display: flex;
  height: 100%;
  align-items: center;
  justify-content: space-around;
}
.bottom-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  flex: 1;
  height: 100%;
  cursor: pointer;
  color: var(--text-dim);
  font-size: 10px;
  font-weight: 500;
  transition: var(--transition);
  border: none;
  background: none;
  padding: 4px;
  -webkit-tap-highlight-color: transparent;
}
.bottom-nav-item .bni-icon { font-size: 20px; }

.settings-actions {

}
.settings-actions button {

}

/* Drawing Guide Panel */
.guide-panel {

}

.guide-body {

.guide-body th, .guide-body td {

}

}

}

/* AI Tools Section in Sidebar */

  border-top: 1px solid var(--border);
}
.ai-tools-title {

}
.ai-tool-btn {
  display: flex; align-items: center; gap: 10px;

  margin-bottom: 6px;

  color: var(--text-muted); font-size: 13px;
  cursor: pointer; transition: var(--transition);

}

  background: rgba(99,102,241,0.1);

}

/* Method Tags */
.method-tags {

}
.method-tag {

}
.method-tag.type-channel {

  border-color: rgba(34,197,94,0.3);
  color: var(--accent-green);
}
.method-tag.type-spatial {

  border-color: rgba(59,130,246,0.3);

}

}

}

}

/* Method Analysis Tab */
.method-tabs {
  display: flex; gap: 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.method-tab {
  padding: 8px 16px;

  color: var(--text-muted); font-size: 13px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: var(--transition);
}
.method-tab:hover { color: var(--text); }
.method-tab.active {
  color: var(--primary-light);
  border-bottom-color: var(--primary);
}

/* AI Loading */
.ai-loading {

  padding: 16px;

}

  border-top-color: var(--primary);

}
@keyframes spin { to { transform: rotate(360deg); } }

/* Batch Progress */
.batch-progress-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);

}

.batch-progress-modal {

  border: 1px solid var(--border);

  text-align: center;
}
.batch-progress-bar-wrap {

}
.batch-progress-bar-fill {
  height: 100%; width: 0%;

}

/* Pairing Analysis Result */
.pairing-result {

}
.pairing-score {

.pairing-item {

}
.pairing-item.good { border-left-color: var(--accent-green); background: rgba(34,197,94,0.06); }
.pairing-item.warn { border-left-color: var(--accent-amber); background: rgba(245,158,11,0.06); }
.pairing-item.bad { border-left-color: var(--accent-red); background: rgba(239,68,68,0.06); }

/* API Key Hint */

}

/* Fallback Badge */
.fallback-badge {

  background: rgba(245,158,11,0.15);
  border: 1px solid rgba(245,158,11,0.3);

  margin-left: 8px;
}

/* Detail Tabs */
.detail-tabs {
  display: flex;
  gap: 4px;
  margin: 16px 0 12px;

  padding-bottom: 0;

</style>

// ============================================================
//  Theme Toggle (丝滑切换)
// ============================================================
(function() {
  const html = document.documentElement;
  const btn = document.getElementById('themeToggle');
  const STORAGE_KEY = 'lunwen-theme';

  // 恢复上次选择
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved === 'light') {
    html.setAttribute('data-theme', 'light');
  }

  btn.addEventListener('click', function() {
    const isLight = html.getAttribute('data-theme') === 'light';
    const next = isLight ? 'dark' : 'light';

    // 添加过渡class
    html.classList.add('theme-transitioning');

    // 切换
    if (next === 'light') {
      html.setAttribute('data-theme', 'light');
    } else {
      html.removeAttribute('data-theme');
    }
    localStorage.setItem(STORAGE_KEY, next);

    // 移除过渡class (过渡完成后)
    setTimeout(function() {
      html.classList.remove('theme-transitioning');
    }, 600);
  });
})();
</script>

// ============================================================
//  Markdown Parser
// ============================================================
function parseLibrary(md) {
  const categories = [
    { id: 'attention', emoji: '🔥', name: '注意力机制', desc: 'Attention Mechanisms' },
    { id: 'channel', emoji: '🌊', name: '通道增强/特征增强', desc: 'Channel/Feature Enhancement' },
    { id: 'deraining', emoji: '🌧️', name: '去雨', desc: 'Image Deraining' },
    { id: 'dehazing', emoji: '🌫️', name: '去雾', desc: 'Image Dehazing' },
    { id: 'irstd', emoji: '🎯', name: '红外小目标检测', desc: 'Infrared Small Target Detection' },
    { id: 'backbone', emoji: '🏗️', name: '骨干网络', desc: 'Backbones' },
    { id: 'detection', emoji: '🎯', name: '目标检测', desc: 'Object Detection' },
    { id: 'segmentation', emoji: '🖼️', name: '语义分割', desc: 'Semantic Segmentation' },
    { id: 'generative', emoji: '📝', name: '生成模型', desc: 'Generative Models' },
    { id: 'multimodal', emoji: '🔗', name: '多模态', desc: 'Multi-modal' },
    { id: 'compression', emoji: '⚡', name: '模型压缩/加速', desc: 'Model Compression' },
    { id: 'optimizer', emoji: '📊', name: '优化器/训练技巧', desc: 'Optimizers & Training' },
    { id: 'multitask_restore', emoji: '🧩', name: '多任务恢复', desc: 'Multi-task Restoration' },
    { id: 'lut_compression', emoji: '⚡', name: '模型压缩/加速', desc: 'LUT Compression' },
    { id: 'scientific_imaging', emoji: '🔬', name: '科学成像', desc: 'Scientific Imaging' },
    { id: 'other', emoji: '🔄', name: '其他', desc: 'Others' },
  ];

  const papers = [];
  let currentCategory = null;

  const lines = md.split('\n');
  let i = 0;

  while (i < lines.length) {
    const line = lines[i].trim();

    // Detect category section (## 🔥 注意力机制  or  ## 🌊 通道增强/特征增强)
    const catMatch = line.match(/^##\s+([^\s]+)\s+(.+)/);
    if (catMatch && !line.includes('论文统计') && !line.includes('待读清单')) {
      const emoji = catMatch[1];
      // Check for "暂无" - skip empty categories
      const nextLine = i + 1 < lines.length ? lines[i + 1].trim() : '';
      if (nextLine.startsWith('> 暂无论文')) {
        i += 2;
        continue;
      }
      currentCategory = categories.find(c => c.emoji === emoji) || categories.find(c => c.name.startsWith(catMatch[2].trim()));
      i++;
      continue;
    }

    // Detect paper title (### Title)
    const paperMatch = line.match(/^###\s+(.+)/);
    if (paperMatch) {
      const title = paperMatch[1].trim();
      const paper = { title, category: currentCategory ? currentCategory.name : '其他', categoryEmoji: currentCategory ? currentCategory.emoji : '🔄', tags: [], status: '待读', summary: '', painPoints: '', method: '', scenarios: '', arxiv: '', code: '', notes: '', archImage: '', date: '' };
      i++;

      // Parse bullet points until next section or EOF
      while (i < lines.length) {
        const bline = lines[i].trim();
        if (bline.startsWith('## ') || bline.startsWith('### ') || bline.startsWith('---')) break;

        const bm = bline.match(/^-\s+\*\*(.+?)\*\*:\s*(.+)/);
        if (bm) {
          const key = bm[1].trim();
          const val = bm[2].trim();
          switch (key) {
            case '分类': paper.category = val.replace(/[^\u4e00-\u9fa5a-zA-Z//\s]/g, '').trim(); break;
            case '标签': paper.tags = val.split(',').map(t => t.trim()).filter(Boolean); break;
            case '状态': paper.status = val.trim(); break;
            case '一句话总结': paper.summary = val; break;
            case '核心痛点': paper.painPoints = val; break;
            case '核心方法': paper.method = val; break;
            case '适用场景': paper.scenarios = val; break;
            case 'arXiv/DOI':
              const alink = val.match(/\[(.+?)\]\((.+?)\)/);
              if (alink) { paper.arxivUrl = alink[2]; paper.arxiv = alink[1]; } else paper.arxiv = val;
              break;
            case '代码链接':
              const clink = val.match(/\[(.+?)\]\((.+?)\)/);
              if (clink) { paper.codeUrl = clink[2]; paper.code = clink[1]; } else paper.code = val;
              break;
            case '笔记链接':
              const nlink = val.match(/\[(.+?)\]\((.+?)\)/);
              if (nlink) { paper.notesUrl = nlink[2]; paper.notes = nlink[1]; }
              else paper.notes = val.replace(/（|）/g, '').trim();
              break;
            case '架构图': paper.archImage = val.trim(); break;
            case '添加时间': paper.date = val.trim(); break;
          }
        }
        i++;
      }

      // Map category back to standardized name
      for (const c of categories) {
        if (paper.category.includes(c.name.split('/')[0])) {
          paper.category = c.name;
          paper.categoryEmoji = c.emoji;
          break;
        }
      }

      papers.push(paper);
      continue;
    }

    i++;
  }

  return papers;
}

// Venue detection from tags
function detectVenue(paper) {
  const tagStr = paper.tags.join(' ').toLowerCase();
  if (tagStr.includes('cvpr2023') || tagStr.includes('cvpr 2023')) return { label: 'CVPR 2023', cls: 'cvpr', emoji: '🎯' };
  if (tagStr.includes('cvpr2022') || tagStr.includes('cvpr 2022')) return { label: 'CVPR 2022', cls: 'cvpr', emoji: '🎯' };
  if (tagStr.includes('cvpr2021') || tagStr.includes('cvpr 2021')) return { label: 'CVPR 2021', cls: 'cvpr', emoji: '🎯' };
  if (tagStr.includes('cvprw')) return { label: 'CVPRW 2021', cls: 'cvprw', emoji: '🏅' };
  if (tagStr.includes('iccv')) return { label: 'ICCV', cls: 'iccv', emoji: '🎯' };
  if (tagStr.includes('eccv')) return { label: 'ECCV', cls: 'eccv', emoji: '🎯' };
  if (tagStr.includes('neurips')) return { label: 'NeurIPS', cls: 'neurips', emoji: '🧠' };
  if (tagStr.includes('iclr')) return { label: 'ICLR', cls: 'iclr', emoji: '📐' };
  if (tagStr.includes('icml')) return { label: 'ICML', cls: 'icml', emoji: '📊' };
  if (tagStr.includes('aaai')) return { label: 'AAAI', cls: 'aaai', emoji: '🤖' };
  return null;
}

// Estimate reading time based on paper complexity and status tags
function estimateReadingTime(paper) {
  const tagStr = paper.tags.join(' ').toLowerCase();
  if (tagStr.includes('transformer') || tagStr.includes('unfolding') || tagStr.includes('multi-stage')) return '约 60 分钟';
  if (tagStr.includes('attention') || tagStr.includes('normalization')) return '约 45 分钟';
  return '约 30 分钟';
}

function getCategoryStats() {
  const map = {};
  categories.forEach(c => { map[c.name] = { total: 0, 待读: 0, 精读中: 0, 已读: 0, 已复现: 0 }; });
  allPapers.forEach(p => {
    if (map[p.category]) {
      map[p.category].total++;
      map[p.category][p.status] = (map[p.category][p.status] || 0) + 1;
    }
  });
  return map;
}

function renderSidebar() {
  const stats = getCategoryStats();
  const totalAll = allPapers.length;
  let html = `<div class="cat-item all-cats${activeCategory === 'all' ? ' active' : ''}" data-cat="all">
    <span>📁</span> 全部论文 <span class="count">${totalAll}</span>
  </div>`;

  categories.forEach(c => {
    const s = stats[c.name];
    if (s.total === 0) return;
    html += `<div class="cat-item${activeCategory === c.name ? ' active' : ''}" data-cat="${c.name}">
      <span>${c.emoji}</span> ${c.name} <span class="count">${s.total}</span>

function renderStats() {
  const stats = getCategoryStats();
  let total = 0, toRead = 0, reading = 0, readed = 0, reproduced = 0;
  Object.values(stats).forEach(s => {
    total += s.total;
    toRead += s.待读;
    reading += s.精读中;
    readed += s.已读;
    reproduced += s.已复现;
  });

  const completed = readed + reproduced;
  const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

  EL.statsBar.innerHTML = `
    <div class="stat-card">
      <div class="stat-num">${total}</div>
      <div class="stat-label">📚 论文总数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">${toRead}</div>
      <div class="stat-label">⏳ 待读</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">${reading}</div>
      <div class="stat-label">📖 精读中</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">${readed}</div>
      <div class="stat-label">✅ 已读</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">${reproduced}</div>
      <div class="stat-label">🔬 已复现</div>
    </div>
  `;

  // Update hero subtitle
  const pending = toRead + reading;
  if (total === 0) {
    EL.heroSubtitle.innerHTML = '这里还很空，<span class="highlight">去搜索第一篇论文</span>来开启你的阅读之旅吧';
  } else if (pending === 0) {
    EL.heroSubtitle.innerHTML = '太厉害了！<span class="highlight">' + total + '</span> 篇论文全部啃完，休息一下？';
  } else {
    EL.heroSubtitle.innerHTML = '你的论文库已有 <span class="highlight">' + total + '</span> 篇论文，其中 <span class="highlight">' + pending + '</span> 篇等待探索';
  }

  // Update progress bar
  EL.progressPercent.textContent = pct + '%';
  EL.progressBarFill.style.width = pct + '%';
  if (total === 0) {
    EL.progressDetail.innerHTML = '暂无论文<br>快去添加吧';
  } else if (pct === 100) {
    EL.progressDetail.innerHTML = '🎉 全部完成！<br>' + total + ' 篇全部拿下';
  } else if (pct > 0) {
    EL.progressDetail.innerHTML = '已掌握 ' + completed + ' 篇<br>剩余 ' + (total - completed) + ' 篇';
  } else {
    EL.progressDetail.innerHTML = '还没开始<br>挑一篇试试手';
  }
}

function simpleMd2Html(md) {
  let html = md;

  // === Step 0: Protect code blocks and LaTeX formulas ===
  const placeholders = [];

  function protect(match, prefix) {
    const idx = placeholders.length;
    placeholders.push(match);
    return `%%PH_${idx}%%`;
  }

  // 0a) Code blocks (```...```)
  html = html.replace(/```[\s\S]*?```/g, m => protect(m, 'code'));

  // 0b) Inline code (`...`)
  html = html.replace(/`([^`]+)`/g, m => protect(m, 'icode'));

  // 0c) Display math: $$...$$
  html = html.replace(/\$\$([\s\S]*?)\$\$/g, m => protect(m, 'dmath'));

  // 0d) \begin{env}...\end{env} standalone
  html = html.replace(/\\begin\{(\w+\*?)\}([\s\S]*?)\\end\{\1\}/g, m => protect(m, 'env'));

  // 0e) \[...\] display math
  html = html.replace(/\\\[[\s\S]*?\\\]/g, m => protect(m, 'dmath'));

  // 0f) \(...\) inline math
  html = html.replace(/\\\((.+?)\\\)/g, m => protect(m, 'imath'));

  // 0g) Inline math: $...$ (not escaped, single line)
  html = html.replace(/(?<!\$)\$(?!\$)([^\$\n]+?)(?<!\$)\$(?!\$)/g, m => protect(m, 'imath'));

  // Now safe to process Markdown without touching protected areas

  // Headings
  html = html.replace(/^#### (.+)$/gm, '<h5>$1</h5>');
  html = html.replace(/^### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^# (.+)$/gm, '<h2>$1</h2>');

  // Bold and italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Links (but skip protected placeholders)
  html = html.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank">$1</a>');

  // Images
  html = html.replace(/!\[(.+?)\]\((.+?)\)/g, (match, alt, src) => {
    const isProcess = /process/i.test(src) || /流程/i.test(alt) || /架构/i.test(alt);
    const cls = isProcess ? 'notes-img process-diagram' : 'notes-img';
    return `<div class="notes-img-wrap ${isProcess ? 'highlight' : ''}">
      <img src="${src}" alt="${escapeHtml(alt)}" class="${cls}" loading="lazy" onerror="this.parentElement.style.display='none'">
      ${alt ? `<p class="notes-img-caption">${escapeHtml(alt)}</p>` : ''}
      ${isProcess ? '<span class="badge-process">📐 数学流程图</span>' : ''}
    </div>`;
  });

  // Tables
  html = html.replace(/(\|.+\|\n\|[-| :]+\|\n((?:\|.+\|\n?)*))/g, match => {
    const rows = match.trim().split('\n').filter(r => !r.match(/^\|[-| :]+\|$/));
    const thead = rows[0].split('|').filter(c => c.trim()).map(c => `<th>${c.trim()}</th>`).join('');
    let tbody = '';
    for (let i = 1; i < rows.length; i++) {
      const cells = rows[i].split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
      tbody += `<tr>${cells}</tr>`;
    }
    return `<table class="notes-table"><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table>`;
  });

  // Blockquotes
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

  // Horizontal rules
  html = html.replace(/^---$/gm, '<hr>');

  // Unordered lists
  html = html.replace(/^((?:- .+\n?)+)/gm, match => {
    const items = match.trim().split('\n').filter(l => l.startsWith('- ')).map(l => `<li>${l.slice(2)}</li>`).join('');
    return `<ul>${items}</ul>`;
  });

  // Ordered lists
  html = html.replace(/^((?:\d+\. .+\n?)+)/gm, match => {
    const items = match.trim().split('\n').filter(l => /^\d+\. /.test(l)).map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
    return `<ol>${items}</ol>`;
  });

  // Paragraphs (double newlines)
  const blocks = html.split(/\n\n+/);
  html = blocks.map(b => {
    b = b.trim();
    if (!b) return '';
    if (/^<(h[1-6]|ul|ol|table|pre|blockquote|hr|%%PH_)/.test(b)) return b;
    return `<p>${b.replace(/\n/g, '<br>')}</p>`;
  }).join('\n');

  // === Final: Restore all protected content ===
  placeholders.forEach((original, idx) => {
    if (original.startsWith('```')) {
      // Code block → <pre><code>escaped content</code></pre>
      const content = original.replace(/```\w*\n?/, '').replace(/```$/, '');
      html = html.replace(`%%PH_${idx}%%`, `<pre><code>${escapeHtml(content.trim())}</code></pre>`);
    } else if (original.startsWith('`') && !original.startsWith('```')) {
      // Inline code → <code>escaped content</code>
      const content = original.replace(/^`/, '').replace(/`$/, '');
      html = html.replace(`%%PH_${idx}%%`, `<code>${escapeHtml(content)}</code>`);
    } else {
      // LaTeX formulas → keep raw for KaTeX rendering
      html = html.replace(`%%PH_${idx}%%`, original);
    }
  });

  return html;
}

async function loadNotes(url) {
  const loadingEl = document.getElementById('notesLoading');
  const contentEl = document.getElementById('notesContent');
  const errorEl = document.getElementById('notesError');

  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const md = await resp.text();
    let html = simpleMd2Html(md);

    // Detect and convert walkthrough sections into interactive steppers
    // Match two title variants: "数学推导过程详解 (Mathematical Walkthrough)" and "数学过程推导 Walkthrough"
    html = html.replace(
      /<h3>([^<]*(?:数学(?:推导)?过程(?:推导)?详解|Walkthrough)[^<]*)<\/h3>([\s\S]*?)(?=<h3>[^<]*(?:实验与效果|四、))/g,
      (match, title, body) => {
        return buildStepper(title, body);
      }
    );
    // Fallback: catch if experiment heading doesn't immediately follow
    if (!html.includes('walkthrough-stepper')) {
      html = html.replace(
        /<h3>([^<]*(?:数学(?:推导)?过程(?:推导)?详解|Walkthrough)[^<]*)<\/h3>([\s\S]*?)(?=<h3>)/g,
        (match, title, body) => {
          if (body.includes('walkthrough-stepper')) return match;
          return buildStepper(title, body);
        }
      );
    }

    contentEl.innerHTML = html;
    contentEl.classList.add('show');
    if (loadingEl) loadingEl.style.display = 'none';
    if (errorEl) errorEl.style.display = 'none';

    // Re-render math in stepper content
    if (typeof renderMathInElement === 'function') {
      setTimeout(() => {
        renderMathInElement(contentEl, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false},
            {left: '\\[', right: '\\]', display: true}
          ],
          throwOnError: false
        });
      }, 100);
    }

    // Attach lightbox to all images
    contentEl.querySelectorAll('.notes-img-wrap img').forEach(img => {
      img.addEventListener('click', () => {
        const lb = document.createElement('div');
        lb.className = 'notes-lightbox';
        lb.innerHTML = `<img src="${img.src}" alt="${img.alt}">`;
        lb.addEventListener('click', () => lb.remove());
        document.body.appendChild(lb);
      });
    });

    // Init all steppers
    initSteppers();
  } catch (err) {
    console.error('Failed to load notes:', err);
    if (loadingEl) loadingEl.style.display = 'none';
    if (errorEl) errorEl.classList.add('show');
  }
}

function buildStepper(title, bodyHtml) {
  // Parse individual steps from the HTML body
  // Steps start with <h4>Step N: or <h4>### Step N: patterns
  const stepRegex = /<h4>([^<]*(?:Step\s+\d+|步骤\s*\d+)[^<]*)<\/h4>/gi;
  let stepMatches = [];
  let m;
  while ((m = stepRegex.exec(bodyHtml)) !== null) {
    stepMatches.push({ title: m[1], index: m.index });
  }

  // If no explicit "Step N" headings found, try splitting by <h4> or <h5> headings
  if (stepMatches.length === 0) {
    const h4Regex = /<h[45]>([^<]+)<\/h[45]>/gi;
    while ((m = h4Regex.exec(bodyHtml)) !== null) {
      stepMatches.push({ title: m[1], index: m.index });
    }
  }

  // Build step content array
  let steps = [];
  for (let i = 0; i < stepMatches.length; i++) {
    const start = stepMatches[i].index;
    const end = i + 1 < stepMatches.length ? stepMatches[i + 1].index : bodyHtml.length;
    let content = bodyHtml.substring(start, end);
    // Remove the heading from content (it goes in step label)
    content = content.replace(/^<h[45][^>]*>[^<]+<\/h[45]>\n?/, '');
    steps.push({
      label: stepMatches[i].title,
      content: content.trim()
    });
  }

  // Fallback: if still no steps, make the whole body one step
  if (steps.length === 0) {
    steps.push({ label: '完整流程', content: bodyHtml.trim() });
  }

  const stepId = 'stepper_' + Math.random().toString(36).substr(2, 6);
  const totalSteps = steps.length;

  let stepsHtml = steps.map((s, i) => `
    <div class="stepper-step ${i === 0 ? 'active' : ''}" data-step="${i}">
      <div class="stepper-step-title">
        <div class="stepper-step-num">${i + 1}</div>
        <div class="stepper-step-label">${s.label}</div>
      </div>
      <div class="stepper-step-body">${s.content}</div>
    </div>
  `).join('');

  let dotsHtml = steps.map((_, i) => `
    <div class="stepper-dot ${i === 0 ? 'active' : ''}" data-target="${i}" onclick="goToStep('${stepId}', ${i})">${i + 1}</div>
  `).join('');

  return `
    <div class="walkthrough-stepper" id="${stepId}">
      <div class="stepper-header" onclick="toggleStepperAll('${stepId}')">
        <div class="stepper-header-left">
          <svg viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          <span>${title}</span>
        </div>
        <div class="stepper-progress">
          <span class="stepper-progress-text">0/${totalSteps}</span>
          <div class="stepper-progress-bar"><div class="stepper-progress-fill" style="width:0%"></div></div>
        </div>
      </div>
      <div class="stepper-nav">
        <div class="stepper-dots">${dotsHtml}</div>
        <div class="stepper-btns">
          <button class="stepper-btn" onclick="expandAllSteps('${stepId}')">展开全部</button>
          <button class="stepper-btn" onclick="collapseSteps('${stepId}')">折叠</button>
          <button class="stepper-btn" onclick="prevStep('${stepId}')" id="${stepId}_prev">&#9664; 上一步</button>
          <button class="stepper-btn primary" onclick="nextStep('${stepId}')" id="${stepId}_next">下一步 &#9654;</button>
        </div>
      </div>
      <div class="stepper-steps">${stepsHtml}</div>
    </div>
  `;
}

function initSteppers() {
  document.querySelectorAll('.walkthrough-stepper').forEach(sp => {
    const id = sp.id;

  });

function goToStep(stepperId, stepIdx) {
  const stepper = document.getElementById(stepperId);
  if (!stepper) return;
  const steps = stepper.querySelectorAll('.stepper-step');
  if (stepIdx < 0 || stepIdx >= steps.length) return;

  steps.forEach((s, i) => {
    s.classList.remove('active', 'visible');
    if (i === stepIdx) {
      s.classList.add('active', 'visible');
    }
  });

  stepper.querySelectorAll('.stepper-dot').forEach((d, i) => {
    d.classList.remove('active', 'done');
    if (i === stepIdx) d.classList.add('active');
    else if (i < stepIdx) d.classList.add('done');
  });

  updateStepperUI(stepperId, stepIdx);

  // Re-render math in the newly visible step
  if (typeof renderMathInElement === 'function') {
    const activeStep = stepper.querySelector('.stepper-step.active .stepper-step-body');
    if (activeStep) {
      setTimeout(() => {
        renderMathInElement(activeStep, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false},
            {left: '\\[', right: '\\]', display: true}
          ],
          throwOnError: false
        });
      }, 50);
    }
  }
}

function prevStep(stepperId) {
  const stepper = document.getElementById(stepperId);
  const current = parseInt(stepper.querySelector('.stepper-dot.active')?.dataset.target || '0');
  goToStep(stepperId, Math.max(0, current - 1));
}

function nextStep(stepperId) {
  const stepper = document.getElementById(stepperId);
  const steps = stepper.querySelectorAll('.stepper-step');
  const current = parseInt(stepper.querySelector('.stepper-dot.active')?.dataset.target || '0');
  goToStep(stepperId, Math.min(steps.length - 1, current + 1));
}

function expandAllSteps(stepperId) {
  const stepper = document.getElementById(stepperId);
  stepper.querySelectorAll('.stepper-step').forEach(s => s.classList.add('visible'));
  stepper.querySelectorAll('.stepper-dot').forEach(d => d.classList.add('done'));
  const steps = stepper.querySelectorAll('.stepper-step');
  const progressFill = stepper.querySelector('.stepper-progress-fill');
  const progressText = stepper.querySelector('.stepper-progress-text');
  if (progressFill) progressFill.style.width = '100%';
  if (progressText) progressText.textContent = `${steps.length}/${steps.length}`;
}

function collapseSteps(stepperId) {
  goToStep(stepperId, 0);
}

function toggleStepperAll(stepperId) {
  const stepper = document.getElementById(stepperId);
  const nav = stepper.querySelector('.stepper-nav');
  const stepsContainer = stepper.querySelector('.stepper-steps');
  if (nav.style.display === 'none') {
    nav.style.display = '';
    stepsContainer.style.display = '';
  } else {
    nav.style.display = 'none';
    stepsContainer.style.display = 'none';
  }
}

function updateStepperUI(stepperId, currentIdx) {
  const stepper = document.getElementById(stepperId);
  if (!stepper) return;
  const steps = stepper.querySelectorAll('.stepper-step');
  const progressFill = stepper.querySelector('.stepper-progress-fill');
  const progressText = stepper.querySelector('.stepper-progress-text');
  const prevBtn = document.getElementById(stepperId + '_prev');
  const nextBtn = document.getElementById(stepperId + '_next');

  if (progressFill) progressFill.style.width = `${((currentIdx + 1) / steps.length) * 100}%`;
  if (progressText) progressText.textContent = `${currentIdx + 1}/${steps.length}`;
  if (prevBtn) prevBtn.disabled = currentIdx === 0;
  if (nextBtn) nextBtn.disabled = currentIdx === steps.length - 1;
}

const STATUS_KEY = 'paper_library_status';

function loadStatusFromStorage() {
  try {
    const saved = localStorage.getItem(STATUS_KEY);

function saveStatusToStorage() {
  const map = {};
  allPapers.forEach(p => { map[p.title] = p.status; });
  localStorage.setItem(STATUS_KEY, JSON.stringify(map));
}

function applySavedStatus() {
  const saved = loadStatusFromStorage();
  allPapers.forEach(p => {
    if (saved[p.title] && STATUS_FLOW.includes(saved[p.title])) {
      p.status = saved[p.title];
    }
  });
}

function setStatus(idx, newStatus) {

  renderStats();

let compareMode = false;

document.getElementById('btnCompare').addEventListener('click', () => {

  const btn = document.getElementById('btnCompare');

  if (compareMode) {
    btn.classList.add('active');

    document.querySelectorAll('.paper-card.fade-in').forEach(card => {

function handleCompareClick(e) {
  e.stopPropagation();
  const card = e.currentTarget;
  const idx = parseInt(card.dataset.idx);
  if (isNaN(idx)) return;

  const p = allPapers[idx];
  if (!p) return;

  const existIdx = selectedCompare.findIndex(s => s.idx === idx);
  if (existIdx >= 0) {
    selectedCompare.splice(existIdx, 1);
    card.classList.remove('selected-compare');
  } else {
    if (selectedCompare.length >= 4) return; // max 4 for AI pairing
    selectedCompare.push({ idx, paper: p });
    card.classList.add('selected-compare');
  }

  const btn = document.getElementById('btnCompare');
  btn.innerHTML = `📊 选择中 (${selectedCompare.length}/4)`;

  if (selectedCompare.length === 2) {
    setTimeout(() => openCompareModal(selectedCompare[0].paper, selectedCompare[1].paper), 200);
  }
}

function cancelCompareMode() {
  compareMode = false;
  selectedCompare = [];
  document.querySelectorAll('.paper-card.fade-in').forEach(card => {
    card.classList.remove('compare-mode-card', 'selected-compare', 'compare-disabled');
    card.removeEventListener('click', handleCompareClick);
  });
  const btn = document.getElementById('btnCompare');
  btn.classList.remove('active');
  btn.innerHTML = '📊 对比';
}

// ============================================================
//  Card Animations: Tilt + Fade-in
// ============================================================
let tiltCards = [];
let fadeObserver = null;

function initCardAnimations() {
  // Tilt effect
  tiltCards = document.querySelectorAll('.paper-card.fade-in');
  tiltCards.forEach(card => {
    card.addEventListener('mousemove', handleTilt);
    card.addEventListener('mouseleave', resetTilt);
  });

  // Fade-in observer
  if (fadeObserver) fadeObserver.disconnect();
  fadeObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        fadeObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -20px 0px' });

  document.querySelectorAll('.paper-card.fade-in').forEach(card => {
    fadeObserver.observe(card);
  });
}

function handleTilt(e) {
  const card = e.currentTarget;
  const rect = card.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const centerX = rect.width / 2;
  const centerY = rect.height / 2;
  const rotateX = ((y - centerY) / centerY) * -3;
  const rotateY = ((x - centerX) / centerX) * 3;
  card.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-2px)`;
  card.style.transition = 'transform 0.1s ease-out';
}

function resetTilt(e) {
  const card = e.currentTarget;
  card.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) translateY(0px)';
  card.style.transition = 'transform 0.4s ease-out';
}

// ============================================================
//  Heatmap (GitHub-style contribution grid)
// ============================================================
function renderHeatmap() {
  const grid = document.getElementById('heatmapGrid');
  const monthsRow = document.getElementById('heatmapMonths');
  const weekdaysCol = document.getElementById('heatmapWeekdays');
  if (!grid || !monthsRow || !weekdaysCol) return;

  // Build activity map from paper dates + status change history
  const activityMap = {};

  // 1) Count papers added per day (from paper.date field)
  allPapers.forEach(p => {
    if (p.date) {
      const d = parseDateKey(p.date);
      if (d) activityMap[d] = (activityMap[d] || 0) + 1;
    }
  });

  // 2) Load status change history from localStorage
  try {
    const history = JSON.parse(localStorage.getItem('paper_activity_history') || '{}');
    for (const [dateKey, count] of Object.entries(history)) {
      activityMap[dateKey] = (activityMap[dateKey] || 0) + count;
    }
  } catch {}

  // Show last 20 weeks (140 days) + today
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const startDate = new Date(today);
  startDate.setDate(startDate.getDate() - 139);

  // Align to Sunday
  const dayOfWeek = startDate.getDay();
  startDate.setDate(startDate.getDate() - dayOfWeek);

  const totalWeeks = 21;
  const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  // Generate weekday labels (left column): show Mon/Wed/Fri only
  let weekdayHtml = '';
  for (let row = 0; row < 7; row++) {
    const showLabel = (row === 1 || row === 3 || row === 5);
    weekdayHtml += `<div class="heatmap-weekday-label ${showLabel ? '' : 'empty'}">${showLabel ? '周' + dayNames[row] : ''}</div>`;
  }
  weekdaysCol.innerHTML = weekdayHtml;

  // Generate month labels (top row)
  const monthLabelMap = new Array(totalWeeks).fill('');
  for (let col = 0; col < totalWeeks; col++) {
    const firstDayOfCol = new Date(startDate);
    firstDayOfCol.setDate(firstDayOfCol.getDate() + col * 7);
    const m = firstDayOfCol.getMonth();
    const y = firstDayOfCol.getFullYear();
    if (col === 0) {
      monthLabelMap[col] = `${y}年${monthNames[m]}`;
    } else {
      const prevDay = new Date(startDate);
      prevDay.setDate(prevDay.getDate() + (col - 1) * 7);
      if (prevDay.getMonth() !== m) {
        monthLabelMap[col] = monthNames[m];
      }
    }
  }

  let monthsHtml = '';
  for (let col = 0; col < totalWeeks; col++) {
    monthsHtml += `<div class="heatmap-month-label" style="width:13px;">${monthLabelMap[col]}</div>`;
  }
  monthsRow.innerHTML = monthsHtml;

  // Generate grid columns (single pass, no redundancy)
  let gridHtml = '';
  for (let col = 0; col < totalWeeks; col++) {
    gridHtml += '<div class="heatmap-column">';
    for (let row = 0; row < 7; row++) {
      const cellDate = new Date(startDate);
      cellDate.setDate(cellDate.getDate() + col * 7 + row);
      const key = dateKey(cellDate);
      const count = activityMap[key] || 0;

      let level = 0;
      if (count >= 1 && count <= 2) level = 1;
      else if (count >= 3 && count <= 4) level = 2;
      else if (count >= 5 && count <= 7) level = 3;
      else if (count >= 8 && count <= 11) level = 4;
      else if (count >= 12) level = 5;

      const ymd = cellDate.toISOString().split('T')[0];
      const weekdayText = '周' + dayNames[cellDate.getDay()];
      gridHtml += `<div class="heatmap-cell level-${level}"
        data-date="${ymd}"
        data-count="${count}"
        data-weekday="${weekdayText}"
        title="${ymd} ${weekdayText}：${count} 次操作"></div>`;
    }
    gridHtml += '</div>';
  }

  if (gridHtml) {
    grid.innerHTML = gridHtml;
    // Sync month label width with cell width for responsive alignment
    const cells = grid.querySelectorAll('.heatmap-cell');
    const labels = monthsRow.querySelectorAll('.heatmap-month-label');
    const cellW = cells.length ? cells[0].offsetWidth : 13;
    labels.forEach(l => l.style.width = cellW + 'px');
  } else {
    grid.innerHTML = '<div class="heatmap-empty">暂无添加记录</div>';
  }
}

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function parseDateKey(str) {
  // Parse "2026-07-01" format
  const m = str.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return null;
}

function recordActivity(paperTitle, action) {
  const today = dateKey(new Date());
  try {
    const history = JSON.parse(localStorage.getItem('paper_activity_history') || '{}');
    history[today] = (history[today] || 0) + 1;
    localStorage.setItem('paper_activity_history', JSON.stringify(history));
  } catch {}
}

function initParticles() {
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 50; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2 + 1,
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5,
      opacity: Math.random() * 0.5 + 0.2,
    });
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(99, 102, 241, ${p.opacity})`;
      ctx.fill();
    });
    requestAnimationFrame(animate);
  }
  animate();
}
