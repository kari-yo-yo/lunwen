      yAxis:{type:'value',axisLabel:{color:C.dim,fontSize:10},splitLine:{lineStyle:{color:C.border}}},
      series:[{type:'bar',data:coeffs,itemStyle:{borderRadius:[2,2,0,0],color:function(p){return p.data>10?C.purple:C.border;}},barWidth:'65%'}]
    }));window.addEventListener('resize',function(){ch.resize();});
  })();

  // 5. Backprop Gradient Flow
  (function(){
    var d=document.getElementById('echarts-backprop-demo-div');if(!d)return;
    var ch=echarts.init(d);
    ch.setOption(Object.assign({},base,{
      tooltip:{trigger:'axis'},grid:{left:80,right:40,top:15,bottom:20},
      xAxis:{type:'value',name:'Gradient Norm',nameTextStyle:{color:C.muted},axisLabel:{color:C.dim,fontSize:10},splitLine:{lineStyle:{color:C.border}}},
      yAxis:{type:'category',data:['Output','Hidden4','Hidden3','Hidden2','Hidden1','Input'],axisLabel:{color:C.muted,fontSize:11}},
      series:[{type:'bar',data:[0.01,0.05,0.18,0.42,0.85,1.2],
        itemStyle:{borderRadius:[0,4,4,0],color:function(p){return new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#4f46e5'},{offset:1,color:C.purple}]);}},
        label:{show:true,position:'right',color:C.text,fontSize:11},barWidth:'50%'}]
    }));window.addEventListener('resize',function(){ch.resize();});
  })();

  // 6. Weight Initialization Comparison
  (function(){
    var d=document.getElementById('echarts-init-demo-div');if(!d)return;
    var ch=echarts.init(d);var epochs=[];
    for(var i=0;i<=100;i++)epochs.push(i);
    var xv=[],he=[],rnd=[];
    for(var i=0;i<=100;i++){
      xv.push(Math.max(0.02,2.5*Math.exp(-i*0.04)+(Math.random()-0.5)*0.1));
      he.push(Math.max(0.01,2.0*Math.exp(-i*0.05)+(Math.random()-0.5)*0.08));
      rnd.push(Math.max(0.05,3.0*Math.exp(-i*0.015)+(Math.random()-0.5)*0.3));
    }
    ch.setOption(Object.assign({},base,{
      tooltip:{trigger:'axis'},legend:{data:['Xavier','He','Random'],textStyle:{color:C.muted,fontSize:11},top:5},
      grid:{left:50,right:20,top:40,bottom:35},
      xAxis:{type:'category',data:epochs,axisLabel:{color:C.dim,fontSize:10,interval:19},name:'Epoch',nameTextStyle:{color:C.muted}},
      yAxis:{type:'value',name:'Loss',nameTextStyle:{color:C.muted},axisLabel:{color:C.dim,fontSize:10},splitLine:{lineStyle:{color:C.border}}},
      series:[
        {name:'Xavier',type:'line',data:xv,smooth:true,lineStyle:{color:C.purple,width:2},itemStyle:{color:C.purple},symbol:'none'},
        {name:'He',type:'line',data:he,smooth:true,lineStyle:{color:C.blue,width:2},itemStyle:{color:C.blue},symbol:'none'},
        {name:'Random',type:'line',data:rnd,smooth:true,lineStyle:{color:C.orange,width:2,type:'dashed'},itemStyle:{color:C.orange},symbol:'none'}
      ]
    }));window.addEventListener('resize',function(){ch.resize();});
  })();

  // 7. LR Schedule
  (function(){
    var d=document.getElementById('echarts-lr-demo-div');if(!d)return;
    var ch=echarts.init(d);var epochs=[];
    for(var i=0;i<=200;i++)epochs.push(i);
    var step=[],cosine=[],warmup=[];
    for(var i=0;i<=200;i++){
      step.push(i<100?0.01:0.001);
      cosine.push(0.005*(1+Math.cos(Math.PI*i/200)));
      var wl=i<10?i*0.001:0.01*Math.cos(Math.PI*(i-10)/190)*0.5+0.005;
      warmup.push(Math.max(0.0001,wl));
    }
    ch.setOption(Object.assign({},base,{
      tooltip:{trigger:'axis'},legend:{data:['StepLR','CosineAnnealing','WarmupCosine'],textStyle:{color:C.muted,fontSize:11},top:5},
      grid:{left:55,right:20,top:40,bottom:35},
      xAxis:{type:'category',data:epochs,axisLabel:{color:C.dim,fontSize:10,interval:39},name:'Epoch',nameTextStyle:{color:C.muted}},
      yAxis:{type:'value',name:'LR',nameTextStyle:{color:C.muted},axisLabel:{color:C.dim,fontSize:10},splitLine:{lineStyle:{color:C.border}}},
      series:[
        {name:'StepLR',type:'line',data:step,smooth:false,lineStyle:{color:C.orange,width:2},itemStyle:{color:C.orange},symbol:'none',step:'middle'},
        {name:'CosineAnnealing',type:'line',data:cosine,smooth:true,lineStyle:{color:C.purple,width:2},itemStyle:{color:C.purple},symbol:'none'},
        {name:'WarmupCosine',type:'line',data:warmup,smooth:true,lineStyle:{color:C.green,width:2},itemStyle:{color:C.green},symbol:'none'}
      ]
    }));window.addEventListener('resize',function(){ch.resize();});
  })();

  // 8. BatchNorm Effect
  (function(){
    var d=document.getElementById('echarts-bn-demo-div');if(!d)return;
    var ch=echarts.init(d);var epochs=[];
    for(var i=0;i<=100;i++)epochs.push(i);
    var bn=[],nobn=[];
    for(var i=0;i<=100;i++){
      bn.push(Math.max(0.05,2.5*Math.exp(-i*0.045)+(Math.random()-0.5)*0.08));
      nobn.push(Math.max(0.3,3.0*Math.exp(-i*0.025)+(Math.random()-0.5)*0.25));
    }
    ch.setOption(Object.assign({},base,{
      tooltip:{trigger:'axis'},legend:{data:['With BN','Without BN'],textStyle:{color:C.muted,fontSize:11},top:5},
      grid:{left:50,right:20,top:40,bottom:35},
      xAxis:{type:'category',data:epochs,axisLabel:{color:C.dim,fontSize:10,interval:19},name:'Epoch',nameTextStyle:{color:C.muted}},
      yAxis:{type:'value',name:'Loss',nameTextStyle:{color:C.muted},axisLabel:{color:C.dim,fontSize:10},splitLine:{lineStyle:{color:C.border}}},
      series:[
        {name:'With BN',type:'line',data:bn,smooth:true,lineStyle:{color:C.purple,width:2},itemStyle:{color:C.purple},symbol:'none',areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(129,140,248,0.25)'},{offset:1,color:'rgba(129,140,248,0)'}])}},
        {name:'Without BN',type:'line',data:nobn,smooth:true,lineStyle:{color:C.orange,width:2},itemStyle:{color:C.orange},symbol:'none'}
      ]
    }));window.addEventListener('resize',function(){ch.resize();});
  })();

  // 9. Self-Attention Heatmap
  (function(){
    var d=document.getElementById('echarts-attention-demo-div');if(!d)return;
    var ch=echarts.init(d);
    var tokens=['Cat','Sit','On','Mat','Up'];
    var raw=[[0,0.6,0.15,0.1,0.15],[0.2,0,0.25,0.15,0.4],[0.1,0.2,0,0.3,0.4],[0.05,0.1,0.25,0,0.6],[0.15,0.35,0.2,0.3,0]];
    var data=[];
    for(var r=0;r<raw.length;r++)for(var c=0;c<raw[r].length;c++)data.push([c,r,raw[r][c]]);
    ch.setOption(Object.assign({},base,{
      tooltip:{},grid:{left:50,right:40,top:10,bottom:50},
      xAxis:{type:'category',data:tokens,axisLabel:{color:C.muted,fontSize:12}},
      yAxis:{type:'category',data:tokens,axisLabel:{color:C.muted,fontSize:12}},
      visualMap:{min:0,max:0.7,calculable:true,inRange:{color:['#0f172a','#312e81','#6366f1','#818cf8','#c7d2fe']},orient:'horizontal',left:'center',bottom:0,itemWidth:12,textStyle:{color:C.muted,fontSize:10}},
      series:[{type:'heatmap',data:data,label:{show:true,color:C.text,fontSize:11,formatter:function(p){return p.data[2];}},emphasis:{itemStyle:{shadowBlur:10,shadowColor:'rgba(0,0,0,0.5)'}}}]
    }));window.addEventListener('resize',function(){ch.resize();});
  })();

  // 10. SE Channel Weights
  (function(){
    var d=document.getElementById('echarts-se-demo-div');if(!d)return;
    var ch=echarts.init(d);
    var names=['Edge','Texture','Color','Noise','Rain','BG','Contrast','Detail'];
    var w=[0.85,0.72,0.45,0.15,0.92,0.88,0.60,0.78];
    var cs=['#38bdf8','#818cf8','#fbbf24','#64748b','#fb7185','#34d399','#2dd4bf','#a78bfa'];
    ch.setOption(Object.assign({},base,{
      tooltip:{trigger:'axis',formatter:function(p){return p[0].name+': '+p[0].value;}},
      grid:{left:60,right:20,top:15,bottom:35},
      xAxis:{type:'category',data:names,axisLabel:{color:C.muted,fontSize:11,rotate:15}},
      yAxis:{type:'value',max:1,axisLabel:{color:C.dim,fontSize:10},splitLine:{lineStyle:{color:C.border}}},
      series:[{type:'bar',data:w.map(function(v,i){return{value:v,itemStyle:{color:cs[i]}};}),
        itemStyle:{borderRadius:[4,4,0,0]},label:{show:true,position:'top',color:C.text,fontSize:11,formatter:'{c}'},barWidth:'50%'}]
    }));window.addEventListener('resize',function(){ch.resize();});
  })();

  console.log('[ECharts] All 10 interactive charts initialized');
});
}
