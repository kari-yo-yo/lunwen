<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="dns-prefetch" href="//cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="//cdn.jsdelivr.net">
<link rel="preconnect" href="//cdnjs.cloudflare.com" crossorigin>
<title>📚 深度学习论文库</title>
<!-- KaTeX for math rendering -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});"></script>
<script>
// Extended KaTeX config for \( \) and \[ \] delimiters
document.addEventListener('DOMContentLoaded', function() {
  var checkKatex = setInterval(function() {
    if (typeof renderMathInElement === 'function') {
      clearInterval(checkKatex);
      renderMathInElement(document.body, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false},
          {left: '\\[', right: '\\]', display: true}
        ],
        throwOnError: false
      });
    }
  }, 200);
});
</script>
<style>
/* ========== Reset & Variables ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f172a;
  --bg-card: #1e293b;
  --bg-sidebar: #162032;
  --text: #e2e8f0;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --border: #334155;
  --primary: #6366f1;
  --primary-light: #818cf8;
  --primary-glow: rgba(99,102,241,0.3);
  --shimmer-mid: #2a3a52;
  --accent-green: #22c55e;
  --accent-amber: #f59e0b;
  --accent-blue: #3b82f6;
  --accent-red: #ef4444;
  --accent-purple: #a855f7;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
}

/* ========== Light Theme ========== */
[data-theme="light"] {
  --bg: #f8fafc;
  --bg-card: #ffffff;
  --bg-sidebar: #f1f5f9;
  --text: #1e293b;
  --text-muted: #64748b;
  --text-dim: #94a3b8;
  --border: #e2e8f0;
  --primary: #6366f1;
  --primary-light: #4f46e5;
  --primary-glow: rgba(99,102,241,0.15);
  --shimmer-mid: #d4d8e8;
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
}

/* ========== Smooth Theme Transition ========== */
html.theme-transitioning,
html.theme-transitioning *,
html.theme-transitioning *::before,
html.theme-transitioning *::after {
  transition: background-color 0.5s cubic-bezier(0.4,0,0.2,1),
              color 0.5s cubic-bezier(0.4,0,0.2,1),
              border-color 0.5s cubic-bezier(0.4,0,0.2,1),
              box-shadow 0.5s cubic-bezier(0.4,0,0.2,1) !important;
}

/* ========== Theme Toggle Button ========== */
.theme-toggle {
  position: fixed;
  top: 16px;
  right: 64px;
  z-index: 1000;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  box-shadow: var(--shadow);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
  -webkit-user-select: none;
  user-select: none;
}
.theme-toggle:hover {
  transform: scale(1.1) rotate(15deg);
  box-shadow: 0 6px 32px rgba(99,102,241,0.25);
}
.theme-toggle:active {
  transform: scale(0.95);
}
.theme-toggle .icon-sun,
.theme-toggle .icon-moon {
  position: absolute;
  transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.theme-toggle .icon-sun {
  opacity: 0;
  transform: rotate(-90deg) scale(0.5);
}
.theme-toggle .icon-moon {
  opacity: 1;
  transform: rotate(0deg) scale(1);
}
[data-theme="light"] .theme-toggle .icon-sun {
  opacity: 1;
  transform: rotate(0deg) scale(1);
}
[data-theme="light"] .theme-toggle .icon-moon {
  opacity: 0;
  transform: rotate(90deg) scale(0.5);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
}

/* ========== Sidebar ========== */
.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  padding: 24px 0;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 10;
}

.sidebar-header {
  padding: 0 20px 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}

.sidebar-header h2 {
  font-size: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, var(--primary-light), var(--accent-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.sidebar-nav { flex: 1; padding: 0 12px; }

.cat-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.cat-item:hover { background: rgba(99,102,241,0.1); color: var(--text); }

.cat-item.active {
  background: rgba(99,102,241,0.2);
  color: var(--primary-light);
  font-weight: 600;
}

.cat-item .count {
  margin-left: auto;
  font-size: 12px;
  background: var(--border);
  padding: 2px 8px;
  border-radius: 10px;
  color: var(--text-muted);
}

.cat-item.active .count {
  background: var(--primary);
  color: #fff;
}

.cat-item.all-cats { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 14px; }

/* ========== Main Content ========== */
.main { flex: 1; padding: 32px; overflow-y: auto; max-height: 100vh; }

/* --- Top Stats --- */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
  margin-bottom: 32px;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  transition: var(--transition);
}

.stat-card:hover { border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }

.stat-num { font-size: 36px; font-weight: 700; background: linear-gradient(135deg, var(--primary-light), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

.stat-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

/* --- Toolbar --- */
.toolbar {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
  align-items: center;
}

.search-box {
  flex: 1;
  min-width: 240px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 10px 16px 10px 42px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: var(--transition);
}

.search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

.search-box .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 16px; }

.status-filter {
  display: flex;
  gap: 4px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 3px;
}

.status-btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13px;
  transition: var(--transition);
}

.status-btn:hover { color: var(--text); }
.status-btn.active { background: var(--primary); color: #fff; }

.result-info {
  font-size: 13px;
  color: var(--text-dim);
  margin-left: auto;
}

/* --- Paper Grid --- */
.paper-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 20px;
}

.paper-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  transition: var(--transition);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.paper-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  transition: var(--transition);
}

.paper-card.status-待读::before { background: var(--accent-amber); }
.paper-card.status-精读中::before { background: var(--accent-blue); }
.paper-card.status-已读::before { background: var(--accent-green); }
.paper-card.status-已复现::before { background: var(--accent-purple); }

.paper-card:hover {
  border-color: var(--primary);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

.paper-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.paper-card-header h3 {
  font-size: 16px;
  line-height: 1.4;
  color: var(--text);
}

.status-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.status-待读 .status-badge { background: rgba(245,158,11,0.15); color: var(--accent-amber); }
.status-精读中 .status-badge { background: rgba(59,130,246,0.15); color: var(--accent-blue); }
.status-已读 .status-badge { background: rgba(34,197,94,0.15); color: var(--accent-green); }
.status-已复现 .status-badge { background: rgba(168,85,247,0.15); color: var(--accent-purple); }

.paper-card .summary {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.6;
  margin-bottom: 14px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.paper-card .tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
}

.tag {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 12px;
  background: rgba(99,102,241,0.12);
  color: var(--primary-light);
}

.paper-card .meta {
  display: flex;
  gap: 16px;
  font-size: 12px;
  color: var(--text-dim);
}

.meta a {
  color: var(--primary-light);
  text-decoration: none;
  display: flex; align-items: center; gap: 4px;
}

.meta a:hover { text-decoration: underline; }

/* --- Empty State --- */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 20px;
  color: var(--text-dim);
}

.empty-state .icon { font-size: 64px; margin-bottom: 16px; }
.empty-state h3 { font-size: 20px; margin-bottom: 8px; color: var(--text-muted); }

/* --- Loading Skeleton --- */
.skeleton { animation: shimmer 1.5s infinite; background: linear-gradient(90deg, var(--bg-card) 25%, var(--shimmer-mid) 50%, var(--bg-card) 75%); background-size: 200% 100%; border-radius: var(--radius-sm); }

@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.skel-stat { height: 80px; border-radius: var(--radius); }
.skel-card { height: 180px; border-radius: var(--radius); }

/* --- Modal --- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 32px;
  opacity: 0; visibility: hidden; transition: var(--transition);
}

.modal-overlay.open { opacity: 1; visibility: visible; }

.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-width: 720px; width: 100%; max-height: 85vh;
  overflow-y: auto; padding: 32px;
  transform: translateY(20px); transition: var(--transition);
}

.modal-overlay.open .modal { transform: translateY(0); }

.modal-close {
  position: sticky; top: 0; float: right;
  width: 36px; height: 36px;
  border: 1px solid var(--border); border-radius: 50%;
  background: var(--bg-sidebar); color: var(--text-muted);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}

.modal-close:hover { color: var(--text); border-color: var(--text-muted); }

.modal h2 { font-size: 22px; margin-bottom: 20px; }
.modal .detail-section { margin-bottom: 20px; }
.modal .detail-section h4 { font-size: 13px; color: var(--primary-light); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
.modal .detail-section p, .modal .detail-section li { font-size: 14px; color: var(--text-muted); line-height: 1.7; }
.modal .detail-section ul { padding-left: 20px; }
.modal .detail-links { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
.modal .detail-links a {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 18px; border-radius: var(--radius-sm);
  background: rgba(99,102,241,0.12); color: var(--primary-light);
  text-decoration: none; font-size: 14px; transition: var(--transition);
}
.modal .detail-links a:hover { background: rgba(99,102,241,0.25); }

/* --- Scrollbar --- */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #475569; }

/* --- Hero Banner --- */
.hero {
  background: linear-gradient(135deg, rgba(99,102,241,0.08) 0%, rgba(168,85,247,0.06) 50%, rgba(59,130,246,0.04) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px 36px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}

.hero::after {
  content: '';
  position: absolute;
  top: -50%; right: -10%;
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}

.hero-greeting {
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  position: relative;
  z-index: 1;
}

.hero-subtitle {
  font-size: 14px;
  color: var(--text-muted);
  position: relative;
  z-index: 1;
  line-height: 1.6;
}

.hero-subtitle .highlight {
  color: var(--primary-light);
  font-weight: 600;
}

/* --- Progress Bar --- */
.progress-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 20px;
}

.progress-info {
  min-width: 100px;
}

.progress-label {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.progress-percent {
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary-light), var(--accent-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.progress-bar-wrap {
  flex: 1;
  height: 10px;
  background: var(--border);
  border-radius: 5px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  border-radius: 5px;
  background: linear-gradient(90deg, var(--primary), var(--accent-purple));
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  width: 0%;
}

.progress-detail {
  font-size: 12px;
  color: var(--text-dim);
  min-width: 80px;
  text-align: right;
  line-height: 1.5;
}

/* --- Floating Action Button --- */
.fab {
  position: fixed;
  bottom: 32px;
  right: 32px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  border: none;
  cursor: pointer;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px var(--primary-glow);
  transition: var(--transition);
  opacity: 0;
  transform: translateY(20px);
  pointer-events: none;
  z-index: 50;
}

.fab.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.fab:hover {
  background: var(--primary-light);
  transform: translateY(-4px);
  box-shadow: 0 8px 30px var(--primary-glow);
}

/* --- Random Recommend Button --- */
.btn-random {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  color: var(--primary-light);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: var(--transition);
}

.btn-random:hover {
  border-color: var(--primary);
  background: rgba(99,102,241,0.1);
  box-shadow: 0 0 16px rgba(99,102,241,0.15);
}

.btn-random:active { transform: scale(0.96); }

/* --- Card Tilt Effect --- */
.paper-card.tilt-enabled {
  transform-style: preserve-3d;
  perspective: 800px;
}

/* --- Fade-in on Scroll --- */
.paper-card.fade-in {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}

.paper-card.fade-in.visible {
  opacity: 1;
  transform: translateY(0);
}

/* --- Venue Badge --- */
.venue-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}

.venue-badge.cvpr { background: rgba(34,197,94,0.12); color: #22c55e; }
.venue-badge.cvprw { background: rgba(34,197,94,0.08); color: #4ade80; }
.venue-badge.iccv { background: rgba(59,130,246,0.12); color: #3b82f6; }
.venue-badge.eccv { background: rgba(168,85,247,0.12); color: #a855f7; }
.venue-badge.neurips { background: rgba(239,68,68,0.12); color: #ef4444; }
.venue-badge.iclr { background: rgba(245,158,11,0.12); color: #f59e0b; }
.venue-badge.icml { background: rgba(99,102,241,0.12); color: #818cf8; }
.venue-badge.aaai { background: rgba(236,72,153,0.12); color: #ec4899; }
.venue-badge.arxiv { background: rgba(148,163,184,0.12); color: #94a3b8; }

/* --- Reading Time --- */
.reading-time {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--text-dim);
}

/* --- Responsive --- */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .paper-grid { grid-template-columns: 1fr; }
  .main { padding: 16px; }
  .hero { padding: 24px 20px; }
  .hero-greeting { font-size: 22px; }
  .progress-section { flex-direction: column; align-items: flex-start; gap: 12px; }
  .fab { bottom: 20px; right: 20px; }
}

/* --- Particle BG --- */
.bg-particles {
  position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0.3;
}

/* --- Notes in Modal --- */
.notes-section {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.notes-loading {
  display: flex; align-items: center; gap: 12px;
  padding: 24px 0; color: var(--text-dim); font-size: 14px;
}

.notes-spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--primary-light);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.notes-content { display: none; }
.notes-content.show { display: block; }

.notes-content h2, .notes-content h3, .notes-content h4, .notes-content h5 {
  color: var(--text);
  margin: 20px 0 10px;
}

.notes-content h2 { font-size: 20px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
.notes-content h3 { font-size: 17px; }
.notes-content h4 { font-size: 15px; color: var(--primary-light); }
.notes-content h5 { font-size: 14px; color: var(--text-muted); }

.notes-content p {
  color: var(--text-muted);
  font-size: 14px; line-height: 1.8; margin-bottom: 12px;
}

.notes-content strong { color: var(--text); font-weight: 600; }
.notes-content em { color: var(--accent-amber); font-style: normal; }

.notes-content code {
  background: rgba(99,102,241,0.12);
  color: var(--primary-light);
  padding: 2px 6px; border-radius: 4px;
  font-size: 13px;
}

.notes-content pre {
  background: var(--bg-sidebar);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px; margin: 12px 0;
  overflow-x: auto;
  font-size: 13px; line-height: 1.6;
}

.notes-content pre code {
  background: none; padding: 0; color: var(--text-muted);
}

.notes-content blockquote {
  border-left: 3px solid var(--primary);
  padding: 12px 16px; margin: 12px 0;
  background: rgba(99,102,241,0.05);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--text-muted); font-size: 14px;
}

.notes-content ul, .notes-content ol {
  color: var(--text-muted);
  font-size: 14px; line-height: 1.8;
  padding-left: 24px; margin-bottom: 12px;
}

.notes-content li { margin-bottom: 4px; }

.notes-content hr {
  border: none; border-top: 1px solid var(--border);
  margin: 20px 0;
}

.notes-content a {
  color: var(--primary-light); text-decoration: none;
}
.notes-content a:hover { text-decoration: underline; }

.notes-table {
  width: 100%; border-collapse: collapse;
  margin: 12px 0; font-size: 13px;
}

.notes-table th {
  background: var(--bg-sidebar);
  color: var(--text); font-weight: 600;
  padding: 10px 14px; text-align: left;
  border-bottom: 2px solid var(--primary);
}

.notes-table td {
  padding: 8px 14px; color: var(--text-muted);
  border-bottom: 1px solid var(--border);
}

.notes-table tr:hover td { background: rgba(99,102,241,0.04); }

.notes-error {
  display: none; padding: 16px;
  background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.2);
  border-radius: var(--radius-sm);
  color: var(--accent-red); font-size: 13px;
}

.notes-error.show { display: block; }

/* --- Interactive Step Stepper --- */
.walkthrough-stepper {
  margin: 24px 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  background: rgba(30,41,59,0.6);
}
.stepper-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(168,85,247,0.1));
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  transition: var(--transition);
}
.stepper-header:hover { background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(168,85,247,0.15)); }
.stepper-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 600;
  color: var(--primary-light);
}
.stepper-header-left svg { width: 20px; height: 20px; fill: var(--primary-light); }
.stepper-progress {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-muted);
}
.stepper-progress-bar {
  width: 80px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.stepper-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--accent-purple));
  border-radius: 2px;
  transition: width 0.4s ease;
}
.stepper-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  background: rgba(15,23,42,0.4);
}
.stepper-dots {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.stepper-dot {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  border: 2px solid var(--border);
  color: var(--text-dim);
  background: var(--bg);
}
.stepper-dot.active {
  border-color: var(--primary);
  color: #fff;
  background: var(--primary);
  box-shadow: 0 0 10px var(--primary-glow);
}
.stepper-dot.done {
  border-color: var(--accent-green);
  color: var(--accent-green);
  background: rgba(34,197,94,0.1);
}
.stepper-dot:hover:not(.active) { border-color: var(--primary-light); color: var(--text); }
.stepper-btns { display: flex; gap: 8px; }
.stepper-btn {
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-muted);
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  transition: var(--transition);
}
.stepper-btn:hover { border-color: var(--primary); color: var(--text); background: rgba(99,102,241,0.1); }
.stepper-btn:disabled { opacity: 0.3; cursor: default; }
.stepper-btn.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.stepper-btn.primary:hover { background: var(--primary-light); }
.stepper-steps { position: relative; }
.stepper-step {
  padding: 20px;
  border-bottom: 1px solid rgba(51,65,85,0.3);
  animation: stepSlideIn 0.35s ease;
  display: none;
}
.stepper-step.active { display: block; }
.stepper-step.visible { display: block; }
.stepper-step-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.stepper-step-num {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--accent-purple));
  color: #fff;
  flex-shrink: 0;
}
.stepper-step-label {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}
.stepper-step-label small {
  display: block;
  font-size: 12px;
  font-weight: 400;
  color: var(--text-muted);
  margin-top: 2px;
}
.stepper-step-body {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text);
  overflow-x: auto;
}
.stepper-step-body strong { color: var(--primary-light); }
.stepper-step-body em { color: var(--accent-amber); }
.stepper-step-body code {
  background: rgba(99,102,241,0.12);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
  color: var(--accent-green);
}
.stepper-step-body pre {
  background: rgba(15,23,42,0.6);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px;
  overflow-x: auto;
  margin: 12px 0;
  font-size: 13px;
}
.stepper-step-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0;
  font-size: 13px;
}
.stepper-step-body th, .stepper-step-body td {
  padding: 8px 12px;
  border: 1px solid var(--border);
  text-align: left;
}
.stepper-step-body th { background: rgba(99,102,241,0.1); color: var(--primary-light); font-weight: 600; }
.stepper-step-body td { color: var(--text); }
.stepper-step-body tr:hover td { background: rgba(99,102,241,0.04); }
.stepper-step-body ul, .stepper-step-body ol { padding-left: 20px; margin: 8px 0; }
.stepper-step-body li { margin-bottom: 4px; color: var(--text-muted); }
.stepper-step-body h4, .stepper-step-body h5 {
  color: var(--accent-amber);
  margin: 14px 0 8px;
  font-size: 14px;
}
.stepper-step-body hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 14px 0;
}
.stepper-step-body blockquote {
  border-left: 3px solid var(--primary);
  padding: 8px 14px;
  margin: 10px 0;
  background: rgba(99,102,241,0.06);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--text-muted);
  font-size: 13px;
}
@keyframes stepSlideIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* --- Architecture Diagram in Card --- */
.paper-card-arch {
  width: calc(100% + 2px);
  margin: -20px -20px 12px -20px;
  height: 160px;
  overflow: hidden;
  position: relative;
  border-radius: var(--radius) var(--radius) 0 0;
  background: linear-gradient(135deg, rgba(99,102,241,0.05), rgba(168,85,247,0.05));
}
.paper-card-arch img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  transition: transform 0.4s ease;
}
.paper-card:hover .paper-card-arch img {
  transform: scale(1.05);
}
.paper-card-arch::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 50px;
  background: linear-gradient(to top, var(--bg-card), transparent);
  pointer-events: none;
}

/* --- Detail Architecture Image --- */
.detail-arch {
  margin-bottom: 16px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--border);
  cursor: zoom-in;
  transition: var(--transition);
}
.detail-arch:hover {
  border-color: var(--primary);
  box-shadow: 0 0 16px var(--primary-glow);
}
.detail-arch img {
  width: 100%;
  height: auto;
  display: block;
}
.detail-arch-caption {
  text-align: center;
  font-size: 12px;
  color: var(--text-dim);
  padding: 8px;
  background: rgba(99,102,241,0.05);
}

/* --- Card Actions (status buttons) --- */
.card-actions {
  display: flex;
  gap: 6px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.card-btn {
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
}
.card-btn:hover { border-color: var(--primary); color: var(--text); background: rgba(99,102,241,0.08); }
.card-btn-read:hover { border-color: var(--accent-green); color: var(--accent-green); background: rgba(34,197,94,0.08); }
.card-btn-reading:hover { border-color: var(--accent-amber); color: var(--accent-amber); background: rgba(245,158,11,0.08); }
.card-btn-done:hover { border-color: var(--accent-purple); color: var(--accent-purple); background: rgba(168,85,247,0.08); }
.card-btn-reset:hover { border-color: var(--accent-red); color: var(--accent-red); background: rgba(239,68,68,0.06); }

/* --- Toast --- */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-card);
  color: var(--text);
  border: 1px solid var(--primary);
  padding: 10px 24px;
  border-radius: var(--radius);
  font-size: 13px;
  z-index: 99999;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
  box-shadow: 0 4px 20px var(--primary-glow);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* --- Compare Mode Cards --- */
.paper-card.compare-mode-card {
  cursor: pointer;
  outline: 2px dashed transparent;
  outline-offset: -2px;
  transition: outline-color 0.2s, box-shadow 0.2s;
}
.paper-card.compare-mode-card:hover {
  outline-color: var(--primary);
}
.paper-card.selected-compare {
  outline-color: var(--accent-green);
  box-shadow: 0 0 16px rgba(34,197,94,0.3);
}

/* --- Notes Images --- */
.notes-img-wrap {
  margin: 16px 0;
  text-align: center;
  position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  transition: var(--transition);
}
.notes-img-wrap:hover { box-shadow: 0 0 20px var(--primary-glow); }
.notes-img-wrap.highlight {
  border: 1px solid rgba(99,102,241,0.3);
  background: rgba(99,102,241,0.03);
  padding: 12px;
}
.notes-content img, .notes-img {
  max-width: 100%;
  height: auto;
  border-radius: var(--radius-sm);
  margin: 0 auto;
  display: block;
  cursor: zoom-in;
  transition: transform 0.3s ease;
}
.notes-img-wrap:hover img { transform: scale(1.01); }
.notes-img.process-diagram { max-width: 95%; }
.notes-img-caption {
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-muted);
  font-style: italic;
}
.badge-process {
  display: inline-block;
  margin-top: 6px;
  padding: 2px 10px;
  font-size: 11px;
  background: linear-gradient(135deg, var(--primary), var(--accent-purple));
  color: #fff;
  border-radius: 12px;
  letter-spacing: 0.5px;
}

/* --- Image Lightbox --- */
.notes-lightbox {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.92);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
  animation: fadeIn 0.2s ease;
}
.notes-lightbox img {
  max-width: 95vw;
  max-height: 92vh;
  border-radius: var(--radius);
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* --- Compare & Export & Mark-All Buttons --- */
.btn-compare, .btn-export, .btn-mark-all {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: var(--transition);
}
.btn-compare:hover, .btn-export:hover, .btn-mark-all:hover {
  border-color: var(--primary);
  color: var(--text);
  background: rgba(99,102,241,0.1);
}
.btn-compare.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

/* --- Compare Modal --- */
.compare-modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; padding: 32px;
  opacity: 0; visibility: hidden; transition: var(--transition);
}
.compare-modal-overlay.open { opacity: 1; visibility: visible; }
.compare-modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-width: 900px; width: 100%; max-height: 85vh;
  overflow-y: auto; padding: 32px;
  transform: translateY(20px); transition: var(--transition);
}
.compare-modal-overlay.open .compare-modal { transform: translateY(0); }
.compare-modal h2 {
  font-size: 22px; margin-bottom: 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.compare-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.compare-table th {
  background: var(--bg-sidebar);
  color: var(--primary-light);
  padding: 10px 14px; text-align: left;
  font-weight: 600; font-size: 12px; text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 2px solid var(--primary);
  width: 120px;
}
.compare-table td {
  padding: 10px 14px; color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  line-height: 1.6;
  vertical-align: top;
}
.compare-table td strong { color: var(--text); }
.compare-table tr:last-child td { border-bottom: none; }
.compare-table tr:hover td { background: rgba(99,102,241,0.04); }
.compare-close {
  width: 36px; height: 36px;
  border: 1px solid var(--border); border-radius: 50%;
  background: var(--bg-sidebar); color: var(--text-muted);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.compare-close:hover { color: var(--text); border-color: var(--text-muted); }
.compare-hint {
  padding: 12px 16px; background: rgba(99,102,241,0.08);
  border: 1px dashed var(--primary);
  border-radius: var(--radius-sm);
  color: var(--primary-light); font-size: 13px;
  margin-bottom: 16px; text-align: center;
}

/* --- Heatmap / Reading Calendar --- */
.heatmap-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 24px;
  min-width: 0;
}
.heatmap-title {
  font-size: 14px; font-weight: 600; color: var(--text);
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.heatmap-body {
  display: flex;
  flex-direction: row;
  gap: 6px;
}
.heatmap-scroll-wrap {
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 6px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.heatmap-scroll-wrap::-webkit-scrollbar {
  height: 6px;
}
.heatmap-scroll-wrap::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}
.heatmap-grid {
  display: flex;
  flex-direction: row;
  gap: 3px;
  flex-wrap: nowrap;
  align-items: flex-start;
}
.heatmap-column {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.heatmap-cell {
  width: 13px; height: 13px;
  border-radius: 2px;
  background: var(--border);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  cursor: pointer;
  position: relative;
}
.heatmap-cell.level-1 { background: rgba(99,102,241,0.30); }
.heatmap-cell.level-2 { background: rgba(99,102,241,0.50); }
.heatmap-cell.level-3 { background: rgba(99,102,241,0.70); }
.heatmap-cell.level-4 { background: rgba(99,102,241,0.90); }
.heatmap-cell.level-5 { background: rgba(129,140,248,1); }
.heatmap-cell:hover {
  transform: scale(1.6);
  z-index: 5;
  box-shadow: 0 2px 8px rgba(99,102,241,0.4);
  outline: 1px solid var(--primary-light);
}
.heatmap-months {
  display: flex;
  flex-direction: row;
  gap: 3px;
  margin-bottom: 6px;
}
.heatmap-month-label {
  font-size: 10px;
  color: var(--text-muted);
  height: 14px;
  line-height: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.heatmap-weekdays {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding-top: 20px;
}
.heatmap-weekday-label {
  font-size: 10px;
  color: var(--text-muted);
  width: 22px;
  height: 13px;
  line-height: 13px;
  text-align: right;
}
.heatmap-weekday-label.empty {
  visibility: hidden;
}
.heatmap-legend {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px; font-size: 11px; color: var(--text-dim);
}
.heatmap-empty {
  font-size: 13px; color: var(--text-dim);
  padding: 16px 0;
}
@media (max-width: 768px) {
  .heatmap-section { padding: 16px; }
  .heatmap-cell { width: 10px; height: 10px; }
  .heatmap-column { gap: 2px; }
  .heatmap-grid { gap: 2px; }
  .heatmap-weekday-label { width: 20px; height: 10px; line-height: 10px; font-size: 9px; }
}

/* --- Card Hover Tooltip --- */
.card-tooltip {
  position: fixed;
  z-index: 300;
  max-width: 340px;
  background: var(--bg-sidebar);
  border: 1px solid var(--primary);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  pointer-events: none;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.card-tooltip.visible {
  opacity: 1;
  transform: translateY(0);
}
.card-tooltip .tt-label {
  font-size: 11px; color: var(--primary-light);
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 6px; font-weight: 600;
}
.card-tooltip .tt-text {
  font-size: 13px; color: var(--text-muted);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-tooltip .tt-loading {
  font-size: 12px; color: var(--text-dim);
  font-style: italic;
}
.card-tooltip .tt-none {
  font-size: 12px; color: var(--text-dim);
}

/* --- Share Button --- */
.btn-share {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  background: rgba(168,85,247,0.12);
  color: var(--accent-purple);
  border: 1px solid transparent;
  cursor: pointer;
  font-size: 14px;
  transition: var(--transition);
}
.btn-share:hover { background: rgba(168,85,247,0.25); }
.btn-share.copied { background: rgba(34,197,94,0.15); color: var(--accent-green); }

/* --- Status Badge Clickable --- */
.status-badge-clickable {
  cursor: pointer;
  transition: var(--transition);
}
.status-badge-clickable:hover {
  transform: scale(1.08);
  filter: brightness(1.2);
}

/* --- Bottom Tab Navigation (Mobile) --- */
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 60px;
  background: var(--bg-sidebar);
  border-top: 1px solid var(--border);
  z-index: 90;
  padding: 0 8px;
}
.bottom-nav-inner {
  display: flex;
  height: 100%;
  align-items: center;
  justify-content: space-around;
}
.bottom-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  flex: 1;
  height: 100%;
  cursor: pointer;
  color: var(--text-dim);
  font-size: 10px;
  font-weight: 500;
  transition: var(--transition);
  border: none;
  background: none;
  padding: 4px;
  -webkit-tap-highlight-color: transparent;
}
.bottom-nav-item .bni-icon { font-size: 20px; }
.bottom-nav-item.active { color: var(--primary-light); }
.bottom-nav-item:active { background: rgba(99,102,241,0.1); }

/* --- Mobile Enhancements --- */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .bottom-nav { display: block; }
  body { padding-bottom: 60px; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .paper-grid { grid-template-columns: 1fr; }
  .main { padding: 12px; }
  .hero { padding: 20px 16px; }
  .hero-greeting { font-size: 20px; }
  .progress-section { flex-direction: column; align-items: flex-start; gap: 12px; }
  .fab { bottom: 80px; right: 16px; }
  .toolbar { gap: 8px; }
  .toolbar .search-box { min-width: 100%; order: -1; }
  .status-filter { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .status-btn { padding: 8px 12px; font-size: 12px; white-space: nowrap; }
  .btn-random, .btn-compare, .btn-export, .btn-mark-all { padding: 10px 14px; font-size: 12px; }
  .modal-overlay { padding: 0; align-items: stretch; }
  .modal { max-width: 100%; max-height: 100vh; border-radius: 0; padding: 20px; }
  .modal-close { top: 8px; right: 8px; }
  .modal h2 { font-size: 18px; }
  .compare-modal-overlay { padding: 0; }
  .compare-modal { max-width: 100%; max-height: 100vh; border-radius: 0; padding: 20px; }
  .compare-table { font-size: 11px; }
  .compare-table th, .compare-table td { padding: 8px 10px; }
  .compare-table th { width: 80px; }
  .paper-card { padding: 18px; }
  .paper-card-header h3 { font-size: 15px; }
  .card-tooltip { display: none !important; }
}

/* --- Selected for Compare --- */
.paper-card.selected-compare {
  border-color: var(--primary-light) !important;
  box-shadow: 0 0 0 3px var(--primary-glow), 0 0 24px var(--primary-glow);
}
.paper-card.selected-compare::after {
  content: '✓ 已选择';
  position: absolute;
  top: 8px; right: 12px;
  font-size: 11px; font-weight: 600;
  color: #fff;
  background: var(--primary);
  padding: 2px 10px;
  border-radius: 10px;
  z-index: 2;
}
.paper-card.compare-mode-card {
  cursor: pointer;
}
.paper-card.compare-disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ========== AI Feature Styles ========== */
/* Settings Button */
.settings-btn {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 1000;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
  box-shadow: var(--shadow);
}
.settings-btn:hover {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  transform: rotate(30deg);
}

/* Settings Modal */
.settings-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
  opacity: 0; visibility: hidden;
  transition: opacity 0.3s ease;
}
.settings-modal-overlay.open { opacity: 1; visibility: visible; }
.settings-modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 420px; max-width: 90vw;
  padding: 28px;
  transform: translateY(20px);
  transition: transform 0.3s ease;
}
.settings-modal-overlay.open .settings-modal { transform: translateY(0); }
.settings-modal h3 {
  font-size: 18px; margin-bottom: 20px;
  display: flex; align-items: center; gap: 8px;
}
.settings-field { margin-bottom: 16px; }
.settings-field label {
  display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px;
}
.settings-field input, .settings-field select {
  width: 100%; padding: 10px 14px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text); font-size: 14px;
}
.settings-field input:focus, .settings-field select:focus {
  outline: none; border-color: var(--primary);
}
.settings-actions {
  display: flex; gap: 10px; margin-top: 20px;
}
.settings-actions button {
  flex: 1; padding: 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text); cursor: pointer; font-size: 14px;
  transition: var(--transition);
}
.settings-actions button.primary {
  background: var(--primary); border-color: var(--primary); color: #fff;
}
.settings-actions button:hover { opacity: 0.9; }

/* Drawing Guide Panel */
.guide-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  margin-top: 20px;
  animation: fadeIn 0.4s ease;
}
.guide-header {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.guide-header h2 {
  font-size: 22px; color: var(--text);
  display: flex; align-items: center; gap: 10px;
}
.guide-subtitle {
  font-size: 13px; color: var(--text-muted);
  width: 100%;
}
.guide-close-btn {
  padding: 8px 16px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  border-radius: var(--radius-sm);
  cursor: pointer; font-size: 13px;
  transition: var(--transition);
}
.guide-close-btn:hover {
  background: var(--accent-red); color: #fff; border-color: var(--accent-red);
}
.guide-body {
  font-size: 14px; line-height: 1.8; color: var(--text);
}
.guide-body h3 {
  font-size: 17px; color: var(--primary-light);
  margin: 28px 0 14px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.guide-body h4 {
  font-size: 15px; color: var(--text);
  margin: 20px 0 10px;
}
.guide-body table {
  width: 100%; border-collapse: collapse;
  margin: 14px 0; font-size: 13px;
}
.guide-body th, .guide-body td {
  padding: 10px 12px; text-align: left;
  border: 1px solid var(--border);
}
.guide-body th {
  background: rgba(99,102,241,0.08); font-weight: 600;
}
.guide-body td code {
  font-family: 'Consolas', monospace;
  font-size: 12px; padding: 2px 6px;
  background: rgba(255,255,255,0.05); border-radius: 4px;
}
.color-swatch {
  display: inline-block; width: 14px; height: 14px;
  border-radius: 3px; margin-right: 6px; vertical-align: middle;
  border: 1px solid rgba(255,255,255,0.2);
}
.guide-body pre {
  background: rgba(0,0,0,0.25); padding: 14px 16px;
  border-radius: var(--radius-sm); overflow-x: auto;
  font-size: 12px; line-height: 1.6; margin: 12px 0;
  border: 1px solid var(--border);
}
.guide-body ul, .guide-body ol {
  padding-left: 22px; margin: 10px 0;
}
.guide-body li { margin: 4px 0; }
.guide-step, .kg-step {
  background: rgba(99,102,241,0.06);
  border-left: 3px solid var(--primary);
  padding: 14px 18px; margin: 14px 0;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}
.guide-step strong, .kg-step strong {
  color: var(--primary-light); font-size: 14px;
}
/* Knowledge Framework Images */
.guide-body .kg-img-wrap {
  text-align: center; margin: 20px 0;
}
.guide-body .kg-img {
  /* moved to global .kg-img with animation */
}
.guide-body .kg-caption {
  font-size: 12px; color: var(--text-muted); margin-top: 8px;
  font-style: italic;
}
.guide-body .kg-compare {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  margin: 16px 0;
}
.guide-body .kg-card {
  background: rgba(99,102,241,0.05);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
}
.guide-body .kg-card h4 {
  margin-top: 0; color: var(--primary-light);
  font-size: 14px; margin-bottom: 8px;
}
.guide-body .kg-card p {
  margin: 0; font-size: 13px; line-height: 1.7;
}
.guide-body .kg-flow {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap; margin: 14px 0;
  padding: 12px 16px;
  background: rgba(99,102,241,0.04);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}
.guide-body .kg-flow .kg-node {
  padding: 6px 14px; border-radius: 6px;
  font-size: 13px; font-weight: 600;
  white-space: nowrap;
}
.guide-body .kg-flow .kg-arrow {
  color: var(--text-muted); font-size: 18px;
}
.guide-body .kg-tag {
  display: inline-block; padding: 2px 10px;
  border-radius: 12px; font-size: 12px; font-weight: 600;
  margin: 2px 4px 2px 0;
}

/* ===== Knowledge Framework Animations ===== */
/* Neural Network Animation */
.kg-nn-demo {
  background: rgba(0,0,0,0.15); border-radius: var(--radius-sm);
  padding: 24px; margin: 16px 0; position: relative; overflow: hidden;
  border: 1px solid var(--border);
}
[data-theme="light"] .kg-nn-demo { background: #f1f5f9; }
.kg-nn-svg { width: 100%; max-width: 600px; margin: 0 auto; display: block; }
.kg-nn-node { fill: var(--primary); transition: all 0.3s; }
.kg-nn-node-input { fill: #10b981; }
.kg-nn-node-hidden { fill: var(--primary); }
.kg-nn-node-output { fill: #f59e0b; }
.kg-nn-pulse { animation: kgPulse 2s ease-in-out infinite; }
@keyframes kgPulse {
  0%,100% { opacity: 0.6; r: 12; }
  50% { opacity: 1; r: 16; }
}
.kg-nn-line { stroke: var(--text-muted); stroke-width: 1.5; opacity: 0.3; }
.kg-nn-flow {
  stroke-dasharray: 4 4;
  animation: kgFlow 1.5s linear infinite;
}
@keyframes kgFlow {
  0% { stroke-dashoffset: 8; }
  100% { stroke-dashoffset: 0; }
}
.kg-nn-flow-forward { stroke: var(--primary); stroke-width: 2; opacity: 0.8; }
.kg-nn-flow-backward { stroke: var(--accent-red); stroke-width: 2; opacity: 0.8; animation-direction: reverse; }

/* Gradient Descent Ball Animation */
.kg-gd-demo {
  background: rgba(0,0,0,0.15); border-radius: var(--radius-sm);
  padding: 20px; margin: 16px 0; border: 1px solid var(--border);
}
[data-theme="light"] .kg-gd-demo { background: #f1f5f9; }
.kg-gd-container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; }
.kg-gd-hill {
  width: 100%; height: 180px;
  background: linear-gradient(to bottom, transparent 0%, rgba(99,102,241,0.08) 100%);
  border-radius: 0 0 50% 50% / 0 0 100% 100%;
  position: relative; overflow: hidden;
}
.kg-gd-curve {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
}
.kg-gd-ball {
  width: 24px; height: 24px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #fbbf24, #f59e0b);
  box-shadow: 0 4px 12px rgba(245,158,11,0.4);
  position: absolute; top: 20px; left: 30px;
  animation: kgBallRoll 4s ease-in-out infinite;
}
@keyframes kgBallRoll {
  0% { left: 30px; top: 20px; }
  25% { left: 120px; top: 60px; }
  50% { left: 200px; top: 100px; }
  75% { left: 280px; top: 130px; }
  90% { left: 340px; top: 145px; transform: scale(0.9); }
  100% { left: 30px; top: 20px; transform: scale(1); }
}

/* Activation Function Animated Curves */
.kg-act-demo {
  background: rgba(0,0,0,0.15); border-radius: var(--radius-sm);
  padding: 20px; margin: 16px 0; border: 1px solid var(--border);
}
[data-theme="light"] .kg-act-demo { background: #f1f5f9; }
.kg-act-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px; margin: 12px 0;
}
.kg-act-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px; text-align: center;
  transition: transform 0.2s;
}
.kg-act-card:hover { transform: translateY(-2px); }
.kg-act-card svg { width: 100%; height: 80px; }
.kg-act-card h5 { margin: 6px 0 2px; font-size: 13px; color: var(--primary-light); }
.kg-act-card p { margin: 0; font-size: 12px; color: var(--text-muted); }
.kg-act-curve {
  fill: none; stroke-width: 2.5;
  stroke-dasharray: 300; stroke-dashoffset: 300;
  animation: kgDraw 2s ease-out forwards;
}
@keyframes kgDraw { to { stroke-dashoffset: 0; } }

/* Loss Function Animated Bar */
.kg-loss-demo {
  background: rgba(0,0,0,0.15); border-radius: var(--radius-sm);
  padding: 20px; margin: 16px 0; border: 1px solid var(--border);
}
[data-theme="light"] .kg-loss-demo { background: #f1f5f9; }
.kg-loss-bars {
  display: flex; align-items: flex-end; gap: 8px;
  height: 120px; padding: 0 20px; margin: 12px 0;
}
.kg-loss-bar {
  flex: 1; border-radius: 6px 6px 0 0;
  animation: kgBarGrow 1.5s ease-out forwards;
  transform-origin: bottom; transform: scaleY(0);
  position: relative; min-width: 40px;
}
@keyframes kgBarGrow { to { transform: scaleY(1); } }
.kg-loss-bar-label {
  position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
  font-size: 10px; color: var(--text-muted); white-space: nowrap;
}
.kg-loss-bar-value {
  position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
  font-size: 11px; font-weight: 600; color: var(--text);
}

/* Tab Switcher */
.kg-tabs {
  display: flex; gap: 4px; margin: 16px 0 0;
  flex-wrap: wrap;
}
.kg-tab {
  padding: 8px 16px; border-radius: 8px 8px 0 0;
  background: rgba(99,102,241,0.08); border: 1px solid var(--border);
  cursor: pointer; font-size: 13px; color: var(--text-muted);
  transition: all 0.2s; user-select: none;
}
.kg-tab:hover { background: rgba(99,102,241,0.15); }
.kg-tab.active {
  background: var(--primary); color: #fff; border-color: var(--primary);
}
.kg-tab-content { display: none; padding: 16px; border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius-sm) var(--radius-sm); }
.kg-tab-content.active { display: block; animation: fadeIn 0.3s ease; }

/* ===== Knowledge Framework: Reading Progress Bar ===== */
.kg-progress-bar {
  position: sticky; top: 0; z-index: 20;
  width: 100%; height: 3px; margin-bottom: 20px;
  background: var(--border); border-radius: 0;
}
.kg-progress-fill {
  height: 100%; width: 0%; border-radius: 0;
  background: linear-gradient(90deg, var(--primary), #a855f7);
  transition: width 0.15s ease-out;
}
.kg-progress-label {
  position: absolute; right: 8px; top: 10px;
  font-size: 12px; color: var(--text-muted);
  font-weight: 600;
}

/* ===== Knowledge Framework: TOC Sidebar ===== */
.kg-layout {
  display: flex; gap: 20px; margin-top: 0;
}
.kg-toc {
  width: 220px; min-width: 220px; position: sticky;
  top: 20px; height: fit-content; max-height: calc(100vh - 80px);
  overflow-y: auto; padding: 16px;
  background: rgba(99,102,241,0.04);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 13px; line-height: 1.5;
}
.kg-toc-title {
  font-size: 15px; font-weight: 700; color: var(--primary-light);
  margin-bottom: 10px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.kg-toc a {
  display: block; color: var(--text-muted);
  text-decoration: none; padding: 5px 10px;
  border-radius: 4px; margin: 3px 0;
  transition: all 0.2s; border-left: 2px solid transparent;
  font-size: 12.5px; line-height: 1.5;
  word-break: keep-all; overflow-wrap: break-word;
}
.kg-toc a:hover {
  color: var(--primary); background: rgba(99,102,241,0.08);
}
.kg-toc a.kg-toc-active {
  color: var(--primary-light); border-left-color: var(--primary);
  background: rgba(99,102,241,0.1); font-weight: 600;
}
.kg-main { flex: 1; min-width: 0; }

/* ===== Knowledge Framework: Module Guide Cards ===== */
.kg-module-guide {
  margin: 28px 0 20px 0;
  padding: 22px 26px;
  border-radius: 14px;
  border-left: 5px solid;
  background: var(--card-bg);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.kg-module-guide:hover {
  transform: translateX(5px);
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}
.kg-guide-signal { border-left-color: #7BA7CC; background: linear-gradient(135deg, rgba(123,167,204,0.10) 0%, var(--card-bg) 100%); }
.kg-guide-dl     { border-left-color: #8FB996; background: linear-gradient(135deg, rgba(143,185,150,0.10) 0%, var(--card-bg) 100%); }
.kg-guide-arch   { border-left-color: #D4A574; background: linear-gradient(135deg, rgba(212,165,116,0.10) 0%, var(--card-bg) 100%); }
.kg-guide-rq     { border-left-color: #A890C0; background: linear-gradient(135deg, rgba(168,144,192,0.10) 0%, var(--card-bg) 100%); }
.kg-guide-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 10px;
  letter-spacing: 0.3px;
}
.kg-guide-desc {
  font-size: 13.5px;
  color: var(--text-muted);
  line-height: 1.8;
}

/* Spark / Insight boxes within sections */
.kg-spark {
  margin: 16px 0;
  padding: 14px 18px;
  border-radius: 10px;
  border-left: 3px solid #D4A574;
  background: linear-gradient(135deg, rgba(212,165,116,0.10) 0%, rgba(232,196,160,0.06) 100%);
  font-size: 13px;
  color: var(--text);
  line-height: 1.8;
}

/* ===== Knowledge Framework: Accordion ===== */
.kg-accordion-header {
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; user-select: none; padding: 4px 0;
  margin: 24px 0 14px; border-bottom: 1px solid var(--border);
  transition: color 0.2s;
}
.kg-accordion-header:hover { color: var(--primary-light); }
.kg-accordion-header .kg-acc-icon {
  font-size: 14px; transition: transform 0.3s ease;
  flex-shrink: 0; margin-left: 8px; color: var(--text-muted);
}
.kg-accordion-header.collapsed .kg-acc-icon { transform: rotate(-90deg); }
.kg-accordion-body {
  overflow: hidden; transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
  max-height: 99999px; opacity: 1;
  padding: 4px 0 16px 0;
}
.kg-accordion-body.collapsed {
  max-height: 0; opacity: 0; margin: 0; padding: 0;
}

/* ===== Knowledge Framework: Concept Cards (新增概念卡片) ===== */
.kg-concept-card {
  overflow-wrap: break-word;
  word-wrap: break-word;
  word-break: break-word;
  overflow-x: auto;
}
.kg-concept-card h4 {
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.kg-concept-card p {
  overflow-wrap: break-word;
  word-wrap: break-word;
}

/* ===== SVG 排版修复 ===== */
.kg-section svg,
.kg-concept-card svg,
.guide-body svg {
  display: block;
  margin-left: auto;
  margin-right: auto;
  max-width: 100%;
  height: auto;
}
.kg-section svg[width],
.kg-concept-card svg[width],
.guide-body svg[width] {
  width: auto;
  max-width: 100%;
}

/* ===== 公式块溢出保护 ===== */
.guide-body div[style*="text-align:center"],
.guide-body div[style*="font-family:'Cambria'"] {
  overflow-x: auto;
  overflow-wrap: break-word;
  word-wrap: break-word;
  max-width: 100%;
}
.guide-body code,
.guide-body pre {
  overflow-wrap: break-word;
  word-wrap: break-word;
  white-space: pre-wrap;
}

/* ===== kg-compare 响应式 ===== */
@media (max-width: 700px) {
  .guide-body .kg-compare {
    grid-template-columns: 1fr;
  }
  .guide-body .kg-flow {
    flex-direction: column;
    align-items: stretch;
  }
  .guide-body .kg-flow .kg-arrow {
    text-align: center;
    transform: rotate(90deg);
  }
}

/* ===== 知识框架模板排版修复 ===== */
/* 确保内联宽度元素不溢出容器 */
.kg-main > div,
.kg-main .kg-section > div {
  max-width: 100%;
}

/* kg-flow 内联样式响应式 */
.kg-main .kg-flow[style*="display:flex"] {
  flex-wrap: wrap;
  justify-content: center;
}
.kg-main .kg-flow[style*="display:flex"] > div[style*="flex:"] {
  min-width: 80px;
  max-width: 150px;
}

/* 内联SVG容器响应式 */
.kg-main div[style*="margin:"] > svg,
.kg-main div[style*="text-align:center"] > svg {
  max-width: 100%;
  height: auto;
}

/* 概念卡片内部溢出保护 */
.kg-concept-card > div[style*="margin:"] {
  overflow-x: auto;
}

/* 表格响应式 */
.guide-body .kg-section table {
  display: block;
  overflow-x: auto;
  max-width: 100%;
}

/* ECharts 容器响应式 */
.kg-card [id^="echarts-"],
.kg-main [id^="echarts-"] {
  width: 100% !important;
  max-width: 700px !important;
}

/* kg-step 和 kg-card 间距统一 */
.guide-body .kg-step,

.kg-concept-chip.active {
  background: var(--primary); color: #fff;
  border-color: var(--primary);
}
.kg-concept-popup {
  position: absolute; top: calc(100% + 8px); left: 50%;
  transform: translateX(-50%); z-index: 50;
  width: 260px; padding: 12px 14px;

  border-radius: var(--radius-sm);
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);

  opacity: 1; pointer-events: auto;
}
.kg-concept-popup strong { color: var(--primary-light); }
.kg-concept-popup code {
  font-size: 11px; padding: 1px 5px;
  background: rgba(99,102,241,0.08); border-radius: 3px;

/* Method Analysis Tab */
.method-tabs {

}
.pairing-item.good { border-left-color: var(--accent-green); background: rgba(34,197,94,0.06); }
.pairing-item.warn { border-left-color: var(--accent-amber); background: rgba(245,158,11,0.06); }

.api-hint {
  background: rgba(99,102,241,0.08);

  margin-top: 12px;
}

}

/* Detail Tabs */
.detail-tabs {
  display: flex;
  gap: 4px;
  margin: 16px 0 12px;

}

// ============================================================
//  Theme Toggle (丝滑切换)
// ============================================================
(function() {
  const html = document.documentElement;
  const btn = document.getElementById('themeToggle');
  const STORAGE_KEY = 'lunwen-theme';

  // 恢复上次选择
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved === 'light') {
    html.setAttribute('data-theme', 'light');
  }

  btn.addEventListener('click', function() {
    const isLight = html.getAttribute('data-theme') === 'light';
    const next = isLight ? 'dark' : 'light';

    // 添加过渡class
    html.classList.add('theme-transitioning');

    // 切换
    if (next === 'light') {
      html.setAttribute('data-theme', 'light');
    } else {
      html.removeAttribute('data-theme');
    }
    localStorage.setItem(STORAGE_KEY, next);

    // 移除过渡class (过渡完成后)
    setTimeout(function() {
      html.classList.remove('theme-transitioning');
    }, 600);
  });
})();
</script>

<script>
// ============================================================
//  Markdown Parser
// ============================================================
function parseLibrary(md) {
  const categories = [
    { id: 'attention', emoji: '🔥', name: '注意力机制', desc: 'Attention Mechanisms' },
    { id: 'channel', emoji: '🌊', name: '通道增强/特征增强', desc: 'Channel/Feature Enhancement' },
    { id: 'deraining', emoji: '🌧️', name: '去雨', desc: 'Image Deraining' },
    { id: 'dehazing', emoji: '🌫️', name: '去雾', desc: 'Image Dehazing' },
    { id: 'irstd', emoji: '🎯', name: '红外小目标检测', desc: 'Infrared Small Target Detection' },
    { id: 'backbone', emoji: '🏗️', name: '骨干网络', desc: 'Backbones' },
    { id: 'detection', emoji: '🎯', name: '目标检测', desc: 'Object Detection' },
    { id: 'segmentation', emoji: '🖼️', name: '语义分割', desc: 'Semantic Segmentation' },
    { id: 'generative', emoji: '📝', name: '生成模型', desc: 'Generative Models' },
    { id: 'multimodal', emoji: '🔗', name: '多模态', desc: 'Multi-modal' },
    { id: 'compression', emoji: '⚡', name: '模型压缩/加速', desc: 'Model Compression' },
    { id: 'optimizer', emoji: '📊', name: '优化器/训练技巧', desc: 'Optimizers & Training' },
    { id: 'multitask_restore', emoji: '🧩', name: '多任务恢复', desc: 'Multi-task Restoration' },
    { id: 'lut_compression', emoji: '⚡', name: '模型压缩/加速', desc: 'LUT Compression' },
    { id: 'scientific_imaging', emoji: '🔬', name: '科学成像', desc: 'Scientific Imaging' },
    { id: 'other', emoji: '🔄', name: '其他', desc: 'Others' },
  ];

  const papers = [];
  let currentCategory = null;

  const lines = md.split('\n');
  let i = 0;

  while (i < lines.length) {
    const line = lines[i].trim();

    // Detect category section (## 🔥 注意力机制  or  ## 🌊 通道增强/特征增强)
    const catMatch = line.match(/^##\s+([^\s]+)\s+(.+)/);
    if (catMatch && !line.includes('论文统计') && !line.includes('待读清单')) {
      const emoji = catMatch[1];
      // Check for "暂无" - skip empty categories
      const nextLine = i + 1 < lines.length ? lines[i + 1].trim() : '';
      if (nextLine.startsWith('> 暂无论文')) {
        i += 2;
        continue;
      }
      currentCategory = categories.find(c => c.emoji === emoji) || categories.find(c => c.name.startsWith(catMatch[2].trim()));
      i++;
      continue;
    }

    // Detect paper title (### Title)
    const paperMatch = line.match(/^###\s+(.+)/);
    if (paperMatch) {
      const title = paperMatch[1].trim();
      const paper = { title, category: currentCategory ? currentCategory.name : '其他', categoryEmoji: currentCategory ? currentCategory.emoji : '🔄', tags: [], status: '待读', summary: '', painPoints: '', method: '', scenarios: '', arxiv: '', code: '', notes: '', archImage: '', date: '' };
      i++;

      // Parse bullet points until next section or EOF
      while (i < lines.length) {
        const bline = lines[i].trim();
        if (bline.startsWith('## ') || bline.startsWith('### ') || bline.startsWith('---')) break;

        const bm = bline.match(/^-\s+\*\*(.+?)\*\*:\s*(.+)/);
        if (bm) {
          const key = bm[1].trim();
          const val = bm[2].trim();
          switch (key) {
            case '分类': paper.category = val.replace(/[^\u4e00-\u9fa5a-zA-Z//\s]/g, '').trim(); break;
            case '标签': paper.tags = val.split(',').map(t => t.trim()).filter(Boolean); break;
            case '状态': paper.status = val.trim(); break;
            case '一句话总结': paper.summary = val; break;
            case '核心痛点': paper.painPoints = val; break;
            case '核心方法': paper.method = val; break;
            case '适用场景': paper.scenarios = val; break;
            case 'arXiv/DOI':
              const alink = val.match(/\[(.+?)\]\((.+?)\)/);
              if (alink) { paper.arxivUrl = alink[2]; paper.arxiv = alink[1]; } else paper.arxiv = val;
              break;
            case '代码链接':
              const clink = val.match(/\[(.+?)\]\((.+?)\)/);
              if (clink) { paper.codeUrl = clink[2]; paper.code = clink[1]; } else paper.code = val;
              break;
            case '笔记链接':
              const nlink = val.match(/\[(.+?)\]\((.+?)\)/);
              if (nlink) { paper.notesUrl = nlink[2]; paper.notes = nlink[1]; }
              else paper.notes = val.replace(/（|）/g, '').trim();
              break;
            case '架构图': paper.archImage = val.trim(); break;
            case '添加时间': paper.date = val.trim(); break;
          }
        }
        i++;
      }

      // Map category back to standardized name
      for (const c of categories) {
        if (paper.category.includes(c.name.split('/')[0])) {
          paper.category = c.name;
          paper.categoryEmoji = c.emoji;
          break;
        }
      }

      papers.push(paper);
      continue;
    }

    i++;
  }

  return papers;
}

// Venue detection from tags
function detectVenue(paper) {
  const tagStr = paper.tags.join(' ').toLowerCase();
  if (tagStr.includes('cvpr2023') || tagStr.includes('cvpr 2023')) return { label: 'CVPR 2023', cls: 'cvpr', emoji: '🎯' };
  if (tagStr.includes('cvpr2022') || tagStr.includes('cvpr 2022')) return { label: 'CVPR 2022', cls: 'cvpr', emoji: '🎯' };
  if (tagStr.includes('cvpr2021') || tagStr.includes('cvpr 2021')) return { label: 'CVPR 2021', cls: 'cvpr', emoji: '🎯' };
  if (tagStr.includes('cvprw')) return { label: 'CVPRW 2021', cls: 'cvprw', emoji: '🏅' };
  if (tagStr.includes('iccv')) return { label: 'ICCV', cls: 'iccv', emoji: '🎯' };
  if (tagStr.includes('eccv')) return { label: 'ECCV', cls: 'eccv', emoji: '🎯' };
  if (tagStr.includes('neurips')) return { label: 'NeurIPS', cls: 'neurips', emoji: '🧠' };
  if (tagStr.includes('iclr')) return { label: 'ICLR', cls: 'iclr', emoji: '📐' };
  if (tagStr.includes('icml')) return { label: 'ICML', cls: 'icml', emoji: '📊' };
  if (tagStr.includes('aaai')) return { label: 'AAAI', cls: 'aaai', emoji: '🤖' };
  return null;
}

// Estimate reading time based on paper complexity and status tags
function estimateReadingTime(paper) {
  const tagStr = paper.tags.join(' ').toLowerCase();
  if (tagStr.includes('transformer') || tagStr.includes('unfolding') || tagStr.includes('multi-stage')) return '约 60 分钟';
  if (tagStr.includes('attention') || tagStr.includes('normalization')) return '约 45 分钟';
  return '约 30 分钟';
}

function getCategoryStats() {
  const map = {};
  categories.forEach(c => { map[c.name] = { total: 0, 待读: 0, 精读中: 0, 已读: 0, 已复现: 0 }; });
  allPapers.forEach(p => {
    if (map[p.category]) {
      map[p.category].total++;
      map[p.category][p.status] = (map[p.category][p.status] || 0) + 1;
    }
  });
  return map;
}

function renderSidebar() {
  const stats = getCategoryStats();
  const totalAll = allPapers.length;
  let html = `<div class="cat-item all-cats${activeCategory === 'all' ? ' active' : ''}" data-cat="all">
    <span>📁</span> 全部论文 <span class="count">${totalAll}</span>
  </div>`;

  categories.forEach(c => {
    const s = stats[c.name];
    if (s.total === 0) return;
    html += `<div class="cat-item${activeCategory === c.name ? ' active' : ''}" data-cat="${c.name}">
      <span>${c.emoji}</span> ${c.name} <span class="count">${s.total}</span>
    </div>`;
  });

  EL.sidebarNav.innerHTML = html;

  // Click handlers
  EL.sidebarNav.querySelectorAll('.cat-item').forEach(el => {
    el.addEventListener('click', () => {
      activeCategory = el.dataset.cat;
      renderSidebar();
      renderPapers();
    });
  });
}

function renderStats() {
  const stats = getCategoryStats();
  let total = 0, toRead = 0, reading = 0, readed = 0, reproduced = 0;
  Object.values(stats).forEach(s => {
    total += s.total;
    toRead += s.待读;
    reading += s.精读中;
    readed += s.已读;
    reproduced += s.已复现;
  });

  const completed = readed + reproduced;
  const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

  EL.statsBar.innerHTML = `
    <div class="stat-card">
      <div class="stat-num">${total}</div>
      <div class="stat-label">📚 论文总数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">${toRead}</div>
      <div class="stat-label">⏳ 待读</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">${reading}</div>
      <div class="stat-label">📖 精读中</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">${readed}</div>
      <div class="stat-label">✅ 已读</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">${reproduced}</div>
      <div class="stat-label">🔬 已复现</div>
    </div>
  `;

  // Update hero subtitle
  const pending = toRead + reading;
  if (total === 0) {
    EL.heroSubtitle.innerHTML = '这里还很空，<span class="highlight">去搜索第一篇论文</span>来开启你的阅读之旅吧';
  } else if (pending === 0) {
    EL.heroSubtitle.innerHTML = '太厉害了！<span class="highlight">' + total + '</span> 篇论文全部啃完，休息一下？';
  } else {
    EL.heroSubtitle.innerHTML = '你的论文库已有 <span class="highlight">' + total + '</span> 篇论文，其中 <span class="highlight">' + pending + '</span> 篇等待探索';
  }

  // Update progress bar
  EL.progressPercent.textContent = pct + '%';
  EL.progressBarFill.style.width = pct + '%';
  if (total === 0) {
    EL.progressDetail.innerHTML = '暂无论文<br>快去添加吧';
  } else if (pct === 100) {
    EL.progressDetail.innerHTML = '🎉 全部完成！<br>' + total + ' 篇全部拿下';
  } else if (pct > 0) {
    EL.progressDetail.innerHTML = '已掌握 ' + completed + ' 篇<br>剩余 ' + (total - completed) + ' 篇';
  } else {
    EL.progressDetail.innerHTML = '还没开始<br>挑一篇试试手';
  }
}

function renderPapers() {
  let filtered = allPapers;

  if (activeCategory !== 'all') {
    filtered = filtered.filter(p => p.category === activeCategory);
  }

  if (activeStatus !== 'all') {
    filtered = filtered.filter(p => p.status === activeStatus);
  }

  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase().trim();
    filtered = filtered.filter(p => {
      // 1. 基础子串匹配（含空值安全）
      if (p.title && p.title.toLowerCase().includes(q)) return true;
      if (p.summary && p.summary.toLowerCase().includes(q)) return true;
      if (p.method && p.method.toLowerCase().includes(q)) return true;
      if (p.painPoints && p.painPoints.toLowerCase().includes(q)) return true;
      if (p.tags && p.tags.some(t => t.toLowerCase().includes(q))) return true;

      // 1b. 分类名称匹配 (如 "注意力" "去雨" "通道增强")
      if (p.category && p.category.toLowerCase().includes(q)) return true;

      // 1c. AI提取方法数据匹配 (core_methods + method_types)
      if (p.methods) {
        if (p.methods.core_methods && p.methods.core_methods.some(m => m.toLowerCase().includes(q))) return true;
        const types = p.methods.method_types || {};
        const typeVals = Object.values(types);
        if (typeVals.some(v => v.toLowerCase().includes(q))) return true;
      }

      // 1d. 适用场景匹配
      if (p.scenarios && p.scenarios.toLowerCase().includes(q)) return true;

      // 2. 论文名称首字母/缩写匹配
      const title = p.title || '';

      // 2a. 冒号前的论文名前缀匹配 (如 "MPR" → "MPRNet: ...")
      const colonIdx = title.indexOf(':');
      if (colonIdx > 0) {
        const paperName = title.substring(0, colonIdx).trim().toLowerCase();
        if (paperName.startsWith(q) || paperName.includes(q)) return true;
      }

      // 2b. 括号内缩写匹配 (如 "MPRNet" from "...(MPRNet)")
      const parenMatch = title.match(/\(([^)]+)\)/);
      if (parenMatch) {
        const abbr = parenMatch[1].toLowerCase().trim();
        if (abbr.startsWith(q) || abbr.includes(q)) return true;
      }

      // 2c. 标题中连续大写字母序列匹配 (如 "MPR" from "MPRNet", "DAWN" from "DAWN+")
      const upperSeqs = title.match(/[A-Z][A-Za-z0-9+]*/g);
      if (upperSeqs) {
        for (const seq of upperSeqs) {
          const seqLower = seq.toLowerCase();
          if (seqLower.startsWith(q) || seqLower.includes(q)) return true;
        }
      }

      // 2d. 首字母缩写匹配 (如 "mpir" → Multi-Stage Progressive Image Restoration)
      const words = title.split(/[\s\-:,()\/]+/).filter(w => w.length > 0);
      const acronym = words.map(w => w[0]).join('').toLowerCase();
      if (acronym.length >= 2 && (acronym.startsWith(q) || acronym.includes(q))) return true;

      // 3. 中文关键词模糊匹配 —— 支持按方法中文名搜索
      const cnFields = [p.method, p.summary, p.painPoints].filter(Boolean).join(' ');
      if (cnFields.length > 0) {
        // 3a. 中文搜索：直接子串（已覆盖）
        // 3b. 拼音首字母简化匹配 (常见学术缩写→中文名映射)
        const aliasMap = {
          'attention': '注意力', 'se': 'SE通道注意力', 'cbam': 'CBAM通道空间注意力',
          'transformer': 'Transformer自注意力', 'wavelet': '小波', 'sparse': '稀疏',
          'channel': '通道', 'spatial': '空间', 'normalize': '归一化',
          'derain': '去雨', 'dehaze': '去雾', 'denoise': '去噪', 'deblur': '去模糊',
          'restoration': '恢复', 'enhance': '增强', 'super': '超分',
        };
        for (const [enKey, cnVal] of Object.entries(aliasMap)) {
          if (cnVal.includes(q) || enKey.includes(q)) {
            // 找到别名映射，检查该论文是否与此领域相关
            if (p.method && p.method.includes(cnVal)) return true;
            if (p.tags && p.tags.some(t => t.includes(enKey) || t.includes(cnVal))) return true;
            if (p.category && (p.category.includes(cnVal) || p.category.toLowerCase().includes(enKey))) return true;
            if (p.methods && p.methods.core_methods && p.methods.core_methods.some(m => m.toLowerCase().includes(enKey))) return true;
          }
        }
      }

      return false;
    });
  }

  EL.resultInfo.textContent = `共 ${filtered.length} 篇`;

  if (filtered.length === 0) {
    if (allPapers.length === 0) {
      EL.paperGrid.innerHTML = `
        <div class="empty-state">
          <div class="icon">📖</div>
          <h3>还没有论文？</h3>
          <p>快去搜索第一篇吧～</p>
          <p style="font-size:12px;color:var(--text-dim);margin-top:8px;">编辑 papers-library.md 来添加你感兴趣的论文</p>
        </div>`;
    } else {
      EL.paperGrid.innerHTML = `
        <div class="empty-state">
          <div class="icon">🔍</div>
          <h3>暂无匹配的论文</h3>
          <p>尝试更换分类、状态或搜索关键词</p>
          <p style="font-size:12px;color:var(--text-dim);margin-top:8px;">或者试试 🎲 随机推荐，看看有什么惊喜</p>
        </div>`;
    }
    return;
  }

  const methodStore = loadMethodStore();
  EL.paperGrid.innerHTML = filtered.map((p, idx) => {
    const venue = detectVenue(p);
    const readingTime = estimateReadingTime(p);
    const globalIdx = allPapers.indexOf(p);
    const venueHtml = venue ? `<span class="venue-badge ${venue.cls}">${venue.emoji} ${venue.label}</span>` : '';
    const mData = methodStore[p.title];
    const methodTagsHtml = (mData && mData.core_methods && mData.core_methods.length)
      ? `<div class="method-tags" style="margin-top:6px;">${mData.core_methods.slice(0,3).map(m => {
          const type = (mData.method_types || {})[m] || '';
          let cls = '';
          if (type.includes('通道')) cls = 'type-channel';
          else if (type.includes('空间')) cls = 'type-spatial';
          else if (type.includes('注意力')) cls = 'type-attention';
          else if (type.includes('频域')) cls = 'type-frequency';
          return `<span class="method-tag ${cls}">${m}</span>`;
        }).join('')}</div>`
      : '';

    return `
    <div class="paper-card status-${p.status} fade-in" data-idx="${globalIdx}" onclick="openDetail(${globalIdx})">
      ${p.archImage ? `<div class="paper-card-arch"><img src="${p.archImage}" alt="${escapeHtml(p.title)} 架构图" loading="lazy" onerror="this.parentElement.style.display='none'"></div>` : ''}
      <div class="paper-card-header">
        <h3>${escapeHtml(p.title)}</h3>
        <span class="status-badge status-${p.status}" onclick="event.stopPropagation()">${p.status}</span>
      </div>
      <p class="summary">${escapeHtml(p.summary)}</p>
      <div class="tags">
        ${p.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
        <span class="tag" style="background:rgba(168,85,247,0.12);color:#a855f7;">${p.categoryEmoji} ${p.category}</span>
      </div>
      ${methodTagsHtml}
      <div class="meta">
        ${venueHtml}
        <span class="reading-time">⏱ ${readingTime}</span>
        ${p.arxivUrl ? `<a href="${p.arxivUrl}" target="_blank" onclick="event.stopPropagation()">📄 arXiv</a>` : ''}
        ${p.codeUrl ? `<a href="${p.codeUrl}" target="_blank" onclick="event.stopPropagation()">💻 代码</a>` : ''}
      </div>
      <div class="card-actions" onclick="event.stopPropagation()">
        ${p.status === '待读' ? `<button class="card-btn card-btn-read" onclick="setStatus(${globalIdx},'已读')">✅ 标为已读</button>` : ''}
        ${p.status === '已读' ? `<button class="card-btn card-btn-reading" onclick="setStatus(${globalIdx},'精读中')">📖 精读中</button><button class="card-btn card-btn-done" onclick="setStatus(${globalIdx},'已复现')">🔬 已复现</button><button class="card-btn card-btn-reset" onclick="setStatus(${globalIdx},'待读')">↩ 待读</button>` : ''}
