<!-- ===== 2.4 小波变换 vs 傅里叶变换 ===== -->
<div style="margin:24px 0; padding:20px; background:var(--bg-card,rgba(30,41,59,0.4)); border-radius:12px; border:1px solid rgba(56,189,248,0.25);">
  <h4 style="color:var(--text,#e2e8f0); font-family:'Microsoft YaHei',sans-serif; font-size:15px; margin:0 0 8px 0; display:flex; align-items:center; gap:8px;">
    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#38bdf8;flex-shrink:0;"></span>
    小波变换 vs 傅里叶变换：图像处理视角
  </h4>
  <p style="font-family:'Microsoft YaHei',sans-serif; font-size:12px; color:var(--text-muted,#94a3b8); line-height:1.8; margin:0 0 14px 0;">
    傅里叶变换将信号分解为<strong style="color:var(--text,#e2e8f0);">全局正弦波</strong>，只能告诉你"信号中包含哪些频率"，但无法告诉你"这些频率出现在什么位置"。小波变换则同时提供<strong style="color:var(--text,#e2e8f0);">时间（空间）和频率</strong>的局部化信息——低频处时间分辨率粗但频率分辨率精，高频处时间分辨率精但频率分辨率粗，这种自适应特性被称为<strong style="color:#38bdf8;">多分辨率分析 (MRA)</strong>。
  </p>

  <div style="display:flex; justify-content:center; margin-top:10px;">
    <svg width="480" height="300" viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" style="max-width:100%; height:auto;">
      <!-- ===== 分隔线 ===== -->
      <line x1="240" y1="15" x2="240" y2="285" stroke="var(--text-muted,#94a3b8)" stroke-width="1" stroke-dasharray="5,5" opacity="0.3"/>

      <!-- ===== 左面板：傅里叶变换 ===== -->
      <text x="120" y="22" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="bold" fill="var(--text,#e2e8f0)">傅里叶变换 (FFT)</text>
      <text x="120" y="38" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10" fill="#fb7185">仅有频率信息，无时间定位</text>

      <!-- Y轴 (频率) -->
      <line x1="55" y1="55" x2="55" y2="255" stroke="var(--text-muted,#94a3b8)" stroke-width="1.5"/>
      <!-- 无X轴 (强调无时间信息) -->
      <line x1="55" y1="255" x2="215" y2="255" stroke="var(--text-muted,#94a3b8)" stroke-width="1" stroke-dasharray="3,4" opacity="0.4"/>
      <text x="135" y="270" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="9" fill="var(--text-muted,#94a3b8)" opacity="0.5">(无时间轴)</text>

      <!-- Y轴标签 -->
      <text x="48" y="62" text-anchor="end" font-family="'Microsoft YaHei',sans-serif" font-size="9" fill="var(--text-muted,#94a3b8)">高频</text>
      <text x="48" y="258" text-anchor="end" font-family="'Microsoft YaHei',sans-serif" font-size="9" fill="var(--text-muted,#94a3b8)">低频</text>
      <text x="28" y="158" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10" fill="var(--text-muted,#94a3b8)" transform="rotate(-90,28,158)">频率</text>

      <!-- 5个均匀频率条 (相同尺寸 = 均匀分辨率) -->
      <rect x="60" y="60" width="155" height="35" rx="3" fill="rgba(99,102,241,0.18)" stroke="#6366f1" stroke-width="1"/>
      <rect x="60" y="98" width="155" height="35" rx="3" fill="rgba(99,102,241,0.18)" stroke="#6366f1" stroke-width="1"/>
      <rect x="60" y="136" width="155" height="35" rx="3" fill="rgba(99,102,241,0.18)" stroke="#6366f1" stroke-width="1"/>
      <rect x="60" y="174" width="155" height="35" rx="3" fill="rgba(99,102,241,0.18)" stroke="#6366f1" stroke-width="1"/>
      <rect x="60" y="212" width="155" height="35" rx="3" fill="rgba(99,102,241,0.18)" stroke="#6366f1" stroke-width="1"/>

      <!-- 标注: 均匀分辨率 -->
      <text x="137" y="82" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="9" fill="var(--text-muted,#94a3b8)">f₁</text>
      <text x="137" y="120" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="9" fill="var(--text-muted,#94a3b8)">f₂</text>
      <text x="137" y="158" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="9" fill="var(--text-muted,#94a3b8)">f₃</text>
      <text x="137" y="196" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="9" fill="var(--text-muted,#94a3b8)">f₄</text>
      <text x="137" y="234" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="9" fill="var(--text-muted,#94a3b8)">f₅</text>

      <!-- 底部注释 -->
      <text x="135" y="285" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10" fill="var(--text-muted,#94a3b8)">分辨率均匀</text>
      <text x="135" y="297" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10" fill="#fb7185">丢失全部时间信息</text>

      <!-- ===== 右面板：小波变换 ===== -->
      <text x="360" y="22" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" font-weight="bold" fill="var(--text,#e2e8f0)">小波变换 (DWT)</text>
      <text x="360" y="38" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10" fill="#10b981">时间-频率自适应分辨率</text>

      <!-- Y轴 (频率) -->
      <line x1="285" y1="55" x2="285" y2="255" stroke="var(--text-muted,#94a3b8)" stroke-width="1.5"/>
      <!-- X轴 (时间) -->
      <line x1="285" y1="255" x2="445" y2="255" stroke="var(--text-muted,#94a3b8)" stroke-width="1.5"/>

      <!-- Y轴标签 -->
      <text x="278" y="62" text-anchor="end" font-family="'Microsoft YaHei',sans-serif" font-size="9" fill="var(--text-muted,#94a3b8)">高频</text>
      <text x="278" y="258" text-anchor="end" font-family="'Microsoft YaHei',sans-serif" font-size="9" fill="var(--text-muted,#94a3b8)">低频</text>
      <text x="258" y="158" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10" fill="var(--text-muted,#94a3b8)" transform="rotate(-90,258,158)">频率</text>
      <!-- X轴标签 -->
      <text x="365" y="270" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10" fill="var(--text-muted,#94a3b8)">时间 →</text>

      <!-- 二进离散网格 (Dyadic Tiling) -->
      <!-- Level 0: 最低频 — 1格, 宽(时间粗), 矮(频率精) -->
      <rect x="286" y="230" width="158" height="24" fill="rgba(99,102,241,0.22)" stroke="#6366f1" stroke-width="1"/>
      <!-- Level 1: 2格 -->
      <rect x="286" y="190" width="79" height="39" fill="rgba(14,165,233,0.22)" stroke="#0ea5e9" stroke-width="1"/>
      <rect x="365" y="190" width="79" height="39" fill="rgba(14,165,233,0.22)" stroke="#0ea5e9" stroke-width="1"/>
      <!-- Level 2: 4格 -->

<div class="kg-section" id="kg-s6">
<div class="kg-accordion-header" onclick="kgToggleAcc(this)"><h3>六、Contourlet & Shearlet——"看得见方向的"高级变换</h3><span class="kg-acc-icon">▼</span></div>
<div class="kg-accordion-body">

<p>小波虽然比FFT强，但有个局限：<b>小波主要只擅长捕捉水平和垂直方向</b>。自然界中大量纹理是斜的、弯曲的（比如斜向雨纹、河流的曲线、道路的弧线），小波对它们的捕捉能力有限。</p>

<p>于是就有了<b>方向性多尺度变换</b>——Contourlet和Shearlet。</p>

<div class="kg-img-wrap">
  <picture class="kg-picture"><source srcset="reading-notes/assets/knowledge-contourlet-shearlet.webp" type="image/webp"><img src="reading-notes/assets/knowledge-contourlet-shearlet-thumb.webp" data-full="reading-notes/assets/knowledge-contourlet-shearlet.webp" alt="Contourlet与Shearlet对比" class="kg-img kg-img-lazy" loading="lazy" decoding="async"></picture>
  <div class="kg-caption">图：Contourlet变换（左）通过方向滤波器组捕获楔形方向子带；Shearlet变换（右）通过剪切操作实现更灵活的方向分析</div>
</div>

<div class="kg-compare">
  <div class="kg-card">
    <h4>📐 Contourlet 变换</h4>
    <p><b>两步走</b>：先用<b>拉普拉斯金字塔(LP)</b>做多尺度分解（把图像分成不同分辨率），再用<b>方向滤波器组(DFB)</b>在每个尺度上做方向分解。</p>
    <p style="margin-top:8px;"><b>优势</b>：能捕获<b>任意方向</b>的纹理，不像小波只有水平/垂直/对角三个方向。</p>
    <p style="margin-top:8px;"><b>劣势</b>：没有平移不变性（图像稍微平移，结果会变），基函数不规则。</p>
  </div>
  <div class="kg-card">
    <h4>📐 Shearlet 变换</h4>
    <p><b>数学上更优雅</b>：通过<b>剪切矩阵</b>（Shearing Matrix）对母函数做旋转和缩放，生成不同方向和尺度的基函数。</p>
    <p style="margin-top:8px;"><b>优势</b>：理论最优稀疏性，有<b>平移不变性</b>，数学基础更完善（满足抛物线缩放定律）。</p>
    <p style="margin-top:8px;"><b>劣势</b>：计算复杂度较高，实现相对复杂。</p>
  </div>
</div>

<p><b>一句话总结</b>：Contourlet像用<b>棱镜分光</b>的方式分解方向，Shearlet像用<b>数学剪刀剪纸</b>的方式切割方向。Shearlet是Contourlet的"理论升级版"。</p>
<div class="snippet-marker">
  <strong>插入位置</strong>：第6章 <code>&lt;p&gt;&lt;b&gt;一句话总结&lt;/b&gt;：Contourlet像用棱镜分光…&lt;/p&gt;</code> 之后，<code>&lt;div class="kg-card" style="margin-top:12px;"&gt;</code>（Canvas 演示）之前。
</div>


<div class="kg-card" style="margin-top:14px;">
<h4 style="margin-top:0;">全名与定义</h4>
<p><b>Contourlet Transform（轮廓波变换）</b>：由 Do 和 Vetterli 于 2002 年提出，是一种多尺度、多方向的图像分解方法，通过拉普拉斯金字塔（LP）捕获点奇异性、方向滤波器组（DFB）将点奇异性连接为线/曲线奇异性，从而实现对任意方向轮廓的高效稀疏表示。</p>
<p style="margin-top:8px;"><b>Shearlet Transform（剪切波变换）</b>：由 Easley、Labate 和 Lim 于 2008 年提出，通过剪切矩阵（Shearing Matrix）和各向异性缩放矩阵生成连续/离散基函数，在数学上证明了其对分段光滑函数的<b>最优稀疏逼近</b>（Optimal Sparse Approximation），是 Contourlet 的理论升级版。</p>
</div>

<h4>数学公式推导</h4>

<div class="formula-box">
  <div style="font-size:13px;color:var(--text-muted);margin-bottom:8px;"><b>Contourlet 变换 = LP 多尺度分解 + DFB 方向分解</b></div>

  <div class="formula-label">① 拉普拉斯金字塔（LP）分解——多尺度</div>
  <div class="formula">f &rarr; c<sub>J</sub> + &Sigma;<sub>j=1</sub><sup>J</sup> d<sub>j</sub></div>
  <div class="formula-label" style="text-align:center;">其中 c<sub>J</sub> 为低频近似分量，d<sub>j</sub> 为第 j 层带通高频分量</div>

  <div class="formula" style="margin-top:10px;">d<sub>j</sub> = f<sub>j</sub> &minus; (f<sub>j</sub>)&uarr; &nbsp;&nbsp;（带通 = 当前尺度 &minus; 上采样平滑）</div>

  <div class="formula-label" style="margin-top:12px;">② 方向滤波器组（DFB）分解——多方向</div>
  <div class="formula">d<sub>j</sub> &rarr; { d<sub>j,0</sub>, d<sub>j,1</sub>, &hellip;, d<sub>j,2<sup>l</sup><sub>j</sub>&minus;1</sub> }</div>
  <div class="formula-label" style="text-align:center;">将第 j 层高频分解为 2<sup>l<sub>j</sub></sup> 个方向子带（l<sub>j</sub> 为方向分解级数）</div>

  <div class="formula" style="margin-top:10px;font-weight:bold;">完整 Contourlet：C(f) = { c<sub>J</sub>, d<sub>j,l</sub> }<sub>j=1..J, l=0..2<sup>l<sub>j</sub></sub>&minus;1</sub></div>
</div>

<div class="formula-box">
  <div style="font-size:13px;color:var(--text-muted);margin-bottom:8px;"><b>Shearlet 变换 = 剪切矩阵 + 各向异性缩放 + 母函数平移</b></div>

  <div class="formula-label">① 各向异性缩放矩阵 A<sub>j</sub>（抛物线缩放）</div>
  <div class="formula" style="font-family:'Cambria Math','Times New Roman',serif;">
    A<sub>j</sub> = <span style="font-size:28px;vertical-align:middle;">[</span> 2<sup>2j</sup> &nbsp;&nbsp;&nbsp; 0 &nbsp;&nbsp; <span style="font-size:28px;vertical-align:middle;">]</span>
  </div>
  <div class="formula" style="font-family:'Cambria Math','Times New Roman',serif;margin-top:2px;">
    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span style="font-size:28px;vertical-align:middle;">[</span> 0 &nbsp;&nbsp;&nbsp; 2<sup>j</sup> &nbsp;&nbsp; <span style="font-size:28px;vertical-align:middle;">]</span>
  </div>

  <div class="formula-label" style="margin-top:8px;">② 剪切矩阵 S<sub>l</sub>（方向旋转）</div>
  <div class="formula" style="font-family:'Cambria Math','Times New Roman',serif;">
    S<sub>l</sub> = <span style="font-size:28px;vertical-align:middle;">[</span> 1 &nbsp;&nbsp;&nbsp; l &nbsp;&nbsp; <span style="font-size:28px;vertical-align:middle;">]</span>
  </div>
  <div class="formula" style="font-family:'Cambria Math','Times New Roman',serif;margin-top:2px;">
    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span style="font-size:28px;vertical-align:middle;">[</span> 0 &nbsp;&nbsp;&nbsp; 1 &nbsp;&nbsp; <span style="font-size:28px;vertical-align:middle;">]</span>
  </div>
  <div class="formula-label" style="text-align:center;">l 为剪切参数，取值范围 l &isin; [&minus;2<sup>j</sup>, 2<sup>j</sup>]</div>

  <div class="formula-label" style="margin-top:12px;">③ Shearlet 基函数（母函数缩放+剪切+平移）</div>
  <div class="formula" style="font-size:16px;font-weight:bold;">
    &psi;<sub>j,l,k</sub>(x) = |det(A<sub>j</sub>)|<sup>j/2</sup> &middot; &psi;(S<sub>l</sub> A<sub>j</sub> x &minus; k)
  </div>
  <div class="formula-label" style="text-align:center;">
    j = 尺度参数 &nbsp;|&nbsp; l = 方向（剪切）参数 &nbsp;|&nbsp; k = 空间平移参数 &nbsp;|&nbsp; &psi; = 母小波函数
  </div>

  <div class="formula-label" style="margin-top:12px;">④ Shearlet 正变换（内积）</div>
  <div class="formula">SH(f) = &lang; f, &psi;<sub>j,l,k</sub> &rang; = &int; f(x) &middot; &psi;<sub>j,l,k</sub>(x) dx</div>
</div>

<h4>在去雨中的具体应用：方向性分解分离雨纹</h4>
<div class="kg-step">
  <strong>核心思路</strong>：雨纹具有明显的<b>方向性</b>（通常沿某一主导方向呈细长条纹），而背景图像的边缘和纹理方向各不相同。Contourlet/Shearlet 能将图像分解为多个方向子带，使雨纹能量集中在少数特定方向子带中，从而实现分离。
</div>

<div class="kg-compare">
  <div class="kg-card">
    <h4>Contourlet 去雨流程</h4>
    <p>① <b>LP 分解</b>：将含雨图像分为低频近似（背景主体）和多层高频细节；<br>
    ② <b>DFB 方向分解</b>：对高频层做方向分解，雨纹集中在其主导方向的子带中；<br>
    ③ <b>阈值处理</b>：对雨纹方向子带做软/硬阈值收缩，抑制雨纹系数；<br>
    ④ <b>DFB 重建 + LP 重建</b>：逆变换得到去雨图像。</p>
  </div>
  <div class="kg-card">
    <h4>Shearlet 去雨流程</h4>
    <p>① <b>Shearlet 正变换</b>：对含雨图像做多尺度多方向分解，得到各尺度各方向的剪切系数；<br>
    ② <b>稀疏分析</b>：雨纹系数在特定 (j, l) 方向子带中幅值大，背景系数分散且幅值小；<br>
    ③ <b>系数修正</b>：结合统计模型（如 GMM）对雨纹方向系数做自适应收缩；<br>
    ④ <b>Shearlet 逆变换</b>：重建得到去雨图像。</p>
  </div>
</div>

<div class="note-box">
  <strong>关键优势</strong>：相比小波只有 3 个方向（水平/垂直/对角），Contourlet 可提供 2<sup>l</sup> 个方向（如 l=3 时 8 个方向），Shearlet 更可通过连续剪切参数实现<b>任意方向</b>的精细分析。这使得斜向雨纹不再被混入对角子带，而是被独立分离到专属方向子带中，大幅提升去雨精度。
</div>

<h4>7.1 小波 + TV正则化结合</h4>

<p><b>TV（Total Variation，全变分）正则化</b>的核心思想是：假设"好的图像"应该是<b>分段平坦</b>的（一大片天空是均匀的，突然跳到建筑物的边缘有一个急剧变化，但不会在平坦区域里有杂乱的抖动）。</p>

<p><b>为什么组合？</b>小波擅长频率定位但可能在平坦区域产生伪影；TV擅长保持平坦和锐利边缘但可能丢失纹理。两者互补：小波先分频，TV在小波域里做正则化，既保留了边缘又减少了伪影。</p>

<h4>TV 正则化的数学公式</h4>

<div class="formula-box">
  <div class="formula-label">连续形式（连续全变分）</div>
  <div class="formula" style="font-size:17px;font-weight:bold;">TV(u) = &int;<sub>&Omega;</sub> |&nabla;u| dx = &int;<sub>&Omega;</sub> &radic;( (&part;u/&part;x)<sup>2</sup> + (&part;u/&part;y)<sup>2</sup> ) dx</div>
  <div class="formula-label" style="text-align:center;">&Omega; 为图像域，|&nabla;u| 为梯度幅值，TV 即梯度幅值在全域上的积分</div>

  <div class="formula-label" style="margin-top:14px;">离散形式（像素级全变分）</div>
  <div class="formula" style="font-size:16px;font-weight:bold;">TV(u) = &Sigma;<sub>i,j</sub> | u<sub>i+1,j</sub> &minus; u<sub>i,j</sub> | + | u<sub>i,j+1</sub> &minus; u<sub>i,j</sub> |</div>
  <div class="formula-label" style="text-align:center;">即所有相邻像素差值的绝对值之和（水平差分 + 垂直差分）</div>

  <div class="formula-label" style="margin-top:14px;">ROF 去噪模型（最小化目标）</div>
  <div class="formula" style="font-size:16px;font-weight:bold;">min<sub>u</sub> &nbsp; &frac12; ||u &minus; f||<sup>2</sup><sub>2</sub> + &lambda; &middot; TV(u)</div>
  <div class="formula-label" style="text-align:center;">f = 含噪观测图像 &nbsp;|&nbsp; u = 待求干净图像 &nbsp;|&nbsp; &lambda; = 正则化参数（平衡保真项与平滑项）</div>
</div>

<h4>TV 的来历：从 Tikhonov 到 ROF</h4>
<div class="kg-step">
  <strong>Rudin-Osher-Fatemi (ROF) 模型</strong>：1992 年，Leonid Rudin、Stanley Osher 和 Emad Fatemi 在论文 <i>"Nonlinear total variation based noise removal algorithms"</i> 中首次提出以全变分（TV）作为正则项的图像去噪模型。这是对经典 <b>Tikhonov 正则化</b>（1963 年）的关键改进——Tikhonov 用 <b>L2 范数</b>惩罚梯度（&int;|&nabla;u|<sup>2</sup>dx），导致边缘被过度平滑；ROF 改用 <b>L1 范数</b>惩罚梯度（&int;|&nabla;u|dx），允许边缘处存在大跳跃，从而在去噪的同时<b>保留锐利边缘</b>。
</div>

<h4>为什么 TV 能保留边缘？L2 vs L1 的本质区别</h4>

<div class="kg-compare">
  <div class="kg-card">
    <h4>Tikhonov 正则化（L2 范数）</h4>
    <p><b>惩罚项</b>：&int;|&nabla;u|<sup>2</sup> dx &nbsp;（梯度的<b>平方</b>）</p>
    <p style="margin-top:8px;"><b>问题</b>：边缘处梯度大 &rarr; 平方后惩罚<b>急剧增大</b> &rarr; 优化器为了降低总惩罚，会<b>压低边缘处梯度</b> &rarr; 边缘被磨平、模糊。</p>
    <p style="margin-top:8px;color:var(--accent-red);"><b>结果</b>：过度平滑，边缘丢失</p>
  </div>
  <div class="kg-card">
    <h4>TV 正则化（L1 范数）</h4>
    <p><b>惩罚项</b>：&int;|&nabla;u| dx &nbsp;（梯度的<b>绝对值</b>）</p>
    <p style="margin-top:8px;"><b>优势</b>：边缘处梯度大 &rarr; 绝对值惩罚<b>线性增长</b>（不像平方那样爆炸） &rarr; 优化器<b>容忍</b>边缘处的大跳跃 &rarr; 边缘保持锐利。</p>
    <p style="margin-top:8px;color:var(--accent-green);"><b>结果</b>：平坦区域去噪，边缘保留</p>
  </div>
</div>

<div class="kg-step">
  <strong>为什么小波 + TV 互补？</strong>小波擅长<b>频率定位</b>（把雨纹噪声集中到高频子带）但可能在平坦区域产生伪影振荡；TV 擅长<b>分段平坦约束</b>（消除平坦区抖动、保留锐利边缘）但单独使用可能丢失细密纹理。两者结合：小波先分频，TV 在小波域内对高频系数做 L1 正则化收缩——既利用了小波的频率选择性，又借助 TV 的边缘保持能力，实现"去噪保边"的最优平衡。
</div>

<h4>7.2 频域注意力融合</h4>

<p>把<b>注意力机制</b>搬到了频域里。传统注意力在空间域计算（这个像素和那个像素的关系），频域注意力在<b>频率维度</b>计算（这个频率通道和那个频率通道的关系）。</p>

<div class="kg-step">
  <strong>典型做法</strong>：把图像做FFT变换到频域 → 在频域的不同频率通道上做自注意力/交叉注意力 → 学习"哪些频率通道对当前任务更重要" → 加权后再IFFT回空间域。
</div>

<p><b>优势</b>：能自适应地选择频率通道——不用人工设阈值，网络自己学"雨纹在哪些频率、背景在哪些频率"。SCGN、TransMamb等论文都用了这个思路。</p>

<h4>7.3 小波变换 + CNN结合</h4>

<p>CNN在<b>空间域</b>提取局部特征，小波在<b>频率域</b>做多尺度分解。两者结合的典型方式：</p>

<div class="kg-compare">
  <div class="kg-card">
    <h4>方式A：小波做预处理</h4>
    <p>先用小波分解出LL/LH/HL/HH四个子带 → 把每个子带当作不同的"输入通道"喂给CNN → CNN在不同子带上分别学习特征。</p>
    <p style="margin-top:6px;font-size:12px;color:var(--text-muted);">代表：DAWN+（小波域向量分解 + 方向注意力）</p>
  </div>
  <div class="kg-card">
    <h4>方式B：小波嵌入网络</h4>
    <p>把小波变换作为网络中的一个<b>可学习层</b>嵌入CNN → 网络自动学习如何做小波分解和重建 → 端到端训练。</p>
    <p style="margin-top:6px;font-size:12px;color:var(--text-muted);">代表：MFFDNet（CSAB通道注意力分离高低频）</p>
  </div>
</div>

<h4>7.4 混合域去雨网络——"空间+频域+小波"三剑合璧</h4>

<p>最新的去雨网络已经不再局限于单一域，而是<b>在多个域之间切换和融合</b>：</p>

<div class="kg-img-wrap">
  <picture class="kg-picture"><source srcset="reading-notes/assets/knowledge-hybrid-domain.webp" type="image/webp"><img src="reading-notes/assets/knowledge-hybrid-domain-thumb.webp" data-full="reading-notes/assets/knowledge-hybrid-domain.webp" alt="混合域去雨流水线" class="kg-img kg-img-lazy" loading="lazy" decoding="async"></picture>
  <div class="kg-caption">图：混合域去雨网络——空间域CNN提取局部特征 + 频域注意力捕获全局依赖 + 小波域多尺度分析</div>
</div>

<table>
<thead><tr><th>论文</th><th>使用的域</th><th>核心思路</th></tr></thead>
<tbody>
<tr><td><b>DAWN+</b></td><td>小波域</td><td>小波分解 → 方向感知注意力 → 互表示学习 → 小波重建</td></tr>
<tr><td><b>MFFDNet</b></td><td>空间域 + 频域(CSAB)</td><td>CSAB通道注意力分离高低频 + WTB窗口Transformer捕获全局</td></tr>
<tr><td><b>TransMamb</b></td><td>空间域 + 频域</td><td>频谱分组Transformer(频域通道注意力) + 双向SSM(空间序列)</td></tr>
<tr><td><b>SCGN</b></td><td>空间域 + 频域(FFT)</td><td>空间标准差引导加权 + FFT频带引导加权 → 双域融合</td></tr>
<tr><td><b>CPRAformer</b></td><td>空间域 + 频域模块</td><td>稀疏提示通道注意力 + CNN近似空间注意力 + 自适应频率对齐</td></tr>
<tr><td><b>SSFA-Net</b></td><td>空间域 + 频域</td><td>稀疏条带注意力 + 空间-频率双域注意力(DDSFA)</td></tr>
</tbody>
</table>

<p><b>混合域为什么强？</b>因为每个域都有自己擅长的部分：</p>
<ul>
  <li><span class="kg-tag" style="background:#6366f1;color:#fff;">空间域</span> 擅长提取<b>局部纹理和边缘</b>（CNN的卷积核天然做这个）</li>
  <li><span class="kg-tag" style="background:#0ea5e9;color:#fff;">频域</span> 擅长分析<b>全局频率分布</b>和<b>通道间依赖</b>（FFT自注意力计算量小）</li>
  <li><span class="kg-tag" style="background:#f59e0b;color:#fff;">小波域</span> 擅长<b>多尺度+方向性</b>分析（LL/LH/HL/HH金字塔）</li>
</ul>

<p>把它们组合起来，就像让一个团队里有人负责看细节、有人负责看全局、有人负责看方向——<b>各司其职，互补短板</b>，效果自然比任何单打独斗都好。</p>

<div class="kg-step">
  <strong>💡 总结一句话</strong>：频域方法提供了"频率视角"但缺乏空间定位能力 → 小波解决了定位问题但方向性不足 → Contourlet/Shearlet增强方向性 → 混合域网络把它们全部组合，实现"局部+全局+频率+方向"的全面建模。这就是去雨领域从传统方法到深度学习方法的进化脉络。
</div>
</div></div>

</div>

<p>写文章时，一个精炼的关键词就能概括一整段内容——稀疏表示的哲学就是这样：<b>用尽可能少的"基元"来表示图像信号</b>。本章介绍字典学习、稀疏编码、低秩表示和GMM建模等核心方法，揭示图像信号背后的"经济法则"。</p>

<div class="kg-step">
  <strong>核心概念：字典学习 (Dictionary Learning)</strong>——学习一组<b>过完备字典</b>D（字典原子数远大于信号维度），用少量字典原子的线性组合来表示图像patch：<b>y = D x a</b>，其中a是稀疏的（大部分系数为0）。就像用少量"关键词"组合出一段完整的文字——大部分词都不用，只用最重要的几个。
</div>

<div class="kg-step">
  <strong>稀疏编码 (Sparse Coding)</strong>——给定字典D，求最优稀疏表示a。<b>L0范数</b>（非零元素个数）是最直观的稀疏度量，但求解是NP-hard的。实际中用<b>L1范数</b>（LASSO）做松弛——就像从"恰好只用5个关键词"（L0，太难了）退而求其次到"关键词的总权重尽量小"（L1，可以高效求解）。
</div>

<div class="kg-step">
  <strong>低秩表示 (Low-rank Representations)</strong>——自然图像中，非局部相似的patch构成的矩阵具有<b>低秩特性</b>。就像很多相似的照片排成一排，真正"独立"的信息其实很少。<b>SVD分解</b>保留前r个奇异值就能抓住主要信息。<b>RPCA</b>（鲁棒主成分分析）将矩阵分解为<b>低秩矩阵L + 稀疏矩阵S</b>——L是干净的信号，S是噪声/异常值。
</div>

<div class="kg-step">
  <strong>GMM高斯混合模型</strong>——用多个高斯分布的加权组合来建模图像patch的像素级统计分布。就像用几个"高斯泡泡"的叠加来近似描述复杂的形状。<b>EM算法</b>求解：E步（期望）计算每个数据点属于每个高斯分量的后验概率，M步（最大化）更新每个分量的均值、方差和权重。两步交替直到收敛。
</div>

<div class="kg-step">
  <strong>K-SVD算法</strong>——字典学习的经典交替优化方法。两步循环：<b>第一步</b>固定字典D，对每个patch做稀疏编码（用OMP算法，正交匹配追踪，贪心地选择最优原子）；<b>第二步</b>固定编码a，逐列更新字典D（对相关patch子矩阵做SVD分解，用左奇异向量更新字典原子）。就像一个"词典编纂者"先查用法（编码），再修词条（更新字典），反复打磨。
</div>

<div class="kg-step">
  <strong>与DnLUT的关系</strong>——字典学习定义了一个从输入到输出的<b>非线性映射</b>（通过稀疏表示间接实现），而LUT（查找表）将这个映射<b>离散化</b>为有限的表格条目。字典学习告诉我们"该用什么基元组合"，LUT则把这些组合结果"预制好存起来"。两者在"非线性近似"这一目标上殊途同归。
</div>

<h4>稀疏编码 vs 低秩表示 vs GMM</h4>

<table>
<thead><tr><th>方法</th><th>核心思想</th><th>稀疏性体现</th><th>典型应用</th><th>类比</th></tr></thead>
<tbody>
<tr><td><b>稀疏编码</b></td><td>过完备字典 + 稀疏线性组合</td><td>系数向量a大部分为0</td><td>图像去噪、压缩感知</td><td>用少量关键词写文章</td></tr>
<tr><td><b>低秩表示</b></td><td>相似patch矩阵的秩很低</td><td>奇异值只有前几个非零</td><td>背景建模、RPCA去噪</td><td>很多相似照片只需几张代表</td></tr>
<tr><td><b>GMM</b></td><td>多高斯分布加权建模统计特性</td><td>数据集中分布在少数分量</td><td>图像先验建模、分割</td><td>用几个泡泡近似复杂形状</td></tr>
</tbody>
</table>

  <div class="kg-guide-desc">神经网络不是魔法，而是一套可解释的数学工具。从感知机到反向传播，从激活函数到归一化——本章会把"黑盒"拆开，让你看到每一颗齿轮怎么转动。掌握这些，你就能读懂任何一篇论文的训练细节。</div>

<div class="kg-section" id="kg-s9">
<div class="kg-spark">感知机（1958）被发明时，发明者Rosenblatt曾乐观地预测它很快能模拟人脑。然而1969年Minsky一本《感知机》证明了它连"异或"都解决不了，导致神经网络研究陷入长达15年的"AI寒冬"。直到1986年反向传播算法被重新发现，神经网络才复活——科学史告诉我们：<b>一个方法的衰落往往不是因为错，而是因为时候未到</b>。</div>

<div class="kg-accordion-header" onclick="kgToggleAcc(this)"><h3>九、从感知机到深度神经网络——神经网络是怎么"进化"的？</h3><span class="kg-acc-icon">▼</span></div>
<div class="kg-accordion-body">

<p>要理解深度学习，得先回到1958年——那时候AI的"老祖宗"感知机（Perceptron）诞生了。</p>

<h4>9.1 感知机：最简单的"人工神经元"</h4>

<p>感知机就是在模仿大脑神经元的工作方式：</p>

<div class="kg-step">
  <strong>一个神经元做什么？</strong>接收多个输入信号 → 给每个信号乘一个权重（有的重要有的不重要） → 全部加起来 → 如果总和超过某个阈值就"激活"（输出1），否则"沉默"（输出0）。
</div>

<p><b>公式</b>：<code>y = σ(w₁x₁ + w₂x₂ + ... + wₙxₙ + b)</code></p>

<div class="kg-card" style="margin-top:12px;">
  <canvas id="canvas-perceptron-demo" width="500" height="140" style="width:100%;max-width:500px;height:auto;display:block;margin:0 auto;background:transparent;border-radius:8px;"></canvas>
  <div class="kg-caption">小概念演示：感知机——输入×权重→求和→激活函数→输出</div>
</div>

<p>但是感知机有个致命缺陷——它只能解决<b>线性可分</b>的问题（能用一条直线分开的），遇到"异或"这种非线性问题就彻底傻眼了。这就是著名的"AI寒冬"导火索。</p>

<h4>9.2 MLP（多层感知机）：从"一个神经元"到"一个团队"</h4>

<p>解决感知机局限的方法很简单——<b>多堆几层</b>。这就是MLP（Multi-Layer Perceptron）：</p>

<p><b>为什么多层能解决非线性问题？</b>因为每一层都在做一次非线性变换（通过激活函数），多次叠加后就能"弯折"空间，把非线性问题变成线性可分的。就像折纸——一次对折看不出什么，但反复对折后就能折出复杂的形状。</p>

<h4>9.3 从MLP到"深度"神经网络</h4>

<p>当隐藏层超过2-3层时，就叫"深度"神经网络了。层数越多，网络能学习的特征就越抽象：</p>

<h4>10.1 前向传播：做题</h4>

<p>数据从输入层进入，逐层计算：</p>
<div class="kg-step">
  <strong>每一层做两件事</strong>：<br>
  1️⃣ <b>加权求和</b>：<code>z = w₁x₁ + w₂x₂ + ... + b</code>（把输入乘以权重再加偏置）<br>
  2️⃣ <b>激活</b>：<code>a = σ(z)</code>（通过激活函数做非线性变换）<br>
  然后把 <code>a</code> 传给下一层，一层层传到输出层，得到预测值 <code>ŷ</code>。
</div>

<h4>10.2 计算损失：打分</h4>

<p>预测值 <code>ŷ</code> 和真实值 <code>y</code> 之间有差距，用<b>损失函数</b> L 来衡量这个差距有多大。差距越大，损失越高。</p>

<h4>10.3 反向传播：纠错</h4>

<p>这是最精妙的一步。反向传播的核心是<b>链式法则</b>（Chain Rule）——高数里的求导法则。</p>

<div class="kg-step">
  <strong>链式法则一句话版</strong>：如果 A 影响 B，B 影响 C，那 A 对 C 的影响 = (A对B的影响) × (B对C的影响)。<br><br>
  在神经网络里就是：<b>损失L对某个权重w的影响 = 逐层把偏导数乘起来</b>。<br>
  <code>∂L/∂w = ∂L/∂a × ∂a/∂z × ∂z/∂w</code>
</div>

<p><b>打个比方</b>：你是一个工厂老板（损失函数），发现产品不合格（损失大）。你要追溯责任——先问质检员（输出层）"你哪里出了问题？"，质检员说"是上游零件不好"，于是你去问上游车间（隐藏层）"你们哪里有问题？"，一层层追回去，最后找到是某个工人（某个权重）的操作不对，告诉他"下次要调多少"。</p>

<div class="kg-flow">
  <span class="kg-node" style="background:#10b981;color:#fff;">输入x</span>
  <span class="kg-arrow">→ z=wx+b →</span>
  <span class="kg-node" style="background:#6366f1;color:#fff;">a=σ(z)</span>
  <span class="kg-arrow">→ ... →</span>
  <span class="kg-node" style="background:#f59e0b;color:#fff;">预测ŷ</span>
  <span class="kg-arrow">→</span>
  <span class="kg-node" style="background:#ef4444;color:#fff;">损失L</span>
  <span class="kg-arrow" style="color:#ef4444;">← ∂L/∂a ← ∂a/∂z ← ∂L/∂w ←</span>
</div>

<p>反向传播完成后，每个权重都收到了一个"梯度"（gradient），告诉它"你应该往哪个方向调、调多少"。</p>

<div class="kg-section" id="kg-s12">
<div class="kg-accordion-header" onclick="kgToggleAcc(this)"><h3>十二、梯度下降——"下山找最低谷"的智慧</h3><span class="kg-acc-icon">▼</span></div>
<div class="kg-accordion-body">

<p>反向传播告诉我们"每个权重该往哪调"，而梯度下降就是真正执行这个调整的算法。</p>

<div class="kg-img-wrap">
  <picture class="kg-picture"><source srcset="reading-notes/assets/knowledge-gradient-descent.webp" type="image/webp"><img src="reading-notes/assets/knowledge-gradient-descent-thumb.webp" data-full="reading-notes/assets/knowledge-gradient-descent.webp" alt="梯度下降方法对比" class="kg-img kg-img-lazy" loading="lazy" decoding="async"></picture>
  <div class="kg-caption">图：不同优化器的路径对比——SGD最曲折，Adam最直接</div>
</div>

<h4>12.1 基本原理：蒙眼下山</h4>

<p>想象你被蒙上眼睛站在山上，目标是到达最低的谷底。你能感受脚下的坡度（梯度），于是每次往<b>最陡的下坡方向</b>走一步。这就是梯度下降。</p>

<div class="kg-gd-demo">
  <div class="kg-gd-container">
    <svg viewBox="0 0 500 180" style="width:100%;max-width:500px;display:block;">
      <defs>
        <linearGradient id="kgHillGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(99,102,241,0.02)"/>
          <stop offset="100%" stop-color="rgba(99,102,241,0.15)"/>
        </linearGradient>
      </defs>
      <path d="M 0 30 Q 80 20 140 50 T 260 100 T 380 145 T 500 160 L 500 180 L 0 180 Z" fill="url(#kgHillGrad)" stroke="var(--primary)" stroke-width="2"/>

        <animate attributeName="cx" values="30;120;200;280;340;340;30" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="32;50;75;100;125;125;32" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="12;12;12;11;10;10;12" dur="5s" repeatCount="indefinite"/>
      </circle>

      <text x="340" y="160" font-size="10" fill="#10b981">最低点(最优解)</text>
    </svg>
  </div>
  <p style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:8px;">👆 动画：小球从山顶滚向谷底——这就是梯度下降的可视化</p>
</div>

<p><b>公式</b>：<code>w_new = w_old - η × ∂L/∂w</code></p>
<p>其中 <code>η</code>（eta）是<b>学习率</b>——决定每步走多大。走太大可能跳过谷底，走太小可能走到天荒地老。</p>

<h4>12.2 梯度下降的三个"版本"</h4>

<table>
<thead><tr><th>方法</th><th>每次用什么数据</th><th>速度</th><th>稳定性</th><th>比喻</th></tr></thead>
<tbody>
<tr><td><b>批量梯度下降 (BGD)</b></td><td>全部训练数据</td><td>慢</td><td>最稳定</td><td>每次下山前把整座山的地形都勘测一遍</td></tr>
<tr><td><b>随机梯度下降 (SGD)</b></td><td>1个样本</td><td>最快</td><td>最不稳定（抖动大）</td><td>蒙着眼只摸脚下一小块就迈步</td></tr>
<tr><td><b>小批量梯度下降 (Mini-batch GD)</b></td><td>一小批样本（如32/64/128）</td><td>较快</td><td>较稳定</td><td>每次看一小片区域再决定方向</td></tr>
</tbody>
</table>

<h4>12.3 优化器进化史：从SGD到Adam</h4>

<div class="kg-tabs" id="kgOptimizerTabs">
  <div class="kg-tab active" onclick="kgSwitchTab('sgd')">SGD</div>
  <div class="kg-tab" onclick="kgSwitchTab('momentum')">Momentum</div>
  <div class="kg-tab" onclick="kgSwitchTab('adagrad')">AdaGrad</div>
  <div class="kg-tab" onclick="kgSwitchTab('rmsprop')">RMSprop</div>
  <div class="kg-tab" onclick="kgSwitchTab('adam')">Adam ⭐</div>
</div>

<div class="kg-tab-content active" id="kg-tab-sgd">
  <h4>SGD（随机梯度下降）— 最基础版</h4>
  <p><code>w = w - η × ∇L</code></p>
  <p>每次只用一个（或一小批）样本的梯度来更新。简单直接，但路径曲折震荡，容易在峡谷地形里来回弹跳。</p>
  <p><b>适合</b>：大规模数据集、简单模型。<b>缺点</b>：收敛慢，容易卡在局部最优。</p>
</div>

<div class="kg-tab-content" id="kg-tab-momentum">
  <h4>Momentum（动量法）— "惯性滑行"</h4>
  <p><code>v = γ×v + η×∇L &nbsp;→&nbsp; w = w - v</code></p>
  <p>引入"动量"概念——像滚球有惯性一样，积累之前的梯度方向。即使当前梯度方向变了，之前积累的动量还会带着球继续往前冲一段，帮助越过平坦区域和小坑。</p>
  <p><b>比喻</b>：SGD是"走一步看一步"，Momentum是"骑自行车有惯性，即使不蹬也会滑一段"。</p>
</div>

<div class="kg-tab-content" id="kg-tab-adagrad">
  <h4>AdaGrad — "自适应学习率（每个参数不同）"</h4>
  <p><code>w = w - η/(√(G+ε)) × ∇L</code></p>
  <p>给每个参数分配不同的学习率——频繁更新的参数学习率自动减小，不常更新的参数保持较大学习率。像因材施教——学得快的学生给少点作业，学得慢的多给点。</p>
  <p><b>缺点</b>：学习率只减不增，训练后期学习率会变得太小，几乎停止学习。</p>
</div>

<div class="kg-tab-content" id="kg-tab-rmsprop">
  <h4>RMSprop — "解决AdaGrad的衰减问题"</h4>
  <p><code>v = β×v + (1-β)×∇L² &nbsp;→&nbsp; w = w - η/(√(v+ε)) × ∇L</code></p>
  <p>用指数移动平均代替累加和——只关注"最近"的梯度平方，不让历史累积把学习率压死。Hinton提出，至今仍是RNN训练的常用选择。</p>
  <p><b>一句话</b>：AdaGrad的"遗忘版"——记住近期，忘记远古。</p>
</div>

<div class="kg-tab-content" id="kg-tab-adam">
  <h4>Adam — "Momentum + RMSprop 的合体"（最常用 ⭐）</h4>
  <p><code>m = β₁×m + (1-β₁)×∇L &nbsp;（动量）<br>v = β₂×v + (1-β₂)×∇L² &nbsp;（自适应学习率）<br>w = w - η×m̂/(√(v̂)+ε)</code></p>
  <p>同时具备Momentum的"惯性滑行"和RMSprop的"自适应学习率"，还有偏差校正让初期训练更稳定。是目前深度学习中最常用的优化器。</p>
  <p><b>默认参数</b>：β₁=0.9, β₂=0.999, η=0.001。<b>适合</b>：几乎所有深度学习任务（CNN、Transformer、GAN）。</p>
</div>
</div></div>
<div class="kg-section" id="kg-s13">
<div class="kg-accordion-header" onclick="kgToggleAcc(this)"><h3>十三、损失函数——"裁判"如何打分？</h3><span class="kg-acc-icon">▼</span></div>
<div class="kg-accordion-body">

<p>损失函数（Loss Function）就是神经网络的"裁判"——它衡量预测值和真实值之间的差距。训练的目标就是<b>让损失尽可能小</b>。</p>

<div class="kg-img-wrap">
  <picture class="kg-picture"><source srcset="reading-notes/assets/knowledge-loss-functions.webp" type="image/webp"><img src="reading-notes/assets/knowledge-loss-functions-thumb.webp" data-full="reading-notes/assets/knowledge-loss-functions.webp" alt="损失函数对比" class="kg-img kg-img-lazy" loading="lazy" decoding="async"></picture>
  <div class="kg-caption">图：不同损失函数对误差的惩罚方式不同——MSE惩罚大误差，MAE线性惩罚，Huber取平衡</div>
</div>

<h4>13.1 回归任务用的损失函数</h4>

<div class="kg-loss-demo">
  <div style="text-align:center;margin-bottom:8px;font-size:13px;color:var(--text-muted);">👇 动画：当预测误差为5时，不同损失函数的"惩罚力度"</div>
  <div class="kg-loss-bars">
    <div class="kg-loss-bar" style="background:#6366f1;height:25%;animation-delay:0s;">
      <span class="kg-loss-bar-value">1.0</span>
      <span class="kg-loss-bar-label">MAE</span>
    </div>
    <div class="kg-loss-bar" style="background:#0ea5e9;height:55%;animation-delay:0.2s;">
      <span class="kg-loss-bar-value">6.0</span>
      <span class="kg-loss-bar-label">MSE</span>
    </div>
    <div class="kg-loss-bar" style="background:#f59e0b;height:30%;animation-delay:0.4s;">
      <span class="kg-loss-bar-value">1.8</span>
      <span class="kg-loss-bar-label">Huber</span>
    </div>
    <div class="kg-loss-bar" style="background:#a855f7;height:40%;animation-delay:0.6s;">
      <span class="kg-loss-bar-value">3.0</span>
      <span class="kg-loss-bar-label">Log-Cosh</span>
    </div>
  </div>
  <p style="text-align:center;font-size:11px;color:var(--text-muted);margin-top:30px;">误差=5时的损失值对比：MSE(25)被平方放大，MAE(5)线性增长，Huber取平衡</p>
</div>

<table>
<thead><tr><th>损失函数</th><th>公式</th><th>特点</th><th>适用场景</th></tr></thead>
<tbody>
<tr><td><b>MAE (L1 Loss)</b></td><td>L = |y - ŷ|</td><td>对异常值<b>鲁棒</b>（不放大误差）；但在零点不可导</td><td>数据中有较多异常值</td></tr>
<tr><td><b>MSE (L2 Loss)</b></td><td>L = (y - ŷ)²</td><td>大误差被<b>平方放大</b>，网络更关注大误差样本；但对异常值敏感</td><td>大部分回归任务（默认选择）</td></tr>
<tr><td><b>Huber Loss</b></td><td>小误差用MSE，大误差用MAE</td><td><b>两者优点兼得</b>——小误差平滑可导，大误差不爆炸</td><td>有异常值但不想完全忽略</td></tr>
<tr><td><b>Log-Cosh</b></td><td>L = log(cosh(y - ŷ))</td><td>比Huber更平滑，二阶可导</td><td>XGBoost、需要二阶导数的优化</td></tr>
</tbody>
</table>

  <div id="echarts-loss-surface" style="width:100%;height:380px;"></div>

</div>

</div>

<h4>13.2 分类任务用的损失函数</h4>

<table>
<thead><tr><th>损失函数</th><th>公式</th><th>特点</th><th>适用场景</th></tr></thead>
<tbody>
<tr><td><b>交叉熵 (Cross-Entropy)</b></td><td>L = -Σ yᵢ·log(ŷᵢ)</td><td>预测越错且越自信，惩罚越大（对数级惩罚）</td><td><b>分类任务标配</b>（配合Softmax）</td></tr>
<tr><td><b>二元交叉熵 (BCE)</b></td><td>L = -[y·log(ŷ) + (1-y)·log(1-ŷ)]</td><td>交叉熵的二分类特例</td><td>二分类（配合Sigmoid）</td></tr>
<tr><td><b>Focal Loss</b></td><td>L = -α(1-ŷ)^γ · y·log(ŷ)</td><td>降低"容易分类"样本的权重，聚焦"难分"样本</td><td>类别不平衡（如目标检测）</td></tr>
<tr><td><b>KL散度</b></td><td>L = Σ yᵢ·log(yᵢ/ŷᵢ)</td><td>衡量两个分布的差异</td><td>知识蒸馏、VAE</td></tr>
</tbody>
</table>

<h4>13.3 图像恢复任务用的损失函数</h4>

<table>
<thead><tr><th>损失函数</th><th>作用</th><th>论文中常见于</th></tr></thead>
<tbody>
<tr><td><b>L1 / L2 Loss</b></td><td>像素级重建误差</td><td>几乎所有去雨/去雾/超分论文</td></tr>
<tr><td><b>感知损失 (Perceptual Loss)</b></td><td>用VGG特征衡量"看起来像不像"，而非像素级差异</td><td>MFFDNet、超分辨率</td></tr>
<tr><td><b>SSIM Loss</b></td><td>结构相似性——衡量亮度、对比度、结构三维度</td><td>去雾、图像质量增强</td></tr>
<tr><td><b>对抗损失 (Adversarial Loss)</b></td><td>判别器打分——"看起来真不真"</td><td>GAN-based去雨/超分</td></tr>
<tr><td><b>频谱一致性损失</b></td><td>在频域约束重建信号的关系</td><td>TransMamb</td></tr>
</tbody>
</table>

<div class="kg-step">
  <strong>💡 为什么图像恢复要用多种损失组合？</strong>因为单一L1/L2只看像素级差异——可能像素差不多但看起来很模糊。加入感知损失关注"视觉感知质量"，加入SSIM关注"结构保持"，加入对抗损失关注"真实感"。多种损失组合才能全面提升恢复质量。比如MFFDNet就用 <code>L1 + 0.04×Perceptual</code>。
</div>

<div class="kg-step">
  <strong>🎯 全章总结</strong>：感知机太简单 → MLP加层加激活函数引入非线性 → 反向传播用链式法则算梯度 → 梯度下降（SGD→Momentum→Adam）沿着梯度下山调参 → 损失函数当裁判给预测打分 → 网络不断"做题→纠错→改进"直到损失最小。这就是深度学习的完整闭环！
</div>
</div></div>
<div class="kg-section" id="kg-s14">
<div class="kg-spark">He初始化是Kaiming He（何恺明）在2015年提出的。有趣的是，ResNet（也是他的工作）之所以能训练152层甚至1000层，很大程度上依赖于He初始化+BatchNorm的组合。好的基础设施（初始化+归一化）让不可能变为可能。</div>

<div class="kg-accordion-header" onclick="kgToggleAcc(this)"><h3>十四、参数初始化——神经网络的第一粒种子</h3><span class="kg-acc-icon">▼</span></div>
<div class="kg-accordion-body">

<p>神经网络训练就像种一棵树——<b>初始化的好坏决定了这棵树能不能健康长大</b>。如果权重全设为0，所有神经元输出相同，网络退化为单层；如果权重太大，梯度像滚雪球一样爆炸；如果权重太小，梯度逐层衰减直至消失。</p>

<div class="kg-img-wrap">
  <picture class="kg-picture"><source srcset="reading-notes/assets/knowledge-weight-init.webp" type="image/webp"><img src="reading-notes/assets/knowledge-weight-init-thumb.webp" data-full="reading-notes/assets/knowledge-weight-init.webp" alt="参数初始化策略对比" class="kg-img kg-img-lazy" loading="lazy" decoding="async"></picture>
  <div class="kg-caption">图：参数初始化核心——方差守恒原理，以及Zero/Normal/Xavier/He四种策略对比</div>
</div>

<h4>14.1 初始化不当的两大灾难</h4>

<table>
<thead><tr><th>灾难</th><th>原因</th><th>表现</th></tr></thead>
<tbody>
<tr><td><b>梯度消失</b></td><td>权重太小（如0.01），每层梯度被不断缩小</td><td>深层参数几乎不更新，loss卡死</td></tr>
<tr><td><b>梯度爆炸</b></td><td>权重太大（如10），每层梯度被不断放大</td><td>loss突然变成NaN，参数飞散</td></tr>
</tbody>
</table>

<h4>14.2 四种初始化策略</h4>

<div class="kg-step">
  <strong>Zero Initialization（全零初始化）</strong>——全部权重设为0。<br>
  ❌ 致命问题：所有神经元输出完全相同，反向传播时梯度也完全相同，网络退化为单个神经元，失去多层意义。
</div>

<div class="kg-step">
  <strong>Random Normal（随机正态初始化）</strong>——W ~ N(0, σ²)。<br>
  ⚠️ 问题：σ选多大？太大导致爆炸，太小导致消失。没有理论指导，全靠调参运气。
</div>

<div class="kg-step">
  <strong>Xavier Initialization（Glorot初始化）</strong>——W ~ U[-√(6/(n_in+n_out)), √(6/(n_in+n_out))]。<br>
  ✓ 核心思想：保持前向传播和反向传播时的方差不变。适合tanh、sigmoid等对称激活函数。
</div>

<div class="kg-step">
  <strong>He Initialization（Kaiming初始化）</strong>——W ~ N(0, √(2/n_in))。<br>
  ✓ 核心思想：考虑ReLU"杀死一半神经元"的特性，将方差放大2倍补偿。适合ReLU及变体（LeakyReLU、PReLU等）。
</div>

<h4>14.3 动态演示：梯度传播的"健康检查"</h4>
<div class="kg-card" style="margin-top:16px;">
    <div id="echarts-init-demo-div" style="width:100%;max-width:700px;height:350px;margin:0 auto;border-radius:10px;overflow:hidden;"></div>
  <div style="text-align:center;padding:4px 0;font-size:12px;color:var(--text-muted);">参数初始化策略对比 · Xavier/He/随机</div>
</div>

<div class="kg-step">
  <strong>🎯 选型指南</strong>：用ReLU家族 → 选He初始化；用tanh/sigmoid → 选Xavier；绝对不要用Zero；Random Normal不如前两者稳定。BatchNorm能在一定程度上缓解初始化敏感性，但好的初始化仍是成功训练的第一步。
</div>

</div></div>

<div class="kg-section" id="kg-s15">
<div class="kg-accordion-header" onclick="kgToggleAcc(this)"><h3>十五、学习率调度——训练节奏的"指挥棒"</h3><span class="kg-acc-icon">▼</span></div>
<div class="kg-accordion-body">

<p>想象你在下山找最低点：<b>一开始可以大步流星</b>（学习率大），快速接近谷底；<b>接近谷底时要换小碎步</b>（学习率小），避免在最优解附近来回震荡。学习率调度就是控制这个"步伐大小"的策略。</p>

<div class="kg-img-wrap">
  <picture class="kg-picture"><source srcset="reading-notes/assets/knowledge-lr-schedule.webp" type="image/webp"><img src="reading-notes/assets/knowledge-lr-schedule-thumb.webp" data-full="reading-notes/assets/knowledge-lr-schedule.webp" alt="学习率调度策略对比" class="kg-img kg-img-lazy" loading="lazy" decoding="async"></picture>
  <div class="kg-caption">图：四种主流学习率调度策略——StepDecay直降、Exponential平滑、Cosine余弦退火、Warmup预热</div>
</div>

<h4>15.1 为什么需要学习率调度？</h4>

<table>
<thead><tr><th>问题</th><th>现象</th><th>调度解决方式</th></tr></thead>
<tbody>
<tr><td><b>学习率太大</b></td><td>在最优解附近剧烈震荡，无法收敛</td><td>逐步降低学习率，让参数"沉淀"</td></tr>
<tr><td><b>学习率太小</b></td><td>收敛极慢，卡在局部最优</td><td>初期大学习率快速探索</td></tr>
<tr><td><b>不同训练阶段需求不同</b></td><td>前期要"探索"，后期要"精修"</td><td>自适应调整策略</td></tr>
</tbody>
</table>

<h4>15.2 四大调度策略详解</h4>

<div class="kg-step">
  <strong>Step Decay（阶梯衰减）</strong>——每过N个epoch，学习率乘一个系数（如0.1）。<br>
  公式：lr = lr₀ × γ^(epoch // step_size)<br>
  优点：简单直观，大多数框架内置。缺点：突变点可能恰好打断收敛过程。
</div>

<div class="kg-step">
  <strong>Exponential Decay（指数衰减）</strong>——学习率连续指数下降。<br>
  公式：lr = lr₀ × e^(-k·epoch)<br>
  优点：平滑稳定，没有突变点。缺点：衰减速度固定，不够灵活。
</div>

<div class="kg-step">
  <strong>Cosine Annealing（余弦退火）</strong>——学习率按余弦曲线从大到小再到大周期性变化。<br>
  公式：lr = lr_min + 0.5×(lr_max-lr_min)×(1+cos(π·epoch/T_max))<br>
  优点：无需调参，端到端训练友好。周期性重启还能帮助跳出局部最优。
</div>

<div class="kg-step">
  <strong>Warmup + Cosine（预热+余弦）</strong>——训练前N步线性升温，再接入Cosine退火。<br>
  优点：防止训练初期大学习率导致的梯度爆炸/不稳定。Transformer训练的标配。
</div>

<h4>15.3 动态演示：学习率随训练变化</h4>
<div class="kg-card" style="margin-top:16px;">
    <div id="echarts-lr-demo-div" style="width:100%;max-width:700px;height:350px;margin:0 auto;border-radius:10px;overflow:hidden;"></div>
  <div style="text-align:center;padding:4px 0;font-size:12px;color:var(--text-muted);">学习率调度策略 · Step/Cosine/Warmup</div>
</div>

<div class="kg-step">
  <strong>💡 实战建议</strong>：图像恢复任务常用Cosine + Warmup（预热5%的steps）。学习率峰值一般设1e-4到1e-3，最小值设峰值的1/100。Step Decay适合有明确epoch预算的传统任务。
</div>

</div></div>

<div class="kg-section" id="kg-s16">
<div class="kg-accordion-header" onclick="kgToggleAcc(this)"><h3>十六、归一化——让每一层的"脾气"变稳定</h3><span class="kg-acc-icon">▼</span></div>
<div class="kg-accordion-body">

<p>深度神经网络训练时，<b>每一层的输入分布都在不断变化</b>——前一层的参数更新了，后一层的输入分布就跟着变了。这就像在跑步机上追一个移动的目标，网络被迫不断适应"新环境"。归一化就是把这个"移动的目标"固定住。</p>

<div class="kg-img-wrap">
  <picture class="kg-picture"><source srcset="reading-notes/assets/knowledge-normalization.webp" type="image/webp"><img src="reading-notes/assets/knowledge-normalization-thumb.webp" data-full="reading-notes/assets/knowledge-normalization.webp" alt="归一化方法对比" class="kg-img kg-img-lazy" loading="lazy" decoding="async"></picture>
  <div class="kg-caption">图：BatchNorm解决Internal Covariate Shift问题，以及四种归一化方法沿不同维度操作</div>
</div>

<h4>16.1 Internal Covariate Shift（内部协变量偏移）</h4>

<div class="kg-step">
  <strong>问题本质</strong>：第L层的参数更新 → 第L+1层的输入分布改变 → 第L+1层被迫重新适应 → 连锁反应导致训练缓慢且不稳定。<br>
  <strong>类比</strong>：就像教一个学生做数学题，每教一步就把题目改一遍——学生永远在做"新题"，无法积累学习经验。
</div>

<h4>16.2 BatchNorm：最经典的解决方案</h4>

<div class="kg-step">
  <strong>核心操作（每个channel独立）</strong>：<br>
  1. 计算当前batch的均值 μ_B 和方差 σ²_B<br>
  2. 标准化：x̂ = (x - μ_B) / √(σ²_B + ε)<br>
  3. 缩放平移：y = γ · x̂ + β（γ和β是可学习参数）<br><br>
  <strong>关键设计</strong>：γ和β让网络自己决定"归一化到什么程度"——有时完全归一化反而不好，允许网络恢复原始分布。
</div>

<h4>16.3 四种归一化方法对比</h4>

<table>
<thead><tr><th>方法</th><th>归一化维度</th><th>适用场景</th><th>特点</th></tr></thead>
<tbody>
<tr><td><b>BatchNorm</b></td><td>沿Batch维度（N）</td><td>CNN（batch≥16）</td><td>速度快，效果好，但小batch时统计量不准</td></tr>
<tr><td><b>LayerNorm</b></td><td>沿Channel维度（C+H+W）</td><td>Transformer、RNN</td><td>不受batch大小影响，序列建模标配</td></tr>
<tr><td><b>InstanceNorm</b></td><td>每个样本每个通道独立</td><td>风格迁移</td><td>去除内容保留风格，计算简单</td></tr>
<tr><td><b>GroupNorm</b></td><td>通道分组归一化</td><td>目标检测、小batch</td><td>BatchNorm和LayerNorm的折中，分组灵活</td></tr>
</tbody>
</table>

<h4>16.4 动态演示：BatchNorm如何稳定分布</h4>

  <strong>🎯 选型指南</strong>：CNN + batch够大 → BatchNorm；Transformer/序列 → LayerNorm；风格迁移 → InstanceNorm；小batch检测 → GroupNorm。BatchNorm训练时用batch统计量，推理时用滑动平均——这也是为什么BN层有train/eval两种模式。
</div>

<div class="kg-section" id="kg-s17">
<div class="kg-accordion-header" onclick="kgToggleAcc(this)"><h3>十七、去雨评价体系——如何判断"雨去干净了"？</h3><span class="kg-acc-icon">▼</span></div>
<div class="kg-accordion-body">

<p>一个去雨算法好不好，不能只靠"看着舒服"来判断——我们需要量化的评价指标。本章介绍去雨领域最常用的五个评价指标，以及为什么需要多指标综合评估。</p>

<div class="kg-img-wrap">
  <picture class="kg-picture"><source srcset="reading-notes/assets/knowledge-eval-metrics.webp" type="image/webp"><img src="reading-notes/assets/knowledge-eval-metrics-thumb.webp" data-full="reading-notes/assets/knowledge-eval-metrics.webp" alt="去雨评价指标五维雷达图" class="kg-img kg-img-lazy" loading="lazy" decoding="async"></picture>
  <div class="kg-caption">图：五维评估雷达图——PSNR、SSIM、LPIPS、TIME、Params综合衡量去雨效果</div>
</div>

<h4>17.1 五大评价指标</h4>

<table>
<thead><tr><th>指标</th><th>全称</th><th>含义</th><th>越好越？</th><th>典型优值</th></tr></thead>
<tbody>
<tr><td><b>PSNR</b></td><td>峰值信噪比</td><td>基于MSE的对数度量，衡量像素级重建质量</td><td>越高越好</td><td>大于30dB为优</td></tr>
<tr><td><b>SSIM</b></td><td>结构相似性</td><td>综合考虑亮度、对比度、结构三维度</td><td>越高越好</td><td>接近1为优</td></tr>
<tr><td><b>LPIPS</b></td><td>学习感知图像块相似度</td><td>基于深度网络特征衡量感知差异</td><td>越低越好</td><td>接近0为优</td></tr>
<tr><td><b>TIME</b></td><td>推理时间</td><td>处理一张图所需的毫秒数</td><td>越低越好</td><td>越小越快</td></tr>
<tr><td><b>Params</b></td><td>参数量</td><td>模型的可训练参数总数</td><td>越低越好</td><td>越小越轻</td></tr>
</tbody>
</table>

<div class="kg-card" style="margin-top:16px;">
  <h4>📊 模型综合能力雷达图（交互式）</h4>
  <div id="echarts-rain-radar" style="width:100%;height:400px;"></div>
  <div class="kg-caption">图：去雨模型在 PSNR、SSIM、LPIPS、推理速度、参数量 五个维度的综合对比<br>💡 点击图例可切换显示/隐藏模型，拖动旋转查看不同角度</div>
</div>

<h4>17.2 各指标详解</h4>

<div class="kg-step">
  <strong>PSNR（峰值信噪比）</strong>：基于像素级均方误差(MSE)的对数度量。公式核心是 PSNR = 10·log10(MAX的平方 / MSE)。PSNR越高，说明去雨图和干净图的像素越接近。通常PSNR > 30dB就算不错，> 35dB算优秀。但PSNR只看像素——两张图可能PSNR很高但看起来模糊。
</div>

<div class="kg-step">
  <strong>SSIM（结构相似性）</strong>：不只是看像素差异，还看<b>结构</b>是否保持。SSIM从三个维度评估：亮度(luminance)、对比度(contrast)、结构(structure)。值域[0,1]，越接近1越好。SSIM = 0.95 意味着结构保持得很好。比如去雨后边缘是否锐利、纹理是否清晰，SSIM比PSNR更能反映。
</div>

<div class="kg-step">
  <strong>LPIPS（学习感知图像块相似度）</strong>：用预训练的深度网络（如VGG）提取特征，在特征空间计算差异。LPIPS = 0 表示两张图在感知上完全相同。LPIPS越低越好。它衡量的是"人眼看起来像不像"，而不是"像素差多少"。两张PSNR相同的图，LPIPS可能差很多——因为人眼对某些特征更敏感。
</div>

<div class="kg-step">
  <strong>TIME（推理时间）</strong>：处理一张测试图所需的毫秒数。衡量模型的<b>速度</b>。越低越好。实际部署中，速度和精度往往需要权衡——太慢的模型无法实时处理视频。
</div>

<div class="kg-step">
  <strong>Params（参数量）</strong>：模型的可训练参数总数。衡量模型的<b>大小</b>和轻量化程度。越低越好。参数少的模型不仅推理快，还更不容易过拟合。RQ网络的一个大优势就是参数量比实值网络少约4倍。
</div>

<h4>17.3 为什么需要多指标？</h4>

<div class="kg-compare">
  <div class="kg-card">
    <h4>单一指标的盲区</h4>
    <p>· PSNR只看像素——可能像素差不多但结构模糊<br>· SSIM只看结构——可能结构对了但颜色偏了<br>· LPIPS只看感知——可能看着像但纹理细节丢了<br>· 单看TIME——可能很快但效果差<br>· 单看Params——可能很小但精度不够</p>
  </div>
  <div class="kg-card">
    <h4>多指标的互补</h4>
    <p>· PSNR管"像素准不准"<br>· SSIM管"结构对不对"<br>· LPIPS管"看着像不像"<br>· TIME管"跑得快不快"<br>· Params管"模型轻不轻"<br>五个维度互相补盲，才能全面评估</p>
  </div>
</div>

<div class="kg-step">
  <strong>五维雷达图理念</strong>：把PSNR、SSIM、LPIPS、TIME、Params五个指标画在一张雷达图上。理想的去雨模型应该在所有维度上都"凸出"——PSNR/SSIM高（质量好）、LPIPS低（感知好）、TIME低（速度快）、Params低（模型轻）。但现实中往往是"跷跷板"——质量高的模型往往又大又慢。RQ-D2UNet的目标就是在这个跷跷板上找到最佳平衡点。
</div>

<div class="kg-step">
  <strong>RQ-D2UNet的评估优势</strong>：得益于RQ的参数效率（4倍减少）和双分支架构的精准去雨能力，RQ-D2UNet在五维评估中表现出色——<b>同时提升PSNR和SSIM</b>（去雨质量好），<b>降低Params</b>（模型轻量化），同时保持合理的TIME（推理速度可接受）。这正是"超复数+双分支"架构的价值所在：不是在单一指标上刷分，而是在质量-速度-大小的三角中实现帕累托最优。
</div>

</div></div>

<p>人在看一幅画时，不会平均地给每个像素分配精力——注意力会集中在重要区域（人脸、文字、异常物体）。<b>自注意力机制让神经网络学会了"看哪里"</b>。本章追踪自注意力从NLP（语言）到CV（视觉）的进化历程。</p>

<div class="kg-step">
  <strong>核心公式：Scaled Dot-Product Attention</strong>。Attention(Q,K,V) = softmax(QK^T / sqrt(d_k)) x V。其中Q（Query，查询）、K（Key，键）、V（Value，值）分别代表"我想找什么"、"每个位置有什么特征"、"提取什么信息"。除以sqrt(d_k)是为了防止点积过大导致softmax梯度消失。就像一个人问"这幅画里哪里有人脸？"（Q），每个像素回答"我这里像不像人脸"（K），然后把像人脸的像素信息提取出来（V）。
</div>

<div class="kg-step">
  <strong>多头注意力 (Multi-Head Attention)</strong>——h个头并行计算不同子空间的注意力，然后将结果拼接后做线性变换。每个头关注不同类型的依赖关系（有的关注水平边缘，有的关注颜色对比，有的关注纹理模式）。就像一个专家组——每个专家只负责看一种特征，最后综合所有专家的意见。
</div>

<div class="kg-step">
  <strong>从NLP到CV的三个关键适配</strong>：
  <br>· <b>窗口注意力 (Window Self-Attention, Swin)</b>：将图像划分为MxM不重叠窗口，只在窗口内计算注意力。复杂度从O(N^2)降到O(M^2 x HW)。就像把教室里的学生分成小组，每组内部讨论，而不是全班两两讨论。
  <br>· <b>转置注意力 (Transposed Attention, Restormer/MDTA)</b>：在通道维度而非空间维度计算注意力，复杂度O(C^2 x HW)。当通道数C远小于像素数HW时，效率大幅提升。就像不看"每个像素之间的关系"，而是看"每个通道之间的关系"。
  <br>· <b>稀疏注意力 (Sparse Top-K, DRSformer)</b>：对注意力矩阵做mask，每行只保留最大的K个值，其余置零，复杂度O(NK)。就像每个人只和最相关的K个"邻居"交流，而不是和所有人都交流。
</div>

<div class="kg-step">
  <strong>RQ-SCformer在RQ域中的自注意力实现</strong>——跨特征维自关注，在RQ（还原四元数）的四个分量维度（实部、i、j、k）上建立依赖。RQ的乘法可交换性使得注意力计算更加灵活。就像让四个"色彩通道专家"互相交流，共同决定哪些信息最重要。
</div>

<div class="kg-step">
  <strong>架构演进路线</strong>：简单编解码器（基础起点） -&gt; U-Net（加入跳跃连接，浅层细节直达深层） -&gt; 多阶段（MPRNet，渐进式恢复） -&gt; Transformer混合（Uformer，注意力+卷积融合）。每一步演进都在解决上一代的核心痛点：信息丢失 -&gt; 细节模糊 -&gt; 语义不足 -&gt; 长距离依赖弱。
</div>

<div class="kg-step">
  <strong>跨窗口依赖：Swin的移位窗口策略</strong>——相邻层的窗口偏移半个窗口大小（比如从0偏移到M/2），使得原本不在同一窗口的像素在下一层变成"邻居"。就像国际象棋中棋子的移动——上一轮不相邻的两个格子，下一轮可能就挨在一起了。这样既保持了窗口注意力的效率，又跨越了窗口边界的信息隔离。
</div>

<h4>自注意力复杂度对比</h4>

<table>
<thead><tr><th>注意力类型</th><th>复杂度</th><th>代表架构</th><th>核心策略</th><th>类比</th></tr></thead>
<tbody>
<tr><td><b>全局注意力</b></td><td>O(N^2)</td><td>ViT/原始Transformer</td><td>所有token两两计算</td><td>全班两两讨论，N个人要N^2次</td></tr>
<tr><td><b>窗口注意力</b></td><td>O(M^2 x HW)</td><td>Swin Transformer</td><td>窗口内计算+移位窗口</td><td>分组讨论+下一轮换座位</td></tr>
<tr><td><b>转置注意力</b></td><td>O(C^2 x HW)</td><td>Restormer</td><td>通道维度计算注意力</td><td>不问"谁和谁是邻居"，问"哪些通道相关"</td></tr>
<tr><td><b>稀疏Top-K</b></td><td>O(NK)</td><td>DRSformer</td><td>每行只保留K个最大值</td><td>每个人只和最相关的K个朋友交流</td></tr>

<div class="kg-section" id="kg-s19">
<div class="kg-accordion-header" onclick="kgToggleAcc(this)"><h3>十九、SE注意力与特征聚合——让网络学会"筛选"和"融合"</h3><span class="kg-acc-icon">▼</span></div>
<div class="kg-accordion-body">

<div class="kg-img-wrap">
  <picture class="kg-picture"><source srcset="reading-notes/assets/knowledge-se-attention-fusion.webp" type="image/webp"><img src="reading-notes/assets/knowledge-se-attention-fusion-thumb.webp" data-full="reading-notes/assets/knowledge-se-attention-fusion.webp" alt="SE注意力机制与特征聚合策略" class="kg-img kg-img-lazy" loading="lazy" decoding="async"></picture>
  <div class="kg-caption">图：SE注意力与特征聚合——让网络学会筛选重要通道、融合多尺度信息</div>
</div>

<p>听交响乐时，你会在某些乐段不自觉地"放大音量"（注意力集中），在其他乐段"降低音量"——<b>SE模块就是让CNN学会"调节每个通道的音量"</b>。本章从通道注意力出发，延伸到特征聚合策略和多尺度金字塔结构。</p>

<div class="kg-step">
  <strong>SE-Net三步走</strong>：
  <br>· <b>Squeeze（压缩）</b>：全局平均池化（GAP），将每个通道的CxHxW特征图压缩为Cx1x1的一个数——就像把一整首歌的每个音轨压缩成一个"响度值"。
  <br>· <b>Excitation（激励）</b>：两层全连接网络（降维 -&gt; ReLU -&gt; 升维 -&gt; Sigmoid），生成每个通道的权重（0到1之间）——就像一个"音量调节器"，决定每个通道该放大还是缩小。
  <br>· <b>Scale（缩放）</b>：通道权重与原特征图逐通道相乘——重要通道被放大，不重要通道被抑制。
</div>

<div class="kg-step">
  <strong>SE变体</strong>：
  <br>· <b>CBAM</b>（Convolutional Block Attention Module）：通道注意力 + 空间注意力串联。先回答"哪些通道重要"，再回答"哪些空间位置重要"。
  <br>· <b>ECA</b>（Efficient Channel Attention）：用1D卷积替代全连接层，参数更少，速度更快。就像用更简单的"滑杆"替代复杂的"调音台"。
  <br>· <b>SKNet</b>（Selective Kernel Network）：多尺度卷积核选择——网络自己决定该用3x3还是5x5的卷积核。就像一个摄影师根据场景自动选择广角还是长焦镜头。
</div>

<h4>特征聚合三种策略对比</h4>

<div class="kg-compare">
  <div class="kg-card">
    <h4>求和 (Sum)</h4>
    <p>F_out = F1 + F2<br>简单高效，ResNet残差连接的标准做法。两路特征逐像素相加。像两杯水倒进同一个杯子——混合后分不出你我。</p>
  </div>
  <div class="kg-card">
    <h4>拼接 (Concat)</h4>
    <p>[F1; F2] -&gt; Conv降维<br>保留完整信息，DenseNet和U-Net跳跃连接的做法。两路特征在通道维度拼接，再用卷积降维。像两叠文件并排放在一起——信息更全，但需要整理。</p>
  </div>
  <div class="kg-card">
    <h4>注意力融合</h4>
    <p>a(g)*F1 + (1-a(g))*F2<br>门控求和，自适应学习权重。网络自己决定两路各占多少比例。像一个混音师——根据歌曲需要实时调节两个音轨的比例。</p>
  </div>
</div>

<div class="kg-step">
  <strong>多尺度金字塔结构</strong>：
  <br>· <b>FPN</b>（特征金字塔网络）：自顶向下（深层语义）+ 横向连接（浅层细节），构建多尺度特征金字塔。深层特征分辨率低但语义强（"知道是什么"），浅层特征分辨率高但语义弱（"知道在哪里"），FPN让两者互补。
  <br>· <b>SPP</b>（空间金字塔池化）：对同一特征图做不同尺度的池化（1x1, 2x2, 4x4），然后拼接。就像从近、中、远三个距离同时观察同一个物体。
</div>

<div class="kg-step">
  <strong>递归扩张卷积 (Recursive Dilation)</strong>——在卷积核的元素之间插入"空洞"，扩大感受野但不增加参数量。扩张率指数递增（1, 2, 4, 8），每层看到的范围翻倍。就像在放大镜上加了一圈圈的外框——不用更大的镜片，也能看到更大的范围。经典案例：DeepLab中的空洞空间金字塔池化（ASPP）。
</div>

<div class="kg-step">
  <strong>多任务学习</strong>——共享底层特征提取器 + 任务特化头。总损失 = 各任务损失的加权和：L_total = sum(w_i x L_task_i)。就像一个人先学通用的"基础知识"，然后分专业方向深入——数学好的同学学统计和金融都更容易。共享底层减少参数，任务特化头保证每个任务都能被很好地解决。
</div>

<div class="kg-step">
  <strong>稀疏性在Transformer中的应用</strong>——除了通道注意力中的Top-K mask，还有结构化稀疏（固定模式的稀疏，如每隔一个位置计算一次）、随机稀疏（随机采样位置）和可学习稀疏（网络自己学习哪些位置该保留）。稀疏性是控制注意力计算成本的关键手段。
</div>

<div class="kg-section" id="kg-s20">
<div class="kg-accordion-header" onclick="kgToggleAcc(this)"><h3>二十、低频基与高频细节——用"双层视角"构造CNN去雨网络</h3><span class="kg-acc-icon">▼</span></div>
<div class="kg-accordion-body">

<div class="kg-img-wrap">
  <picture class="kg-picture"><source srcset="reading-notes/assets/knowledge-lowhigh-freq-cnn.webp" type="image/webp"><img src="reading-notes/assets/knowledge-lowhigh-freq-cnn-thumb.webp" data-full="reading-notes/assets/knowledge-lowhigh-freq-cnn.webp" alt="低频基与高频细节双层CNN构造" class="kg-img kg-img-lazy" loading="lazy" decoding="async"></picture>
  <div class="kg-caption">图：低频基+高频细节——双层视角构造CNN去雨网络</div>
</div>

<p>看一幅画时，你先看到"大致场景"——山在哪里、天什么颜色（<b>低频信息</b>），然后才注意到"细节纹理"——树叶的脉络、水面的波纹（<b>高频信息</b>）。<b>双层优化就是让CNN分工协作：一支队伍管"大局"，另一支队伍管"细节"</b>。</p>

<div class="kg-step">
  <strong>数学基础：图像分解 I = I_base + I_detail</strong>：
  <br>· <b>低频基 I_base</b>：大面积平滑区域、整体结构、颜色一致性。就像一幅画的"底稿"——大致轮廓和色块。
  <br>· <b>高频细节 I_detail</b>：边缘、纹理、锐利变化。就像一幅画的"精修"——轮廓线、细节描绘、高光点缀。
</div>

<div class="kg-step">
  <strong>三种分解方法</strong>：
  <br>· <b>高斯/拉普拉斯金字塔</b>：对图像做低通滤波+下采样得到低频层，原图减去低频层上采样的结果得到高频层。就像不断把照片缩小（模糊）得到"越来越粗的轮廓"，每层的差值就是细节。
  <br>· <b>小波变换</b>：一次变换产生四个子带——LL（低频近似，即低频基）+ LH/HL/HH（水平/垂直/对角方向的高频细节）。就像用四把不同的"筛子"同时过滤图像，每个筛子只保留特定方向的细节。
  <br>· <b>FFT频域滤波</b>：傅里叶变换到频域，用低通/高通滤波器分离低频和高频，再逆变换回空间域。就像在"频率世界"里用一把剪刀，把低音和高音分开。
</div>

<div class="kg-step">
  <strong>如何通过双层构造CNN</strong>：
  <br>· <b>低频分支</b>：深层网络、大感受野、允许下采样操作，捕获全局结构和上下文语义（对应U-Net的深层特征）。像用"望远镜"看大局。
  <br>· <b>高频分支</b>：保持原始分辨率、小卷积核3x3，恢复局部细节和锐利边缘（对应U-Net的浅层特征）。像用"放大镜"看细节。
  <br>· <b>融合策略</b>：两分支输出相加（简单直接）或注意力加权融合（自适应权重）。
</div>

<div class="kg-step">
  <strong>联合双层优化 (Joint Bi-layer Optimization)</strong>：同时优化低频和高频两层的重建：
  <br>min L(I_base + I_detail, I_gt) + lambda_base x R_base + lambda_detail x R_detail
  <br>两层通过 <b>I = I_base + I_detail</b> 的等式约束耦合——低频管结构、高频管细节，两者加起来必须还原出完整的干净图像。联合优化确保两层相互补充而非互相干扰。
</div>

<div class="kg-step">
  <strong>GMM在建模中的应用</strong>——用高斯混合模型（GMM）建模图像patch的像素级统计分布。结合贝叶斯框架，在已知观测（退化图像）的情况下，对干净图像做最优估计。GMM的多个分量分别对应不同的图像结构（平滑区域、边缘区域、纹理区域等），每种结构用不同的高斯分布描述。
</div>

<div class="kg-step">
  <strong>MPRNet的本质就是这一思想</strong>——前两个阶段允许下采样，学习上下文语义特征（<b>低频基</b>，管大局）；第三个阶段在原始分辨率操作，恢复空间细节（<b>高频细节</b>，管精修）。三个阶段渐进式地从"粗到细"恢复图像，正是双层视角的深度学习实现。
</div>

<h4>双分支对比</h4>

<table>
<thead><tr><th>特性</th><th>低频分支（管大局）</th><th>高频分支（管细节）</th></tr></thead>
<tbody>
<tr><td><b>网络深度</b></td><td>深层网络</td><td>浅层或中等深度</td></tr>
<tr><td><b>分辨率</b></td><td>允许下采样（降低分辨率）</td><td>保持原始分辨率</td></tr>
<tr><td><b>感受野</b></td><td>大（全局上下文）</td><td>小（局部细节）</td></tr>
<tr><td><b>卷积核</b></td><td>大卷积核或空洞卷积</td><td>小卷积核3x3</td></tr>
<tr><td><b>捕获信息</b></td><td>结构、布局、颜色一致性</td><td>边缘、纹理、锐利变化</td></tr>
<tr><td><b>对应U-Net</b></td><td>深层特征（bottleneck附近）</td><td>浅层特征（输入附近）</td></tr>
<tr><td><b>类比</b></td><td>望远镜——看大局</td><td>放大镜——看细节</td></tr>
</tbody>
</table>

</div></div>

<div class="kg-section" id="kg-s21">
<div class="kg-accordion-header" onclick="kgToggleAcc(this)"><h3>二十一、多阶段多尺度去噪网络——MPRNet的"渐进式恢复"智慧</h3><span class="kg-acc-icon">▼</span></div>
<div class="kg-accordion-body">

<div class="kg-img-wrap">
  <picture class="kg-picture"><source srcset="reading-notes/assets/knowledge-mprnet-multiscale.webp" type="image/webp"><img src="reading-notes/assets/knowledge-mprnet-multiscale-thumb.webp" data-full="reading-notes/assets/knowledge-mprnet-multiscale.webp" alt="MPRNet多阶段多尺度去噪网络" class="kg-img kg-img-lazy" loading="lazy" decoding="async"></picture>
  <div class="kg-caption">图：MPRNet——三阶段渐进式恢复，从粗到细修复退化图像</div>
</div>

<p>修复一幅古画，修复师不会一蹴而就——先整体规划（确定画面布局），再中层细化（恢复色彩和主要线条），最后精细打磨（修复微小裂痕）。<b>MPRNet就是用三个阶段"渐进式恢复"</b>，每一步都在上一步的基础上更精细地修复。</p>

<div class="kg-step">
  <strong>MPRNet三阶段架构 (CVPR 2021)</strong>：
  <br>· <b>Stage 1 &amp; 2</b>：编码器-解码器学习上下文语义特征，允许下采样降低分辨率，专注于恢复整体结构和大面积退化。像画作的"打底"和"上色"阶段。
  <br>· <b>Stage 3</b>：在原始分辨率操作，不进行下采样，专注于恢复空间细节和微妙纹理。像画作的"精修"阶段。
  <br>· <b>关键设计</b>：每个阶段都接收原始退化图像作为输入（而不只是上一阶段的输出），确保原始信息不会在传递中丢失。
</div>

<div class="kg-step">
  <strong>关键创新模块</strong>：
  <br>· <b>CFP（互补特征处理）</b>：每阶段内部有两个并行分支——编码器-解码器分支（捕获上下文语义）和单尺度高分辨率分支（保留空间细节）。两分支互补：一个看大局，一个看细节。
  <br>· <b>SAM（监督注意力模块）</b>：将当前阶段恢复结果与GT对比，产生监督差异图 -&gt; 生成attention map -&gt; 抑制无用/冗余特征 -&gt; 仅传播有用特征到下一阶段。就像老师批改作业后标注"这些地方还没修好"，下一阶段优先处理。
  <br>· <b>CSFF（跨阶段特征融合）</b>：横向连接在不同阶段之间传递信息，让浅层（细节）和深层（语义）特征在各阶段都能被利用。
</div>

<div class="kg-step">
  <strong>特征聚合在MPRNet中的体现</strong>——CFP模块内的编码器-解码器分支（上下文特征）与单尺度分支（空间细节）互补融合，通过求和或拼接实现。阶段间的SAM则通过注意力机制选择性地传播信息——有用的传下去，没用的就丢弃。两层聚合确保信息在空间维度（分辨率）和语义维度（深度）上都被充分利用。
</div>

<div class="kg-step">
  <strong>多尺度金字塔结构 (FPN)</strong>——自顶向下上采样 + 横向连接，构建特征金字塔。深层特征（低分辨率但语义强）通过上采样与浅层特征（高分辨率但语义弱）融合。各层级的语义强弱不同，融合后每层都能同时拥有"大局观"和"细节感"。
</div>

<div class="kg-step">
  <strong>跨尺度跨窗口依赖</strong>：
  <br>· <b>移位窗口 (Swin)</b>：相邻层窗口偏移半个窗口大小，打破窗口边界，实现跨窗口信息交互。
  <br>· <b>可变形注意力 (Deformable Attention)</b>：网络自己学习"该关注哪些位置"——采样点不再固定为规则网格，而是根据内容自适应调整。就像一个灵活的观察者——哪里有重要信息就往哪里看，而不是机械地按固定顺序扫描。
</div>

<div class="kg-step">
  <strong>训练策略</strong>：每阶段都有中间监督（intermediate supervision），用Charbonnier损失函数（比MSE更平滑的变体，对异常值更鲁棒）。总损失 = 各阶段损失之和。中间监督确保每个阶段都能独立学到有意义的特征，而不是完全依赖下一阶段来"纠错"。
</div>

<div class="kg-step">
  <strong>其他代表性架构</strong>：
  <br>· <b>Restormer</b>：用MDTA（多维度转置注意力）在通道维度计算注意力，高效且有效。
  <br>· <b>DRSformer</b>：用DRSA（密集冗余稀疏注意力）做Top-K稀疏mask，进一步降低计算量。
  <br>· <b>RQ-D2UNet</b>：超复数双分支架构，用RQ表示增强特征表达，双分支分别处理雨纹和背景。
</div>

<div class="kg-module-guide kg-guide-rq">
  <div class="kg-guide-title">🔢 第四模块：超复数/RQ专项领域</div>
  <div class="kg-guide-desc">这是进阶内容——把神经网络从实数域"升维"到超复数域。约化双四元数（RQ）用4个分量同时编码更多信息，让网络用更少的参数表达更丰富的特征。理解它需要前面的所有基础，但回报是独特的视角和更高效的模型。</div>
</div>

<div class="kg-section" id="kg-s22">
<div class="kg-spark">超复数不是"为了复杂而复杂"。在图像处理中，一个像素有RGB三个通道，天然就是一个3维向量。四元数用4个分量表示，既包含了颜色信息，又额外获得了一个"结构维度"——升维有时不是负担，而是更自然的表达方式。</div>

<div class="kg-accordion-header" onclick="kgToggleAcc(this)"><h3>二十二、超复数进化之路——从实数到约化双四元数</h3><span class="kg-acc-icon">▼</span></div>
<div class="kg-accordion-body">

<p>要理解约化双四元数（Reduced Quaternion, 简称RQ），我们先来一场"数系进化之旅"。数学家们就像在搭建积木——每发现一个新数系，就多一个维度的"自由度"，能描述的几何空间也越丰富。</p>

<div class="kg-img-wrap">
  <picture class="kg-picture"><source srcset="reading-notes/assets/knowledge-hypercomplex-evolution.webp" type="image/webp"><img src="reading-notes/assets/knowledge-hypercomplex-evolution-thumb.webp" data-full="reading-notes/assets/knowledge-hypercomplex-evolution.webp" alt="数系进化：实数到约化双四元数" class="kg-img kg-img-lazy" loading="lazy" decoding="async"></picture>
  <div class="kg-caption">图：数系进化树——从1维实数到4维约化双四元数，每一步都扩展了几何表达能力</div>
</div>

<div class="kg-step">
  <strong>1维：实数 (Real Numbers)</strong>——一条直线上的点。只能表示大小，比如温度是25度、长度是3米。实数是所有数系的基石，但它无法描述"旋转"。
</div>

<div class="kg-step">
  <strong>2维：复数 (Complex Numbers)</strong>——一个平面上的点。引入了虚数单位 i，满足 i的平方等于-1。复数天然描述欧几里得平面上的旋转：乘以 i 就是逆时针旋转90度。就像钟表指针在表盘上转动——完美、优雅，但只能在一个平面里转。
</div>

<div class="kg-step">
  <strong>4维：四元数 (Quaternions)</strong>——3D空间中的旋转利器。哈密顿在1843年发明的 i、j、k 三个虚数单位，满足 i的平方=j的平方=k的平方=-1。四元数能优雅地描述三维旋转，是3D游戏引擎和机器人学的核心工具。但有一个致命缺点：<b>乘法不可交换</b>——先乘 i 再乘 j，和先乘 j 再乘 i，结果不一样！
</div>

<div class="kg-step">
  <strong>4维：约化双四元数 (Reduced Quaternion, RQ)</strong>——本文主角。同样是4维，但 i的平方=k的平方=-1（椭圆虚数），而 j的平方=+1（双曲虚数）。关键是：<b>乘法可交换</b>！这让它能像复数一样支持卷积定理和傅里叶变换，同时又能处理3D空间的多通道信号。
</div>

<div class="kg-compare">
  <div class="kg-card">
    <h4>实数 = 1条线</h4>
    <p>只能往前走或往后退，不能转弯。就像火车只能沿铁轨前进。</p>
  </div>
  <div class="kg-card">
    <h4>复数 = 1个平面</h4>
    <p>可以在平面上任意方向移动和旋转。就像汽车在停车场里自由转向。</p>
  </div>
  <div class="kg-card">
    <h4>四元数 = 3D空间</h4>
    <p>能在三维空间中任意旋转。就像无人机在天空中翻滚。但操作顺序很重要——先翻滚再俯仰，和先俯仰再翻滚，结果不同！</p>
  </div>
  <div class="kg-card">
    <h4>RQ = 欧几里得+双曲混合空间</h4>
    <p>既有振荡（i，像钟摆）又有增长（j，像弹弓）的混合空间。操作顺序无所谓，怎么操作都一样——这就是"可交换"的威力。</p>
  </div>
</div>

<table>
<thead><tr><th>数系</th><th>维度</th><th>虚数单位平方</th><th>乘法可交换？</th><th>几何空间</th><th>卷积定理成立？</th></tr></thead>
<tbody>
<tr><td><b>实数 (R)</b></td><td>1维</td><td>无虚数</td><td>是</td><td>数轴（直线）</td><td>是</td></tr>
<tr><td><b>复数 (C)</b></td><td>2维</td><td>i的平方=-1</td><td>是</td><td>欧几里得平面</td><td>是</td></tr>
<tr><td><b>四元数 (H)</b></td><td>4维</td><td>i的平方=j的平方=k的平方=-1</td><td><b>否</b></td><td>3D旋转空间</td><td><b>否</b></td></tr>
<tr><td><b>约化双四元数 (RQ)</b></td><td>4维</td><td>i的平方=k的平方=-1, j的平方=+1</td><td><b>是</b></td><td>欧几里得+双曲混合</td><td><b>是</b></td></tr>
</tbody>
</table>

<div class="kg-step">
  <strong>为什么要发明RQ？</strong>因为四元数虽然能处理3D旋转，但它的<b>乘法不可交换</b>导致一个严重问题：卷积定理不成立！卷积定理是信号处理的基石——它说"空间域卷积等于频域乘积"。没有卷积定理，就无法在频域高效计算卷积，也无法定义四元数傅里叶变换来做频域分析。RQ通过修改 j 的平方为+1，让乘法重新变得可交换，从而恢复了卷积定理——这就像是给四元数"松了绑"，让它既能处理多维信号，又能享受频域分析的全部好处。
</div>

<div class="kg-step">
  <strong>本章核心</strong>：实数(1维)→复数(2维)→四元数(4维但不可交换)→约化双四元数RQ(4维且可交换)。RQ的精髓在于：j的平方=+1这个"小小改动"，让乘法恢复可交换性，从而让卷积定理重新成立，为超复数神经网络铺平了道路。
</div>

</div></div>
<div class="kg-section" id="kg-s23">
<div class="kg-accordion-header" onclick="kgToggleAcc(this)"><h3>二十三、RQ的数学本质——乘法规则与几何空间</h3><span class="kg-acc-icon">▼</span></div>
<div class="kg-accordion-body">

<p>上一章我们知道了RQ"是什么"，这一章我们来拆解它的"内部构造"——乘法规则、共轭、模长，以及它所对应的几何空间。理解了这些，才能真正明白RQ为什么能同时处理"振荡信号"和"指数增长信号"。</p>

<div class="kg-img-wrap">
  <picture class="kg-picture"><source srcset="reading-notes/assets/knowledge-rq-math.webp" type="image/webp"><img src="reading-notes/assets/knowledge-rq-math-thumb.webp" data-full="reading-notes/assets/knowledge-rq-math.webp" alt="RQ数学本质：乘法规则与几何空间" class="kg-img kg-img-lazy" loading="lazy" decoding="async"></picture>
  <div class="kg-caption">图：RQ的四个分量对应不同的几何空间——i和k对应欧几里得振荡，j对应双曲增长</div>
</div>

<h4>23.1 RQ的定义</h4>

<p>一个约化双四元数 q 可以写成：</p>

<div class="kg-step">
  <strong>q = q₀ + q₁i + q₂j + q₃k</strong>
  <br>其中：
  <br>· q₀ 是实部（标量部分）
  <br>· q₁, q₂, q₃ 是三个虚部分量
  <br>· i的平方 = -1（椭圆虚数，对应欧几里得空间）
  <br>· j的平方 = +1（双曲虚数，对应双曲空间）
  <br>· k的平方 = -1（椭圆虚数，对应欧几里得空间）
</div>

<div class="kg-compare">
  <div class="kg-card">
    <h4>i 和 k：椭圆虚数（平方=-1）</h4>
    <p>对应欧几里得空间中的周期性振荡信号。就像<b>钟摆</b>——来回摆动，永远在重复。e的i次方 = cos(θ) + i·sin(θ)，描述的是圆周运动。RGB图像中的R通道和B通道编码到 i 和 k 上。</p>
  </div>
  <div class="kg-card">
    <h4>j：双曲虚数（平方=+1）</h4>
    <p>对应双曲空间中的指数增长/衰减信号。就像<b>弹弓</b>——拉得越远，弹得越远。e的j次方 = cosh(θ) + j·sinh(θ)，描述的是双曲运动。RGB图像中的G通道编码到 j 上。</p>
  </div>
</div>

<h4>23.2 乘法规则表</h4>

<p>RQ最核心的特性是<b>乘法可交换</b>——也就是说，对于任意两个RQ数 p 和 q，都有 p×q = q×p。下面是完整的4×4乘法规则表：</p>

<table>
<thead><tr><th>×</th><th>1</th><th>i</th><th>j</th><th>k</th></tr></thead>
<tbody>
<tr><td><b>1</b></td><td>1</td><td>i</td><td>j</td><td>k</td></tr>
<tr><td><b>i</b></td><td>i</td><td>-1</td><td>k</td><td>-j</td></tr>
<tr><td><b>j</b></td><td>j</td><td>k</td><td>+1</td><td>i</td></tr>
<tr><td><b>k</b></td><td>k</td><td>-j</td><td>i</td><td>-1</td></tr>
</tbody>
</table>

<div class="kg-step">
  <strong>关键乘法规则</strong>：
  <br>· i × j = j × i = k （可交换！）
  <br>· j × k = k × j = i （可交换！）
  <br>· i × k = k × i = <b>-j</b> （可交换，但结果是<b>负的</b>！注意这个负号）
  <br>· j × j = +1 （双曲虚数的平方是正的，这是RQ与四元数最大的区别）
</div>

<div class="kg-step">
  <strong>对比四元数的不可交换性</strong>：在四元数中，i×j = k 但 j×i = -k，两个结果差一个负号——这就是"不可交换"。而在RQ中，i×j = j×i = k，完全相等。这个看似微小的差别，却是RQ能支持卷积定理的根本原因。
</div>

<h4>23.3 共轭与模长</h4>

<div class="kg-step">
  <strong>共轭 (Conjugate)</strong>：q的共轭 = q₀ - q₁i - q₂j - q₃k
  <br>就是把所有虚部的符号取反。共轭在RQ运算中非常重要——比如计算模长、定义内积都需要用到共轭。
</div>

<div class="kg-step">
  <strong>模长 (Norm)</strong>：‖q‖的平方 = q₀的平方 + q₁的平方 - q₂的平方 + q₃的平方
  <br>注意这里 q₂ 前面是<b>减号</b>！因为 j的平方=+1。这使得RQ的范数是"不定范数"，符号类型为 (3,1)——三个正项加一个负项。这种"不定性"正是RQ能同时描述欧几里得空间和双曲空间的原因。
</div>

<div class="kg-step">
  <strong>本章核心</strong>：RQ = q₀ + q₁i + q₂j + q₃k，其中i和k是椭圆虚数（平方=-1，像钟摆振荡），j是双曲虚数（平方=+1，像弹弓增长）。乘法完全可交换（i×j=j×i=k），共轭取反所有虚部，模长是不定范数（q₂前面是减号）。i/k对应RGB中的R/B通道（周期信号），j对应G通道（双曲信号）。
</div>

</div></div>
<div class="kg-section" id="kg-s24">
<div class="kg-accordion-header" onclick="kgToggleAcc(this)"><h3>二十四、超复数神经网络 vs 实值神经网络——为什么要"升维"？</h3><span class="kg-acc-icon">▼</span></div>
<div class="kg-accordion-body">

<p>现在我们来回答一个关键问题：既然实值神经网络已经这么强大了，为什么还要用超复数（RQ）神经网络？答案在于一个词——<b>耦合</b>。</p>

<div class="kg-img-wrap">
  <picture class="kg-picture"><source srcset="reading-notes/assets/knowledge-rq-vs-real.webp" type="image/webp"><img src="reading-notes/assets/knowledge-rq-vs-real-thumb.webp" data-full="reading-notes/assets/knowledge-rq-vs-real.webp" alt="实值网络 vs RQ网络处理RGB对比" class="kg-img kg-img-lazy" loading="lazy" decoding="async"></picture>
  <div class="kg-caption">图：实值网络把RGB三通道拆开独立处理（左），RQ网络把RGB编码为一个整体同时处理（右）</div>
</div>

<h4>24.1 实值网络怎么处理RGB？</h4>

<div class="kg-step">
  <strong>实值网络的做法</strong>：把RGB图像的三个通道（红R、绿G、蓝B）<b>各自独立</b>处理。每个通道用一组独立的卷积核做卷积，三组权重之间没有任何信息交流。就像三个人各干各的——红通道的人只管红，绿通道的人只管绿，蓝通道的人只管蓝，彼此不说话。
</div>

<div class="kg-compare">
  <div class="kg-card">
    <h4>实值网络的问题</h4>
    <p>· 需要三组独立权重，参数量大<br>· 通道间无耦合，无法建模颜色间的关系<br>· 颜色保真度低——容易产生色偏<br>· 比如处理一片红色天空时，R通道说"很红"，但G和B通道不知道，可能把背景搞乱</p>
  </div>
  <div class="kg-card">
    <h4>RQ网络的解法</h4>
    <p>· 把RGB编码为一个RQ数：q = R·i + G·j + B·k<br>· 用<b>一个</b>RQ卷积核同时处理三通道<br>· 通道间天然耦合——R、G、B的信息在卷积运算中自动交互<br>· 参数量减少约4倍</p>
  </div>
</div>

<h4>24.2 RGB如何编码为RQ？</h4>

<div class="kg-step">
  <strong>RGB 到 RQ 编码</strong>：q = R·i + G·j + B·k
  <br>· R（红）编码到 i 分量（椭圆虚数，平方=-1）
  <br>· G（绿）编码到 j 分量（双曲虚数，平方=+1）
  <br>· B（蓝）编码到 k 分量（椭圆虚数，平方=-1）
  <br>· 实部 q₀ 通常设为0或用于编码其他信息
  <br>这样，一个像素的RGB三通道就被"打包"成了一个4维的RQ数。
</div>

<h4>24.3 RQ卷积的矩阵展开</h4>

<p>RQ卷积看似复杂，但本质上可以用一个4×4矩阵来等价表示。当两个RQ数做乘法时，可以展开为实数矩阵运算：</p>

<table>
<thead><tr><th></th><th>q₀</th><th>q₁(i)</th><th>q₂(j)</th><th>q₃(k)</th></tr></thead>
<tbody>
<tr><td><b>实部</b></td><td>+w₀</td><td>-w₁</td><td>+w₂</td><td>-w₃</td></tr>
<tr><td><b>i部</b></td><td>+w₁</td><td>+w₀</td><td>-w₃</td><td>+w₂</td></tr>
<tr><td><b>j部</b></td><td>+w₂</td><td>+w₃</td><td>+w₀</td><td>+w₁</td></tr>
<tr><td><b>k部</b></td><td>+w₃</td><td>-w₂</td><td>+w₁</td><td>+w₀</td></tr>
</tbody>
</table>

<div class="kg-step">
  <strong>矩阵展开的含义</strong>：RQ卷积核 w = w₀ + w₁i + w₂j + w₃k 只有4个自由参数，但它通过这个4×4矩阵的约束，自动实现了四通道之间的<b>加权耦合</b>。对比实值网络需要16个独立参数才能实现同等耦合效果，RQ网络的参数效率提升了4倍！
</div>

<h4>24.4 三种网络对比</h4>

<table>
<thead><tr><th>特性</th><th>实值网络</th><th>四元数网络</th><th>RQ网络</th></tr></thead>
<tbody>
<tr><td><b>RGB编码</b></td><td>三通道独立</td><td>R+Gi+Bj（3虚部）</td><td>Ri+Gj+Bk（3虚部）</td></tr>
<tr><td><b>参数量</b></td><td>基准（最多）</td><td>减少约1/3</td><td><b>减少约3/4</b></td></tr>
<tr><td><b>通道耦合</b></td><td>无（独立处理）</td><td>有</td><td><b>有</b></td></tr>
<tr><td><b>乘法可交换</b></td><td>是（实数天然可交换）</td><td><b>否</b></td><td><b>是</b></td></tr>
<tr><td><b>卷积定理</b></td><td>成立</td><td><b>不成立</b></td><td><b>成立</b></td></tr>
<tr><td><b>频域分析</b></td><td>支持FFT</td><td>困难</td><td><b>支持RQ-FFT</b></td></tr>
<tr><td><b>颜色保真度</b></td><td>一般（易色偏）</td><td>较好</td><td><b>最好</b></td></tr>
</tbody>
</table>

<div class="kg-step">
  <strong>Clifford代数的瓶颈</strong>：有人问，为什么不直接用更高维的Clifford代数？因为高维Clifford代数的乘法<b>不可交换</b>（和四元数一样的问题），导致傅里叶变换困难、卷积定理不成立。RQ的可交换性恰恰解决了这个瓶颈——它是"刚好够用"的甜点：既有多通道耦合能力，又保持了乘法可交换。
</div>

<div class="kg-step">
  <strong>泛化能力</strong>：RQ的乘法规则对卷积核的自由度施加了强约束——4个参数决定16个矩阵元素的位置和符号。这种约束就像给网络加了"正则化"，降低了过拟合风险。实验表明，RQ网络在去雨任务上的泛化能力优于同等容量的实值网络。
</div>

</div>

<h4>25.1 三阶段架构总览</h4>

<div class="kg-flow">
  <span class="kg-node" style="background:#6366f1;color:#fff;">输入RGB图</span>
  <span class="kg-arrow">→</span>
  <span class="kg-node" style="background:#0ea5e9;color:#fff;">C-Zero Padding（RGB到RQ）</span>
  <span class="kg-arrow">→</span>
  <span class="kg-node" style="background:#f59e0b;color:#fff;">双分支U-Net主干</span>
  <span class="kg-arrow">→</span>
  <span class="kg-node" style="background:#a855f7;color:#fff;">三阶段重建尾(RM)</span>
  <span class="kg-arrow">→</span>
  <span class="kg-node" style="background:#10b981;color:#fff;">去雨输出图</span>
</div>

<div class="kg-step">
  <strong>阶段一：通道填充头 (C-Zero Padding)</strong>——把RGB图像转换为RQ表示。RGB三个通道分别编码到RQ的 i、j、k 三个虚部，实部补零。就像把三张单独的彩色胶片"叠"成一张超复数胶片。
</div>

<div class="kg-step">
  <strong>阶段二：双分支U-Net主干</strong>——核心部分。雨纹分支专注于提取雨纹特征，背景分支专注于恢复干净背景。两个分支通过DBJRM模块交互信息，再通过RQ-SCformer做空间补偿。
</div>

<div class="kg-step">
  <strong>阶段三：三阶段重建尾 (Reconstruction Module, RM)</strong>——生成三个输出：去雨图（最终结果）、雨残差（提取的雨纹）、重建雨图（去雨图+雨残差，用于一致性约束）。三个输出互相约束，确保"去雨"和"保背景"的平衡。
</div>

<h4>25.2 双分支设计</h4>

<div class="kg-compare">
  <div class="kg-card">
    <h4>雨纹分支 (Rain Streak Branch)</h4>
    <p>专注于<b>提取雨纹特征</b>。就像一个"找雨"专家——它的任务是从图像中把雨丝、雨滴的特征分离出来。这个分支的输出是雨残差图。</p>
  </div>
  <div class="kg-card">
    <h4>背景分支 (Background Branch)</h4>
    <p>专注于<b>恢复干净背景</b>。就像一个"修复"专家——它的任务是在去掉雨纹后，把背景的细节、纹理、颜色补回来。这个分支的输出是去雨图。</p>
  </div>
</div>

<h4>25.3 DBJRM：双分支联合表示模块</h4>

<div class="kg-step">
  <strong>DBJRM (Dual-Branch Joint Representation Module)</strong> 由两部分组成：
  <br>· <b>模块交互 (MI, Module Interaction)</b>：让雨纹分支和背景分支的特征互相传递。就像两个专家定期开会交流——雨纹分支告诉背景分支"这里有雨"，背景分支告诉雨纹分支"这里背景很复杂，别误伤"。
  <br>· <b>级联残差块 (CRB, Cascaded Residual Block)</b>：在交互后的特征上做深度提炼。残差连接确保信息不丢失，级联结构逐步精炼特征。
</div>

<h4>25.4 RQ-SCformer：空间补偿Transformer</h4>

<div class="kg-img-wrap">
  <picture class="kg-picture"><source srcset="reading-notes/assets/knowledge-rq-attention.webp" type="image/webp"><img src="reading-notes/assets/knowledge-rq-attention-thumb.webp" data-full="reading-notes/assets/knowledge-rq-attention.webp" alt="RQ域三种注意力机制" class="kg-img kg-img-lazy" loading="lazy" decoding="async"></picture>

</div>

<div class="kg-step">
  <strong>RQ-SCformer (RQ Spatial Compensation Transformer)</strong> 的两大核心：
  <br>· <b>自注意力 (SA, Self-Attention)</b>：在特征维度上计算注意力权重，让网络关注雨纹密集的区域。
  <br>· <b>Inception架构</b>：多尺度并行——同时用不同大小的卷积核提取特征，既看局部雨丝又看全局结构。就像一个人同时用放大镜和望远镜观察，细节和全局都不放过。
</div>

<h4>25.5 RQ域三种注意力</h4>

<table>
<thead><tr><th>注意力</th><th>全称</th><th>作用</th><th>类比</th></tr></thead>
<tbody>
<tr><td><b>RQ-SAU</b></td><td>空间注意力</td><td>定位雨纹在图像中的<b>空间位置</b></td><td>像聚光灯——照亮舞台上有雨的区域</td></tr>
<tr><td><b>RQ-CAU</b></td><td>通道注意力</td><td>增强对雨纹敏感的<b>特征通道</b></td><td>像调音台——调高雨纹相关频段的音量</td></tr>
<tr><td><b>RQ-EGAU</b></td><td>增强门控注意力</td><td><b>平衡</b>去雨强度与背景保持</td><td>像音量旋钮——去雨太狠就调低，不够就调高</td></tr>
</tbody>
</table>

<div class="kg-step">
  <strong>三种注意力的协作</strong>：SAU先找到"哪里有雨"，CAU再决定"用哪些特征去雨"，EGAU最后把控"去多少雨才不伤背景"。三者形成"定位→增强→调控"的完整链条。
</div>

var kgScrollCleanup = null;
function kgInitTracking() {
  if (kgScrollCleanup) { kgScrollCleanup(); kgScrollCleanup = null; }
  var panel = document.getElementById('knowledgePanel');
  var fill = document.getElementById('kgProgressFill');
  var main = document.getElementById('kgMain');
  var tocLinks = document.querySelectorAll('#kgToc a');
  var sections = document.querySelectorAll('.kg-section');
  if (!fill || !main || !panel) return;
  function onScroll() {
    if (panel.style.display === 'none') return;
    // Progress
    var rect = main.getBoundingClientRect();
    var scrolled = Math.max(0, -rect.top);
    var total = Math.max(1, rect.height - window.innerHeight);
    var pct = Math.min(100, (scrolled / total) * 100);
    fill.style.width = pct + '%';
    // TOC active
    sections.forEach(function(sec, i) {
      var r = sec.getBoundingClientRect();
      if (r.top <= 120) {
        tocLinks.forEach(function(l) { l.classList.remove('kg-toc-active'); });
        if (tocLinks[i]) tocLinks[i].classList.add('kg-toc-active');
      }
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  kgScrollCleanup = function() { window.removeEventListener('scroll', onScroll); };
}

}

var _demoStates = {};

function _ensureTooltip(cid) {
  var wrap = document.getElementById(cid).parentNode;
  var tip = document.getElementById('tooltip-' + cid);
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'tooltip-' + cid;
    tip.className = 'demo-tooltip';
    wrap.appendChild(tip);
  }
  return tip;
}

function showDemoTooltip(cid, text, x, y) {
  var tip = _ensureTooltip(cid);
  tip.textContent = text;
  tip.style.left = Math.min(x + 12, 500) + 'px';
  tip.style.top = Math.max(y - 40, 5) + 'px';
  tip.classList.add('visible');
}

function hideDemoTooltip(cid) {
  var tip = document.getElementById('tooltip-' + cid);
  if (tip) tip.classList.remove('visible');
}

function registerDemoState(cid, state) {
  _demoStates[cid] = state;
  // 绑定鼠标事件
  var canvas = document.getElementById(cid);
  if (!canvas) return;
  canvas.addEventListener('mousemove', function(e) {
    var rect = canvas.getBoundingClientRect();
    state._mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    state._my = (e.clientY - rect.top) * (canvas.height / rect.height);
  });
  canvas.addEventListener('mouseleave', function() {
    state._mx = -1; state._my = -1;
    hideDemoTooltip(cid);
  });
}

function toggleDemo(cid) {
  var st = _demoStates[cid];
  if (!st) return;
  st.running = !st.running;
  var btn = document.getElementById('btn-play-' + cid);
  if (btn) btn.textContent = st.running ? '暂停' : '播放';
  if (st.running && st._drawFn) st._drawFn();
}

function setDemoSpeed(cid, val) {
  var st = _demoStates[cid];
  if (st) st.speed = parseFloat(val);
  var lbl = document.getElementById('speed-label-' + cid);
  if (lbl) lbl.textContent = parseFloat(val).toFixed(2) + 'x';
}

function resetDemo(cid) {
  var st = _demoStates[cid];
  if (!st) return;
  st.t = 0;
  st.running = true;
  var btn = document.getElementById('btn-play-' + cid);
  if (btn) btn.textContent = '暂停';
}

function initPerceptronDemo() {
  var canvas = document.getElementById('canvas-perceptron-demo');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var t = 0;
  function draw() {
    ctx.clearRect(0, 0, W, H);
    var inputs = [
      { label: 'x\u2081', val: 0.8, w: 0.5 },
      { label: 'x\u2082', val: 0.5, w: -0.3 },
      { label: 'x\u2083', val: 0.3, w: 0.7 }
    ];
    var inX = 40, neuronX = W - 80, neuronY = H / 2;
    var pulseT = (t % 60) / 60;
    for (var i = 0; i < inputs.length; i++) {
      var iy = 25 + i * 35;
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(inX, iy, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#5B8AB8';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px Microsoft YaHei';
      ctx.textAlign = 'center';
      ctx.fillText(inputs[i].label, inX, iy + 4);
      var lineProgress = Math.max(0, Math.min(1, pulseT * 3 - i * 0.3));
      var weightColor = inputs[i].w > 0 ? '#10b981' : '#CC5050';
      ctx.strokeStyle = weightColor;
      ctx.lineWidth = 1 + Math.abs(inputs[i].w) * 2;
      ctx.globalAlpha = 0.3 + lineProgress * 0.5;
      ctx.beginPath();
      ctx.moveTo(inX + 12, iy);
      ctx.lineTo(neuronX - 18, neuronY);
      ctx.stroke();
      ctx.globalAlpha = 1;
      var midX = (inX + neuronX) / 2;
      var midY = (iy + neuronY) / 2;
      ctx.fillStyle = weightColor;
      ctx.font = '11px Microsoft YaHei';
      ctx.fillText('w=' + inputs[i].w, midX, midY - 5);
      if (lineProgress > 0 && lineProgress < 1) {
        var px = inX + 12 + (neuronX - 18 - inX - 12) * lineProgress;
        var py = iy + (neuronY - iy) * lineProgress;
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    var sum = 0;
    for (var i = 0; i < inputs.length; i++) { sum += inputs[i].val * inputs[i].w; }
    sum += 0.1;
    var activated = 1 / (1 + Math.exp(-sum));
    var neuronPulse = 0.7 + 0.3 * Math.sin(t * 0.1);
    ctx.fillStyle = 'rgba(99,102,241,' + neuronPulse + ')';
    ctx.beginPath();
    ctx.arc(neuronX, neuronY, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#6366f1';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px Microsoft YaHei';
    ctx.fillText('\u03a3->\u03c3', neuronX, neuronY + 3);
    ctx.fillStyle = '#34d399';
    ctx.font = 'bold 12px Microsoft YaHei';
    ctx.textAlign = 'left';
    ctx.fillText('y=' + activated.toFixed(3), neuronX + 25, neuronY + 3);
    ctx.fillStyle = '#818cf8';
    ctx.font = '11px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText('y = \u03c3(\u03a3 w\u1d62x\u1d62 + b)', W / 2, H - 5);
    t += 1;
    requestAnimationFrame(draw);
  }
  draw();
}

function initLossDemo() {
  var canvas = document.getElementById('canvas-loss-demo');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var t = 0;
  function draw() {
    ctx.clearRect(0, 0, W, H);
    var cellW = (W - 40) / 2;
    var labels = ['MSE Loss（碗形曲面）', 'Cross-Entropy Loss'];
    var colors = ['#7BA7CC', '#fb7185'];
    for (var p = 0; p < 2; p++) {
      var px = 20 + p * (cellW + 10);
      var py = 15;
      var pw = cellW - 10;
      var ph = H - 40;
      ctx.fillStyle = 'transparent';
      ctx.fillRect(px, py, pw, ph);
      ctx.strokeStyle = colors[p];
      ctx.lineWidth = 1.5;
      ctx.strokeRect(px, py, pw, ph);
      ctx.fillStyle = colors[p];
      ctx.font = 'bold 12px Microsoft YaHei';
      ctx.textAlign = 'center';
      ctx.fillText(labels[p], px + pw / 2, py - 3);
      var cx = px + pw / 2;
      var cy = py + ph / 2 + 5;
      var minR = 5;
      var maxR = Math.min(pw, ph) / 2 - 8;
      for (var r = maxR; r > minR; r -= 4) {
        var ratio = (r - minR) / (maxR - minR);
        var lossVal = ratio * (p === 0 ? ratio : Math.sqrt(ratio));
        var brightness = Math.floor(200 - lossVal * 120);
        ctx.strokeStyle = 'rgba(' + brightness + ',' + (brightness + 10) + ',' + (brightness + 20) + ',0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.arc(cx, cy, 4, 0, Math.PI * 2);
      ctx.fill();
      var ballAngle = t * 0.03 + p * Math.PI;
      var ballR = maxR * (0.7 + 0.25 * Math.cos(t * 0.04 + p));
      var bx = cx + Math.cos(ballAngle) * ballR;
      var by = cy + Math.sin(ballAngle) * ballR;
      ctx.strokeStyle = 'rgba(212,165,116,0.3)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 2]);
      ctx.beginPath();
      for (var s = 0; s < 20; s++) {
        var sa = (t - s * 3) * 0.03 + p * Math.PI;
        var sr = maxR * (0.7 + 0.25 * Math.cos((t - s * 3) * 0.04 + p));
        var sx = cx + Math.cos(sa) * sr;
        var sy = cy + Math.sin(sa) * sr;
        if (s === 0) ctx.moveTo(sx, sy);
        else ctx.lineTo(sx, sy);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(bx, by, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#B88A5A';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#10b981';
      ctx.font = '11px Microsoft YaHei';
      ctx.textAlign = 'center';
      ctx.fillText('min', cx, cy + 15);
    }
    ctx.fillStyle = '#818cf8';
    ctx.font = '11px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText('小球沿梯度方向滚向最低点（最优解）', W / 2, H - 5);
    t += 1;
    requestAnimationFrame(draw);
  }
  draw();
}

      var angle = Math.atan(15 * 0.06 * Math.cos(sx * 0.06));
      ctx.save();
      ctx.translate(rx + 10 + sx + stripW / 2, ry + curveY);
      ctx.rotate(angle);
      ctx.fillStyle = 'rgba(212,165,116,0.4)';
      ctx.fillRect(-stripW / 2, -stripH / 2, stripW, stripH);
      ctx.strokeStyle = '#B88A5A';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(-stripW / 2, -stripH / 2, stripW, stripH);
      ctx.restore();
    }
    ctx.fillStyle = '#818cf8';
    ctx.font = '11px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText('同一条曲线：正方形方块多且碎，细长条带少且贴合', W / 2, H - 5);
    t += 1;
    requestAnimationFrame(draw);
  }
  draw();
}
